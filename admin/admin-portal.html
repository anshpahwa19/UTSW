<style>
/* Admin tokens. Block 1 is designs/guest/src.html lines 11–61, copied unchanged (the app palette, type, spacing,
   radii, motion, focus and the board chrome tokens). Never edit block 1 here; change designs/guest and re-copy. */
:root{
  /* Board chrome (theme-aware) */
  --bd-bg:#F2F5F8; --bd-panel:#FFFFFF; --bd-ink:#1F2A33; --bd-muted:#5B6770; --bd-line:#D5DDE5; --bd-accent:#004278; --bd-chip:#EBF0F5; --bd-bezel:#0E2236;

  /* ===== App palette (identical across themes – the app frame is a brand surface) ===== */
  --blue:#004278; --blue-80:#336893; --pms542:#7BAFD4; --cyan:#00A9E0;
  --bg:#F7F8FA; --surface:#FFFFFF; --tint:#EBF0F5; --tint-2:#D1DDE6; --sky:#D6E4F0;
  --line:#D5DDE5; --line-strong:#808B96;
  --ink:#333333; --ink-2:#5B6770;
  --on-blue-2:#D6E4F0; --on-blue-3:#A9C7E0;
  --alert:#B0003A;
  /* Theme roles. --blue is the accent for text and icons; --brand is the large Blue surface (always #004278, so the
     logo's own tile never shows an edge); --ctl is Blue on small controls (buttons, solid circles, selected chips). */
  --brand:#004278; --ctl:#004278; --alert-ink:#B0003A;
  --field-on-brand:#FFFFFF; --bar-glass:rgba(255,255,255,.94); --inverse:#333333; --on-inverse:#FFFFFF;
  --map-bg:#E6EDF3; --map-block:#D6E4F0; --map-block-2:#D1DDE6; --map-road:#FFFFFF;

  --ts:1;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  /* Spacing – one 4-pt scale */
  --s1:4.0px; --s2:8.0px; --s3:12.0px; --s4:16.0px; --s6:24.0px; --s8:32.0px; --s10:40.0px; --s12:48.0px;
  --hit:44.0px; --hit-lg:48.0px;

  /* Radii */
  --r-sm:8.0px; --r-md:12.0px; --r-lg:16.0px; --r-xl:24.0px; --r-pill:999px;

  /* Motion */
  --d-fast:150ms; --d-base:240ms; --d-slow:400ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in-out:cubic-bezier(.65,0,.35,1);
  --spring-snappy:linear(0, 0.066, 0.218, 0.401, 0.58, 0.735, 0.857, 0.945, 1.003, 1.037, 1.051, 1.054, 1.049, 1.04, 1.03, 1.02, 1.012, 1.006, 1.002, 0.999, 0.998, 0.997, 0.997, 0.997, 1);
  --spring-gentle:linear(0, 0.049, 0.158, 0.285, 0.412, 0.526, 0.624, 0.706, 0.772, 0.825, 0.867, 0.899, 0.924, 0.943, 0.957, 0.968, 0.976, 0.983, 0.987, 0.991, 0.993, 0.995, 0.996, 0.997, 1);
  --d-snappy:360ms; --d-gentle:400ms;

  --shadow-1:0 1px 2px rgba(16,38,60,.06), 0 2px 8px rgba(16,38,60,.06);
  --shadow-2:0 4px 12px rgba(16,38,60,.10), 0 16px 40px rgba(16,38,60,.14);
  --focus:0 0 0 2px #FFFFFF, 0 0 0 5px #004278;
  --focus-on-blue:0 0 0 2px #004278, 0 0 0 4px #FFFFFF;
  --glow:radial-gradient(90% 70% at 100% 20%, rgba(0,169,224,.30) 0, rgba(0,169,224,0) 70%);
  --hero-glow:radial-gradient(75% 55% at 100% 58%, rgba(0,169,224,.26) 0, rgba(0,169,224,0) 72%);

  /* Icon axes – inherited, so a container's state (selected, pressed, dark) reaches its glyph */
  --fill:0; --wght:500; --grad:0;
}
/* Tokens that follow the text-size setting are declared again on .phone so they resolve against its --ts */
:root,.phone{
  --t12:calc(12.0px * var(--ts)); --t14:calc(14.0px * var(--ts)); --t16:calc(16.0px * var(--ts)); --t18:calc(18.0px * var(--ts));
  --t20:calc(20.0px * var(--ts)); --t24:calc(24.0px * var(--ts)); --t28:calc(28.0px * var(--ts)); --t32:calc(32.0px * var(--ts));
  --i16:calc(16.0px * var(--ts)); --i20:calc(20.0px * var(--ts)); --i24:calc(24.0px * var(--ts)); --i32:calc(32.0px * var(--ts));
  --dot40:calc(40.0px * var(--ts)); --dot48:calc(48.0px * var(--ts)); --dot56:calc(56.0px * var(--ts));
}

/* Block 2 – admin-only layout tokens (not in the mobile files) */
:root{
  --a-sidebar:272px;          /* persistent sidebar */
  --a-header:64px;            /* top header */
  --a-content-max:1440px;     /* main column max width */
  --a-gutter:24px;            /* page side padding */
  --a-row:48px;               /* table row min height */
  --a-dense:14.0px;           /* dense body for tables and side notes */
  --a-preview-scale:.8;       /* phone preview scale */
}

/* Block 3 – the Admin follows the viewer's theme. Dark values are the designs/guest .phone.dark values (lines 1010–1021),
   unchanged; --brand stays UT Southwestern Blue in both themes, as in the app. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1620; --surface:#16222E; --tint:#1F3042; --tint-2:#2A4157; --sky:#1F3042;
    --line:#2B3C4D; --line-strong:#7D8E9E; --ink:#E6EDF3; --ink-2:#A6B4C0;
    --blue:#8CC0EA; --ctl:#2D6CA6; --alert-ink:#FF8AA8;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
    --shadow-2:0 4px 12px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    --focus:0 0 0 2px #0D1620, 0 0 0 5px #8CC0EA; --inverse:#E6EDF3; --on-inverse:#0D1620;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1620; --surface:#16222E; --tint:#1F3042; --tint-2:#2A4157; --sky:#1F3042;
  --line:#2B3C4D; --line-strong:#7D8E9E; --ink:#E6EDF3; --ink-2:#A6B4C0;
  --blue:#8CC0EA; --ctl:#2D6CA6; --alert-ink:#FF8AA8;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-2:0 4px 12px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  --focus:0 0 0 2px #0D1620, 0 0 0 5px #8CC0EA; --inverse:#E6EDF3; --on-inverse:#0D1620;
  color-scheme:dark;
}

/* MyCare Admin – components and layouts. Every color, radius, focus ring and motion value comes from tokens.css
   (designs/guest tokens, unchanged) plus the admin layout tokens. Layout: Blue top bar · persistent sidebar · content. */
*{box-sizing:border-box}
html{height:100%; background:var(--bg); -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16.0px; line-height:1.5; font-optical-sizing:auto}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:60; background:var(--brand)}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:var(--blue)}
:focus-visible{outline:none; box-shadow:var(--focus); border-radius:var(--r-sm)}
.vh{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.muted{color:var(--ink-2)}
.nowrap{white-space:nowrap}
.text-link{display:inline-flex; align-items:center; gap:var(--s1); font-weight:600; color:var(--blue); text-decoration:underline; text-underline-offset:3px}

/* Icons: Material Symbols Rounded only (rules from designs/guest) */
.ms{font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal; font-size:24.0px; width:1em; height:1em; line-height:1; display:inline-block; flex:none; overflow:hidden; text-align:center;
  letter-spacing:normal; text-transform:none; white-space:nowrap; direction:ltr; font-feature-settings:"liga"; -webkit-font-smoothing:antialiased; user-select:none;
  --opsz:24; font-variation-settings:"FILL" var(--fill), "wght" var(--wght), "GRAD" var(--grad), "opsz" var(--opsz)}
.ms.s16{font-size:16.0px; --opsz:20} .ms.s20{font-size:20.0px; --opsz:20} .ms.s32{font-size:32.0px; --opsz:32}
.ms.f1{--fill:1}
html:not(.ms-ready) .ms{color:transparent!important}

/* ===================== Shell ===================== */
.skip{position:absolute; left:var(--s4); top:-100px; z-index:100; padding:var(--s3) var(--s4); background:var(--surface); color:var(--blue); font-weight:700; border-radius:var(--r-md); box-shadow:var(--shadow-2)}
.skip:focus{top:calc(var(--s2) + env(safe-area-inset-top, 0px))}
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:40; height:var(--a-header); display:flex; align-items:center; gap:var(--s4);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:var(--brand); color:#FFFFFF; --grad:-25}
.topbar :focus-visible{box-shadow:var(--focus-on-blue)}
.brand{display:flex; align-items:center; gap:var(--s2); text-decoration:none; color:#FFFFFF; flex:none; border-radius:var(--r-sm); margin-left:calc(-1 * var(--s4))}
.brand img{display:block; width:200px; height:auto}
.brand-admin{font-size:var(--t14); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--on-blue-2); padding-left:var(--s3); border-left:1px solid rgba(255,255,255,.3); line-height:24px}
.env-pill,.mock-flag{display:inline-flex; align-items:center; gap:var(--s2); min-height:36px; padding:0 var(--s3); border-radius:var(--r-pill); font-size:var(--t14); white-space:nowrap}
.env-pill{background:rgba(255,255,255,.10); box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); color:var(--on-blue-2)}
.env-pill b{color:#FFFFFF}
.mock-flag{background:#FFFFFF; color:var(--brand); font-weight:600; --grad:0}
.mf-short{display:none}
.user{margin-left:auto; position:relative}
.user-btn{display:flex; align-items:center; gap:var(--s2); min-height:var(--hit); padding:0 var(--s2) 0 var(--s1); border:0; border-radius:var(--r-pill); background:transparent; color:#FFFFFF; cursor:pointer; text-align:left}
.user-btn:hover{background:rgba(255,255,255,.10)}
.avatar{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:#FFFFFF; color:var(--brand); font-size:var(--t14); font-weight:700; flex:none}
.user-txt{display:grid; line-height:1.25}
.user-n{font-size:var(--t14); font-weight:600}
.user-r{font-size:var(--t12); color:var(--on-blue-2)}
.user-btn[aria-expanded="true"] .ms{transform:rotate(180deg)}
.user-menu{position:absolute; right:0; top:calc(100% + var(--s2)); width:320px; max-width:calc(100vw - 32px); z-index:50; background:var(--surface); color:var(--ink); border-radius:var(--r-lg); box-shadow:var(--shadow-2), 0 0 0 1px var(--line); padding:var(--s2); --grad:0}
.user-menu :focus-visible{box-shadow:var(--focus)}
.um-id{padding:var(--s3)}
.um-n{font-weight:700}
.um-e{font-size:var(--t14); color:var(--ink-2); overflow-wrap:anywhere}
.um-s{margin-top:var(--s2)}
.um-roles{border:0; border-top:1px solid var(--line); margin:0; padding:var(--s3)}
.um-roles legend{float:left; width:100%; font-weight:700; font-size:var(--t14); margin-bottom:var(--s2); display:flex; gap:var(--s2); align-items:center}
.proto{display:inline-block; font-size:var(--t12); font-weight:700; color:var(--ink-2); background:var(--bg); box-shadow:inset 0 0 0 1px var(--line); padding:0 var(--s2); border-radius:var(--r-pill); line-height:20px; white-space:nowrap}
.um-note{clear:both; font-size:var(--t12); color:var(--ink-2); margin-top:var(--s2)}
.um-row{display:flex; align-items:center; justify-content:space-between; gap:var(--s3); padding:var(--s3); border-top:1px solid var(--line); font-size:var(--t14); font-weight:600}
.um-acts{border-top:1px solid var(--line); padding-top:var(--s1); display:grid}
.um-act{display:flex; align-items:center; gap:var(--s3); min-height:var(--hit); padding:0 var(--s3); border:0; background:none; border-radius:var(--r-md); text-align:left; font-size:var(--t14); font-weight:600; cursor:pointer; color:var(--ink)}
.um-act .ms{color:var(--blue)}
.um-act:hover{background:var(--tint)}

.layout{display:grid; grid-template-columns:var(--a-sidebar) minmax(0,1fr); min-height:calc(100vh - var(--a-header))}
.sidebar{position:sticky; top:calc(var(--a-header) + env(safe-area-inset-top, 0px)); align-self:start; height:calc(100vh - var(--a-header) - env(safe-area-inset-top, 0px)); overflow-y:auto;
  background:var(--surface); box-shadow:1px 0 0 var(--line); padding:var(--s3) var(--s2) var(--s6); padding-left:max(8px, env(safe-area-inset-left, 0px))}
.nav{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.nav ul{list-style:none; margin:0; padding:0}
.nav-head,.nav-link{display:flex; align-items:center; gap:var(--s3); width:100%; min-height:var(--hit); padding:0 var(--s3); border:0; border-radius:var(--r-md); background:none; color:var(--ink); font-size:var(--t14); font-weight:600; text-align:left; text-decoration:none; cursor:pointer}
.nav-head .ms,.single .nav-link > .ms{color:var(--blue)}
.nav-head .chev{margin-left:auto; color:var(--ink-2); transition:transform var(--d-fast) var(--ease-out)}
.nav-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.nav-head:hover,.nav-link:hover{background:var(--tint)}
.nav-link.nested{padding-left:calc(var(--s3) + 20px + var(--s3)); font-weight:400}
.nav-l{flex:1; min-width:0}
.nav-link[aria-current="page"]{background:var(--tint); color:var(--blue); font-weight:700; box-shadow:inset 3px 0 0 var(--ctl)}
.nav-tag{font-size:var(--t12); color:var(--ink-2); white-space:nowrap}
.nav-foot{margin:var(--s6) var(--s3) 0; display:grid; gap:var(--s2); font-size:var(--t12); color:var(--ink-2)}
.nav-toggle{display:none}
.scrim{position:fixed; inset:0; z-index:34; background:rgba(0,20,40,.4)}
main{min-width:0; container:main / inline-size}
main:focus{outline:none}
.page{max-width:var(--a-content-max); margin:0 auto; padding-block:var(--s6) var(--s12);
  padding-left:max(var(--a-gutter), env(safe-area-inset-left, 0px)); padding-right:max(var(--a-gutter), env(safe-area-inset-right, 0px)); display:grid; gap:var(--s6)}

/* Page heading and breadcrumbs */
.page-head{display:grid; gap:var(--s2)}
.crumbs ol{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:var(--s1) var(--s2); font-size:var(--t14); color:var(--ink-2)}
.crumbs li{display:flex; align-items:center; gap:var(--s2)}
.crumbs li + li::before{content:"/"; color:var(--line-strong)}
.crumbs a{color:var(--blue); font-weight:600}
.crumbs [aria-current]{color:var(--ink)}
.ph-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--s3)}
.ph-main{display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3)}
h1{font-size:var(--t28); line-height:1.2; font-weight:700; letter-spacing:-.015em; color:var(--blue)}
h1:focus{outline:none}
.lede{max-width:72ch; color:var(--ink-2)}

/* ===================== Buttons ===================== */
.btn{position:relative; min-height:var(--hit); padding:0 var(--s4); border:0; border-radius:var(--r-pill); display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  font-size:var(--t14); font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap; transition:background-color var(--d-fast) var(--ease-out), transform var(--d-snappy) var(--spring-snappy)}
.btn:active{transform:scale(.97)}
.btn-lg{min-height:var(--hit-lg); padding:0 var(--s6); font-size:var(--t16)}
.btn-primary{background:var(--ctl); color:#FFFFFF; --grad:-25}
.btn-primary:hover{background:var(--blue-80)}
.btn-secondary{background:var(--surface); color:var(--blue); box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn-secondary:hover,.btn-text:hover{background:var(--tint)}
.btn-tonal{background:var(--tint); color:var(--blue)}
.btn-tonal:hover{background:var(--tint-2)}
.btn-text{background:transparent; color:var(--blue)}
.btn-danger{background:var(--alert); color:#FFFFFF}
.btn-icon{width:var(--hit); padding:0}
.btn[disabled]{color:var(--ink-2); opacity:.55; cursor:default}
.btn[disabled]:hover{background:transparent}
.btn[aria-disabled="true"]{background:var(--bg); color:var(--ink-2); box-shadow:inset 0 0 0 1.5px var(--line); cursor:not-allowed}
.btn .dots{position:absolute; inset:0; display:none; align-items:center; justify-content:center; gap:6px}
.btn .dots i{width:6px; height:6px; border-radius:50%; background:currentColor; animation:dotHop 600ms var(--ease-in-out) infinite}
.btn .dots i:nth-child(2){animation-delay:100ms} .btn .dots i:nth-child(3){animation-delay:200ms}
.btn.loading > :not(.dots){visibility:hidden}
.btn.loading .dots{display:flex}
@keyframes dotHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}

/* ===================== Badges: icon + word ===================== */
.badge{display:inline-flex; align-items:center; gap:var(--s1); min-height:24px; padding:0 var(--s2) 0 6px; border-radius:var(--r-pill); font-size:var(--t12); font-weight:700; line-height:1.2; white-space:nowrap; vertical-align:middle;
  background:var(--surface); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line-strong)}
.badge-draft,.badge-unsaved{box-shadow:none; background-image:none; outline:1.5px dashed var(--line-strong); outline-offset:-1.5px}
.badge-unsaved{color:var(--ink); background:var(--tint-2); outline-color:var(--ink-2)}
.badge-demo{background:var(--tint); color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue)}
.badge-production,.badge-live{background:var(--ctl); color:#FFFFFF; box-shadow:none; --grad:-25}
.badge-review,.badge-changes{color:var(--blue); box-shadow:inset 0 0 0 1.5px var(--blue)}
.badge-visible{color:var(--blue); background:var(--tint); box-shadow:none}
.badge-hidden{color:var(--ink-2); background:var(--bg)}
.badge-planned,.badge-pending{color:var(--ink); background:var(--bg)}
.badge-error{color:var(--alert-ink); box-shadow:inset 0 0 0 1.5px var(--alert-ink)}
.badge-simulated,.badge-mock{color:var(--ink); background:var(--bg)}

/* ===================== Fields, switch, checkbox, radio, segmented ===================== */
.field{display:grid; gap:var(--s1); margin-top:var(--s4)}
.field label{font-weight:600; font-size:var(--t14)}
.req{font-weight:400; color:var(--ink-2)}
.hint{font-size:var(--t14); color:var(--ink-2)}
.input{width:100%; min-height:var(--hit); padding:var(--s2) var(--s3); border:0; border-radius:var(--r-md); background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line-strong); font-size:var(--t16)}
textarea.input{resize:vertical; line-height:1.5}
.input:focus-visible{box-shadow:inset 0 0 0 2px var(--blue), var(--focus)}
.has-error .input{box-shadow:inset 0 0 0 2px var(--alert-ink)}
.err{display:flex; align-items:center; gap:var(--s1); color:var(--alert-ink); font-size:var(--t14); font-weight:600}
.switch{flex:none; width:52px; height:var(--hit); padding:0; border:0; background:none; display:grid; place-items:center; cursor:pointer; border-radius:var(--r-pill)}
.switch .track{position:relative; width:44px; height:24px; border-radius:var(--r-pill); background:var(--surface); box-shadow:inset 0 0 0 2px var(--line-strong); transition:background-color var(--d-fast) var(--ease-out)}
.switch .track::after{content:""; position:absolute; top:4px; left:4px; width:16px; height:16px; border-radius:50%; background:var(--line-strong); transition:transform var(--d-base) var(--spring-snappy), background-color var(--d-fast)}
.switch[aria-checked="true"] .track{background:var(--ctl); box-shadow:none}
.switch[aria-checked="true"] .track::after{transform:translateX(20px); background:#FFFFFF}
.check,.radio{display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--hit); cursor:pointer; font-size:var(--t14); font-weight:600}
.check input{position:absolute; opacity:0; width:1px; height:1px}

4278!important}\n.mod{animation:none}\n.pv-empty{margin:0 var(--s4); padding:var(--s6) var(--s4); border-radius:var(--r-lg); border:1.5px dashed var(--line-strong); color:var(--ink-2); font-size:var(--t14); text-align:center}\n";

const PREVIEW_JS = "/* Mobile preview \u2013 runs inside the sandboxed preview iframe (srcdoc, no same-origin), never in the Admin page.\n   Markup is adapted from the home renderers in designs/guest/src.html (R.alerts \u2026 R.news, lines 2124\u20132240):\n   same classes and structure, fed by the configuration the Admin posts in instead of the prototype's own state.\n   Every control is inert: the preview shows the layout, it does not run the app. */\n(function () {\n  'use strict';\n  /* Concept \u2192 glyph, the subset of designs/guest ICON_MAP used on the home screen */\n  const ICONS = {\n    home: 'home', findCare: 'stethoscope', place: 'location_on', wayfinding: 'directions_walk', signIn: 'login',\n    search: 'search', alert: 'warning', expand: 'expand_more', messages: 'chat', results: 'lab_profile',\n    visits: 'calendar_month', bill: 'receipt_long', lock: 'lock', urgent: 'acute', video: 'videocam',\n    vaccine: 'vaccines', rank: 'workspace_premium', aid: 'volunteer_activism', countdown: 'schedule',\n    addCal: 'calendar_add_on', refresh: 'refresh', next: 'chevron_right', prev: 'chevron_left', go: 'arrow_forward', menu: 'menu'\n  };\n  const FILLED = { alert: 1 };\n  const esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const ico = (key, size = 24, cls = '') => {\n    const c = ['ms', size === 24 ? '' : 's' + size, FILLED[key] ? 'f1' : '', cls].filter(Boolean).join(' ');\n    return `<span class=\"${c}\" aria-hidden=\"true\">${ICONS[key] || key}</span>`;\n  };\n  const circle = (key, size = 40, cls = '') => `<span class=\"dot${size === 48 ? '' : ' d' + size}${cls ? ' ' + cls : ''}\" aria-hidden=\"true\">${ico(key, size === 40 ? 20 : size === 56 ? 32 : 24)}</span>`;\n  const row = ({ ic, lead, title, sub }) =>\n    `<li><button class=\"row\" type=\"button\">${lead || circle(ic)}<span class=\"txt\"><span class=\"rt\">${esc(title)}</span>${sub ? `<span class=\"rs\">${esc(sub)}</span>` : ''}</span>${ico('next', 20, 'chev')}</button></li>`;\n\n  /* Keep times, abbreviated dates and \"UT Southwestern\" from breaking across lines (designs/guest nbsp) */\n  const NB = [[/(\\d) (a\\.m\\.|p\\.m\\.)/g, '$1\u00a0$2'], [/\\b(Jan|Feb|Aug|Sept|Oct|Nov|Dec)\\. (\\d)/g, '$1.\u00a0$2'], [/UT Southwestern/g, 'UT\u00a0Southwestern']];\n  function nbsp(root) {\n    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);\n    for (let n = w.nextNode(); n; n = w.nextNode()) { const v = NB.reduce((s, [re, to]) => s.replace(re, to), n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }\n  }\n\n  let C = null; /* content posted by the Admin (sample content seeded from designs/guest) */\n  let showAlert = false;\n\n  const R = {\n    alerts() {\n      if (!showAlert || !C.alerts.length) return '';\n      const al = C.alerts[0];\n      return `<section class=\"alerts\" aria-label=\"Emergency alerts\"><div class=\"alert-wrap\"><div class=\"alert\">\n        <div class=\"alert-row\"><span class=\"alert-ico\">${ico('alert')}</span>\n          <div class=\"alert-txt\"><p class=\"alert-kicker\">Alert</p><p class=\"alert-title\">${esc(al.title)}</p></div>\n          <button class=\"alert-tog\" type=\"button\" aria-expanded=\"false\" aria-label=\"Show alert details\">${ico('expand')}</button></div>\n        <div class=\"alert-body\"><div><p>${esc(al.summary)}</p></div></div>\n      </div></div></section>`;\n    },\n    greeting() {\n      return `<section class=\"greet\" aria-labelledby=\"greet-h\">\n        <div class=\"greet-top\"><p class=\"eyebrow\">Welcome to UT Southwestern</p><span class=\"upd-chip\"><span class=\"pill\">${ico('refresh', 16)}<span class=\"upd-time\">Updated 9:41 a.m.</span></span></span></div>\n        <h1 id=\"greet-h\">How can we help today?</h1>\n        <p class=\"sub\">Find a doctor, get directions, and check urgent care wait times \u2013 no account needed.</p>\n      </section>`;\n    },\n    search() {\n      return `<section aria-label=\"Search\">\n        <button class=\"search-field\" type=\"button\">${ico('search')}<span>Search doctors, care, and places</span><span class=\"go\" aria-hidden=\"true\">${ico('go', 20)}</span></button>\n        <div class=\"ts-row\" role=\"group\" aria-label=\"Top searches\"><span class=\"ts-k\" aria-hidden=\"true\">Top</span>${C.top.map(([t]) => `<button class=\"chip glass\" type=\"button\">${esc(t)}</button>`).join('')}</div>\n      </section>`;\n    },\n    signin() {\n      return `<section class=\"locked\" aria-labelledby=\"locked-h\">\n        <div class=\"lk-hd\" aria-hidden=\"true\"><span class=\"sk w1\"></span><span class=\"sk w2\"></span><span class=\"sk w4\"></span></div>\n        <div class=\"lk-bd\" aria-hidden=\"true\"><span class=\"sk w3\"></span><span class=\"sk w4\"></span></div>\n        <div class=\"locked-body\">\n          ${circle('lock', 56)}\n          <h2 id=\"locked-h\">Already a patient? Sign in to MyChart</h2>\n          <p>See your appointments, message your care team, get test results, and pay bills.</p>\n          <div class=\"btns\"><button class=\"btn btn-primary\" type=\"button\">Sign in</button><button class=\"btn btn-secondary\" type=\"button\">Create account</button></div>\n        </div>\n      </section>`;\n    },\n    tiles() {\n      const open = t => `<button class=\"qa-tile\" type=\"button\">${circle(t.ic, 48, 'solid')}<span class=\"qa-txt\"><span class=\"qa-lbl\">${esc(t.lbl)}</span></span></button>`;\n      const locked = t => `<button class=\"qa-tile lockd\" type=\"button\" aria-label=\"${esc(t.lbl)}. Needs MyChart sign-in\">${circle(t.ic, 48)}<span class=\"qa-txt\"><span class=\"qa-lbl\">${esc(t.lbl)}</span></span><span class=\"qa-lock\">${ico('lock', 16)}</span></button>`;\n      return `<section aria-labelledby=\"qa-h\">\n        <div class=\"sec-head\"><h2 id=\"qa-h\">Quick links</h2></div>\n        <div class=\"qa\">${[...C.locked.map(locked), ...C.tiles.map(open)].join('')}</div>\n      </section>`;\n    },\n    featured() {\n      return `<section aria-labelledby=\"feat-h\">\n        <div class=\"sec-head\"><h2 id=\"feat-h\">MedBlog</h2><button class=\"link\" type=\"button\">See all</button></div>\n        <div class=\"car\" role=\"group\" aria-roledescription=\"carousel\" aria-label=\"Latest MedBlog articles\">${C.featured.map(f => `\n          <button class=\"feat\" type=\"button\">\n            <span class=\"feat-art\"><svg viewBox=\"0 0 304 144\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\">${f.art}</svg></span>\n            <span class=\"feat-body\"><span class=\"kick\">${esc(f.kick)}</span><span class=\"feat-title\">${esc(f.title)}</span><span class=\"feat-meta\">${esc(f.meta)}</span></span>\n          </button>`).join('')}\n        </div>\n        <div class=\"car-ctrl\">\n          <span class=\"car-track\" aria-hidden=\"true\"><span class=\"car-thumb\" style=\"width:25%\"></span></span>\n          <div class=\"car-arrows\"><button class=\"icon-btn\" type=\"button\" aria-label=\"Previous article\">${ico('prev')}</button><button class=\"icon-btn\" type=\"button\" aria-label=\"Next article\">${ico('next')}</button></div>\n        </div>\n      </section>`;\n    },\n    services() {\n      return `<section aria-labelledby=\"svc-h\">\n        <div class=\"sec-head\"><h2 id=\"svc-h\">UTSW resources</h2></div>\n        <ul class=\"group\">${C.resources.map(s => row({ ic: s.ic, title: s.t, sub: s.s })).join('')}</ul>\n      </section>`;\n    },\n    campaign() {\n      const k = C.campaign;\n      return `<section class=\"camp\" aria-labelledby=\"camp-h\">\n        <div class=\"camp-top\">\n          <div><p class=\"camp-tag\"><i></i>${esc(k.tag)}</p><h2 id=\"camp-h\">${esc(k.title)}</h2></div>\n          <div class=\"camp-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 96 96\"><g class=\"rings\"><circle cx=\"48\" cy=\"48\" r=\"47\" fill=\"#336893\" opacity=\".55\"/><circle cx=\"48\" cy=\"48\" r=\"38\" fill=\"none\" stroke=\"#7BAFD4\" stroke-width=\"1.5\" stroke-da /* ---------- Utilities: DOM, escaping, icons, dates, device storage, live announcements ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = v => JSON.parse(JSON.stringify(v));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
let idSeq = 0;
const uid = p => `${p}-${Date.now().toString(36)}${(idSeq++).toString(36)}`;

/* Material Symbols Rounded only. build.py collects every glyph named as ic('…') or icon: '…' into the font subset. */
const ic = (name, size = 24, extra = '') => `<span class="ms${size === 24 ? '' : ' s' + size}${extra ? ' ' + extra : ''}" aria-hidden="true">${name}</span>`;

/* AP style dates and times in Central Time (Dallas): Oct. 30, 2026, 9:41 a.m. CT */
const AP_MONTHS = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
const TZ = 'America/Chicago';
function tzParts(iso) {
  const d = new Date(iso);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true })
    .formatToParts(d).map(x => [x.type, x.value]));
  return { y: p.year, m: +p.month - 1, d: p.day, h: +p.hour, min: p.minute, pm: /p/i.test(p.dayPeriod) };
}
function apTime(p) {
  if (p.min === '00' && p.h === 12) return p.pm ? 'noon' : 'midnight';
  return `${p.h}${p.min === '00' ? '' : ':' + p.min} ${p.pm ? 'p.m.' : 'a.m.'}`;
}
const fmtDate = iso => { const p = tzParts(iso); return `${AP_MONTHS[p.m]} ${p.d}, ${p.y}`; };
const fmtDateTime = iso => { const p = tzParts(iso); return `${AP_MONTHS[p.m]} ${p.d}, ${p.y}, ${apTime(p)} CT`; };

/* Device storage: always wrapped, the page works without it (private windows, previews) */
const STORE_KEY = 'utsw-admin-mock-v1';
const store = {
  read() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || null; } catch (e) { return null; } },
  write(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep working in memory */ } },
  clear() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } }
};

/* Screen reader announcements (polite) */
function announce(msg) {
  const el = $('#sr-live'); if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 30);
}
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;

const levelOf = (role, area) => (PERMISSIONS.areas[area] || {})[role] || 'none';
const can = (role, area, need = 'view') => LEVELS.indexOf(levelOf(role, area)) >= LEVELS.indexOf(need);
/* Lifecycle actions → the level each needs */
const ACTION_NEEDS = { saveDraft: 'draft', requestReview: 'draft', deployDemo: 'demo', requestChanges: 'publish', publish: 'publish', rollback: 'publish' };
const canAct = (role, area, action) => can(role, area, ACTION_NEEDS[action]);

/* ===== src/services/services.js ===== */
/* ==========================================================================================
   MOCK SERVICE LAYER. Async interfaces with simulated latency and optional simulated errors.
   No network requests are made; there are no endpoints or credentials anywhere in this app.
   A real backend replaces the bodies of these functions; screens only call the interfaces.
   ========================================================================================== */
const MockSettings = { latency: [180, 420], simulateErrors: false };
class ServiceError extends Error {}
const wait = ms => new Promise(r => setTimeout(r, ms));
/* Persisted mock state (device only): config records, users, prefs and the simulated session */
let DB = null;
function loadDb() {
  const saved = store.read();
  DB = saved && saved.db && saved.db.schema === 1 ? saved : { db: seedDb(), session: null, prefs: {} };
  MockSettings.simulateErrors = !!DB.prefs.simulateErrors;
}
const saveDb = () => store.write(DB);
function resetMockData() {
  const session = DB.session;
  DB = { db: seedDb(), session, prefs: {} };
  MockSettings.simulateErrors = false;
  saveDb();
}
async function mockCall(name, fn) {
  const [a, b] = MockSettings.latency;
  await wait(a + Math.random() * (b - a));
  if (MockSettings.simulateErrors) throw new ServiceError(`The mock ${name} service returned a simulated error. Turn off “Simulate service errors” in the user menu, then try again.`);
  const out = fn();
  saveDb();
  return clone(out);
}

/* ---------- Config schema (HANDOVER §6.3): one entry per config type ----------
   supportsRollback is per type and every value is an assumption for the prototype, pending confirmation. */
const CONFIG_TYPES = {
  homeLayout: { label: 'Home screen layout', area: 'homeLayout', supportsRollback: true },
  campaign: { label: 'Campaign', area: 'campaigns', supportsRollback: false },
  alert: { label: 'Emergency alert', area: 'alerts', supportsRollback: false },
  quickLink: { label: 'Quick link', area: 'quickLinks', supportsRollback: true },
  featuredCard: { label: 'Featured card', area: 'featuredCards', supportsRollback: true },
  drawer: { label: 'Drawer / More options', area: 'drawer', supportsRollback: true },
  globalColors: { label: 'Global colors', area: 'colors', supportsRollback: true },
  appEntry: { label: 'App entry', area: 'appEntry', supportsRollback: true },
  search: { label: 'Search configuration', area: 'search', supportsRollback: false }
};

const actor = () => DB.session && DB.session.userId;
function guard(rec, action) {
  const role = DB.session && DB.session.role;
  const area = CONFIG_TYPES[rec.type].area;
  if (!role || !canAct(role, area, action)) throw new ServiceError('Your role does not allow this action.');
}
function rec(id) { const r = DB.db.records[id]; if (!r) throw new ServiceError(`No configuration named ${id}.`); return r; }
function logEvent(r, action, environment, version, comment) {
  r.events.push({ id: uid('ev'), action, environment, version, by: actor(), at: new Date().toISOString(), comment: comment || '' });
}

const ConfigService = {
  get: id => mockCall('configuration', () => rec(id)),
  list: type => mockCall('configuration', () => Object.values(DB.db.records).filter(r => !type || r.type === type)),
  /* Draft: the working copy is saved; nothing reaches demo or production */
  saveDraft: (id, data, comment) => mockCall('configuration', () => {
    const r = rec(id); guard(r, 'saveDraft');
    r.draft = { data: clone(data), updatedBy: actor(), updatedAt: new Date().toISOString(), comment: comment || '', baseVersion: r.production };
    r.review = null;
    logEvent(r, 'Draft saved', 'draft', null, comment);
    return r;
  }),
  discardDraft: id => mockCall('configuration', () => {
    const r = rec(id); guard(r, 'saveDraft');
    r.draft = null; r.review = null;
    logEvent(r, 'Draft discarded', 'draft', null, '');
    return r;
  }),
  requestReview: (id, comment) => mockCall('configuration', () => {
    const r = rec(id); guard(r, 'requestReview');
    if (!r.draft) throw new ServiceError('Save a draft before you request a review.');
    r.review = { by: actor(), at: new Date().toISOString(), comment: comment || '' };
    logEvent(r, 'Review requested', 'draft', null, comment);
    return r;
  }),
  /* Demo: the saved draft becomes a numbered version in the demo environment */
  deployToDemo: (id, comment) => mockCall('publishing', () => {
    const r = rec(id); guard(r, 'deployDemo');
    if (!r.draft) throw new ServiceError('There is no saved draft to deploy.');
    const v = r.nextVersion++;
    r.versions[v] = { version: v, data: clone(r.draft.data), updatedBy: actor(), updatedAt: new Date().toISOString(), comment: comment || r.draft.comment || '' };
    r.demo = v; r.draft = null; r.review = null;
    logEvent(r, 'Deployed to demo', 'demo', v, comment);
    return r;
  }),
  /* Request changes: the demo version goes back to a draft with the reviewer's comment */
  requestChanges: (id, comment) => mockCall('publishing', () => {
    const r = rec(id); guard(r, 'requestChanges');
    if (!r.demo || r.demo === r.production) throw new ServiceError('There is nothing on demo waiting for production.');
    r.draft = { data: clone(r.versions[r.demo].data), updatedBy: actor(), updatedAt: new Date().toISOString(), comment: `Changes requested: ${comment}`, baseVersion: r.production, changesRequested: comment };
    logEvent(r, 'Changes requested', 'demo', r.demo, comment);
    return r;
  }),
  /* Production: publishes the version on demo, never a draft */
  publish: (id, comment) => mockCall('publishing', () => {
    const r = rec(id); guard(r, 'publish');
    if (!r.demo || r.demo === r.production) throw new ServiceError('Deploy to demo and check it there before you publish.');
    r.production = r.demo;
    logEvent(r, 'Published to production', 'production', r.demo, comment);
    return r;
  }),
  /* Rollback: only for types that support it; makes a new version with the old contents, in demo and production */
  rollback: (id, toVersion, comment) => mockCall('publishing', () => {
    const r = rec(id); guard(r, 'rollback');
    if (!CONFIG_TYPES[r.type].supportsRollback) throw new ServiceError(`${CONFIG_TYPES[r.type].label} does not support rollback.`);
    const old = r.versions[toVersion]; if (!old) throw new ServiceError(`Version ${toVersion} does not exist.`);
    const v = r.nextVersion++;
    r.versions[v] = { version: v, data: clone(old.data), updatedBy: actor(), updatedAt: new Date().toISOString(), comment: `Rollback to v${toVersion}: ${comment}`, rollbackOf: toVersion };
    r.production = v; r.demo = v;
    logEvent(r, `Rolled back to v${toVersion}`, 'production', v, comment);
    return r;
  })
};

const UserService = {
  list: () => mockCall('users', () => DB.db.users),
  byId: id => DB.db.users.find(u => u.id === id) || null, /* synchronous lookup for names in tables */
  name: id => { const u = UserService.byId(id); return u ? `${u.first} ${u.last}` : 'Unknown user'; }
};

/* ===== src/app/session.js ===== */
/* ---------- Simulated SSO session ----------
   SIMULATED: no identity provider is connected. The real flow (SAML or OIDC, MFA, timeout) is pending UTSW (HANDOVER §8).
   There is never a username and password form. */
const SESSION_IDLE_MS = 30 * 60 * 1000; /* 30 minutes idle – placeholder until UTSW confirms the timeout */
const Session = {
  current: () => DB.session,
  /* Step 1: the person picks a sample account on the simulated identity-provider screen */
  pending: null,
  begin(userId) { this.pending = userId; },
  /* Step 2: simulated MFA approval starts the session */
  complete() {
    const u = UserService.byId(this.pending); if (!u) return false;
    DB.session = { userId: u.id, role: u.role, startedAt: Date.now(), lastActive: Date.now() };
    this.pending = null; saveDb(); return true;
  },
  touch() { if (DB.session) { DB.session.lastActive = Date.now(); } },
  expired() { return !!DB.session && Date.now() - DB.session.lastActive > SESSION_IDLE_MS; },
  /* Prototype only: lets reviewers see each role without three sign-ins */
  switchRole(role) { if (DB.session && ROLES[role]) { DB.session.role = role; saveDb(); } },
  end() { DB.session = null; saveDb(); },
  role: () => DB.session && DB.session.role,
  user: () => DB.session && UserService.byId(DB.session.userId)
};

/* ---------- Button ---------- variants: primary, secondary, tonal, text, danger; size: md (44) or lg (48) */
function btn({ label, icon, variant = 'secondary', size = 'md', attrs = '', iconOnly = false, type = 'button' }) {
  const cls = `btn btn-${variant}${size === 'lg' ? ' btn-lg' : ''}${iconOnly ? ' btn-icon' : ''}`;
  return `<button type="${type}" class="${cls}" ${iconOnly ? `aria-label="${esc(label)}"` : ''} ${attrs}>${icon ? ic(icon, 20) : ''}${iconOnly ? '' : `<span class="lbl">${esc(label)}</span>`}<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></button>`;
}
/* Busy state while a mock service call runs */
function setBusy(button, busy, busyLabel) {
  if (!button) return;
  button.classList.toggle('loading', busy);
  button.setAttribute('aria-busy', busy);
  if (busy) { button.dataset.label = button.getAttribute('aria-label') || ''; button.setAttribute('aria-label', busyLabel || 'Working'); }
  else if (button.dataset.label) button.setAttribute('aria-label', button.dataset.label); else button.removeAttribute('aria-label');
}

/* ---------- Status badge: always an icon and a word, never color alone ---------- */
const BADGES = {
  draft: ['edit_note', 'Draft'], demo: ['science', 'Demo'], production: ['public', 'Production'],
  unsaved: ['pending', 'Unsaved changes'], review: ['rate_review', 'Review requested'], changes: ['undo', 'Changes requested'],
  mock: ['database', 'Mock data'], simulated: ['sync_alt', 'Simulated'], planned: ['schedule', 'Planned'],
  visible: ['visibility', 'Visible'], hidden: ['visibility_off', 'Hidden'], fixed: ['lock', 'Fixed'],
  pending: ['help', 'Pending confirmation'], error: ['error', 'Error'], live: ['check_circle', 'Live']
};
function badge(kind, text) {
  const [icon, word] = BADGES[kind] || ['info', kind];
  return `<span class="badge badge-${kind}">${ic(icon, 16)}<span>${esc(text || word)}</span></span>`;
}

/* ---------- Form field: label, hint and error tied by aria-describedby ---------- */
function field({ id, label, type = 'text', value = '', hint = '', error = '', required = false, textarea = false, rows = 3, attrs = '', options = null }) {
  const desc = [hint && `${id}-hint`, error && `${id}-err`].filter(Boolean).join(' ');
  const common = `id="${id}" name="${id}" ${required ? 'required aria-required="true"' : ''} ${error ? 'aria-invalid="true"' : ''} ${desc ? `aria-describedby="${desc}"` : ''} ${attrs}`;
  let control;
  if (textarea) control = `<textarea class="input" rows="${rows}" ${common}>${esc(value)}</textarea>`;
  else if (options) control = `<select class="input" ${common}>${options.map(([v, l]) => `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else control = `<input class="input" type="${type}" value="${esc(value)}" ${common}>`;
  return `<div class="field${error ? ' has-error' : ''}">
    <label for="${id}">${esc(label)}${required ? ' <span class="req">(required)</span>' : ''}</label>
    ${hint ? `<p class="hint" id="${id}-hint">${esc(hint)}</p>` : ''}
    ${control}
    <p class="err" id="${id}-err" ${error ? '' : 'hidden'}>${ic('error', 16)}<span>${esc(error)}</span></p>
  </div>`;
}
function setFieldError(input, msg) {
  const f = input.closest('.field'), err = f.querySelector('.err');
  f.classList.toggle('has-error', !!msg);
  err.hidden = !msg; err.querySelector('span').textContent = msg || '';
  if (msg) {
    input.setAttribute('aria-invalid', 'true');
    const ids = new Set((input.getAttribute('aria-describedby') || '').split(' ').filter(Boolean)); ids.add(err.id);
    input.setAttribute('aria-describedby', [...ids].join(' '));
  } else input.removeAttribute('aria-invalid');
}

/* ---------- Switch (role="switch") and checkbox ---------- */
const switchBtn = ({ id, checked, label, labelledby, attrs = '' }) =>
  `<button type="button" class="switch" role="switch" id="${id}" aria-checked="${!!checked}" ${labelledby ? `aria-labelledby="${labelledby}"` : `aria-label="${esc(label)}"`} ${attrs}><span class="track" aria-hidden="true"></span></button>`;
const checkbox = ({ id, label, checked, attrs = '' }) =>
  `<label class="check" for="${id}"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${attrs}><span class="box" aria-hidden="true">${ic('check', 16)}</span><span>${esc(label)}</span></label>`;

/* ---------- Segmented control (radio group) ---------- */
function segmented({ id, label, options, value }) {
  return `<div class="seg" role="radiogroup" aria-label="${esc(label)}" id="${id}">${options.map(([v, l]) =>
    `<button type="button" role="radio" data-value="${esc(v)}" aria-checked="${v === value}" tabindex="${v === value ? 0 : -1}">${esc(l)}</button>`).join('')}</div>`;
}
/* Arrow keys move the selection, as radios do */
function wireSegmented(root, onChange) {
  const opts = $$('[role="radio"]', root);
  const pick = (b, focus) => {
    opts.forEach(o => { const on = o === b; o.setAttribute('aria-checked', on); o.tabIndex = on ? 0 : -1; });
    if (focus) b.focus(); onChange(b.dataset.value);
  };
  opts.forEach((b, i) => {
    b.addEventListener('click', () => pick(b));
    b.addEventListener('keydown', e => {
      const d = ['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : ['ArrowLeft', 'ArrowUp'].includes(e.key) ? -1 : 0;
      if (d) { e.preventDefault(); pick(opts[(i + d + opts.length) % opts.length], true); }
    });
  });
}

/* ---------- Card ---------- */
const card = ({ title, titleId, body, actions = '', cls = '', level = 2 }) =>
  `<section class="card ${cls}" ${title ? `aria-labelledby="${titleId}"` : ''}>
    ${title ? `<div class="card-head"><h${level} id="${titleId}">${title}</h${level}>${actions ? `<div class="card-actions">${actions}</div>` : ''}</div>` : ''}
    <div class="card-body">${body}</div>
  </section>`;

/* ---------- Loading, error and empty states ---------- */
const loadingState = (text = 'Loading') =>
  `<div class="state state-loading" role="status"><span class="vh">${esc(text)}…</span><div class="sk-stack" aria-hidden="true"><span class="sk sk-w1"></span><span class="sk sk-w2"></span><span class="sk sk-w3"></span><span class="sk sk-block"></span></div></div>`;
const errorState = (msg, retryAttr = 'data-retry') =>
  `<div class="state state-error" role="alert">${ic('error', 32, 'f1')}<h2>We couldn’t load this</h2><p>${esc(msg)}</p>${btn({ label: 'Try again', icon: 'refresh', variant: 'primary', attrs: retryAttr })}</div>`;
const emptyState = ({ icon = 'inbox', title, text, action = '', level = 2 }) =>
  `<div class="state state-empty">${ic(icon, 32)}<h${level}>${esc(title)}</h${level}>${text ? `<p>${text}</p>` : ''}${action}</div>`;

/* ---------- Stepper: ordered steps with a state word each ---------- */
function stepper(steps, label) {
  const word = { done: 'Completed', current: 'Current step', todo: 'Not started' };
  const glyph = { done: 'check_circle', current: 'radio_button_checked', todo: 'radio_button_unchecked' };
  return `<ol class="stepper" aria-label="${esc(label)}">${steps.map(s => `
    <li class="step step-${s.state}" ${s.state === 'current' ? 'aria-current="step"' : ''}>
      <span class="step-ic">${ic(glyph[s.state], 24, s.state === 'todo' ? '' : 'f1')}</span>
      <span class="step-txt"><span class="step-t">${esc(s.title)} <span class="vh">– ${word[s.state]}</span></span>${s.detail ? `<span class="step-d">${s.detail}</span>` : ''}</span>
    </li>`).join('')}</ol>`;
}

/* ---------- Table with search, filters and sortable headers ---------- */
/* EXTRA_GLYPHS: arrow_upward arrow_downward unfold_more */
function dataTable(host, cfg) {
  const st = { q: '', filters: {}, sort: cfg.defaultSort || null, rows: cfg.rows };
  const id = cfg.id;
  host.innerHTML = `
    <div class="tbl-tools" role="search" aria-label="${esc(cfg.caption)}">
      <div class="tbl-search"><label for="${id}-q" class="vh">Search ${esc(cfg.caption.toLowerCase())}</label>${ic('search', 20)}<input class="input" type="search" id="${id}-q" placeholder="${esc(cfg.searchPlaceholder || 'Search')}"></div>
      ${(cfg.filters || []).map(f => `<div class="tbl-filter"><label for="${id}-f-${f.key}">${esc(f.label)}</label><select class="input" id="${id}-f-${f.key}" data-filter="${f.key}"><option value="">All</option>${f.options.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></div>`).join('')}
      <p class="tbl-count" id="${id}-count" role="status"></p>
    </div>
    <div class="tbl-wrap" tabindex="0" role="region" aria-labelledby="${id}-cap">
      <table class="tbl"><caption id="${id}-cap" class="vh">${esc(cfg.caption)}</caption><thead></thead><tbody></tbody></table>
    </div>
    <div class="tbl-empty" hidden></div>`;
  const thead = $('thead', host), tbody = $('tbody', host), empty = $('.tbl-empty', host), wrap = $('.tbl-wrap', host);
  const visible = () => {
    const q = st.q.trim().toLowerCase();
    let rows = st.rows.filter(r => (!q || cfg.searchText(r).toLowerCase().includes(q)) &&
      (cfg.filters || []).every(f => !st.filters[f.key] || f.match(r, st.filters[f.key])));
    if (st.sort) {
      const col = cfg.columns.find(c => c.key === st.sort.key), v = col.sortValue || (r => r[col.key]);
      rows = [...rows].sort((a, b) => (v(a) > v(b) ? 1 : v(a) < v(b) ? -1 : 0) * (st.sort.dir === 'asc' ? 1 : -1));
    }
    return rows;
  };
  const head = () => {
    thead.innerHTML = `<tr>${cfg.columns.map(c => {
      const sorted = st.sort && st.sort.key === c.key;
      const aria = c.sortable ? `aria-sort="${sorted ? (st.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}"` : '';
      const inner = c.sortable ? `<button type="button" class="th-sort" data-sort="${c.key}">${esc(c.label)}${ic(sorted ? (st.sort.dir === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more', 16)}</button>` : (c.hideLabel ? `<span class="vh">${esc(c.label)}</span>` : esc(c.label));
      return `<th scope="col" ${aria} class="${c.cls || ''}">${inner}</th>`;
    }).join('')}</tr>`;
  };
  const body = () => {
    const rows = visible();
    tbody.innerHTML = rows.map(r => `<tr>${cfg.columns.map((c, i) => i === 0 ? `<th scope="row" class="${c.cls || ''}">${c.render(r)}</th>` : `<td class="${c.cls || ''}">${c.render(r)}</td>`).join('')}</tr>`).join('');
    const filtered = st.q || Object.values(st.filters).some(Boolean);
    $(`#${id}-count`, host).textContent = `${plural(rows.length, cfg.noun || 'row')}${filtered ? ` of ${st.rows.length}` : ''}`;
    wrap.hidden = !rows.length; empty.hidden = !!rows.length;
    if (!rows.length) empty.innerHTML = filtered
      ? emptyState({ icon: 'search_off', title: 'No matches', text: 'Nothing matches this search and these filters.', action: btn({ label: 'Clear search and filters', variant: 'secondary', attrs: 'data-clear' }), level: 3 })
      : emptyState({ ...cfg.empty, level: 3 });
    if (cfg.onRender) cfg.onRender(tbody);
  };
  host.addEventListener('input', e => {
    if (e.target.id === `${id}-q`) { st.q = e.target.value; body(); }
  });
  host.addEventListener('change', e => {
    if (e.target.dataset.filter) { st.filters[e.target.dataset.filter] = e.target.value; body(); }
  });
  host.addEventListener('click', e => {
    const s = e.target.closest('[data-sort]');
    if (s) {
      const k = s.dataset.sort;
      st.sort = { key: k, dir: st.sort && st.sort.key === k && st.sort.dir === 'asc' ? 'desc' : 'asc' };
      head(); body(); $(`[data-sort="${k}"]`, thead).focus();
      announce(`Sorted by ${s.textContent.trim()}, ${st.sort.dir === 'asc' ? 'ascending' : 'descending'}`);
    }
    if (e.target.closest('[data-clear]')) {
      st.q = ''; st.filters = {}; $(`#${id}-q`, host).value = ''; $$('[data-filter]', host).forEach(s => { s.value = ''; });
      body(); $(`#${id}-q`, host).focus();
    }
  });
  head(); body();
  return { update(rows) { st.rows = rows; body(); } };
}

/* ---------- Modal and confirm dialog (native <dialog>: inert background, Escape closes) ---------- */
function openModal({ title, body, actions, onOpen, wide = false }) {
  const from = document.activeElement;
  const d = document.createElement('dialog');
  d.className = `modal${wide ? ' wide' : ''}`;
  d.setAttribute('aria-labelledby', 'modal-h');
  d.innerHTML = `<form method="dialog" class="modal-form" novalidate>
    <div class="modal-head"><h2 id="modal-h" tabindex="-1">${esc(title)}</h2>${btn({ label: 'Close', icon: 'close', variant: 'text', iconOnly: true, attrs: 'data-close' })}</div>
    <div class="modal-body">${body}</div>
    <div class="modal-actions">${actions}</div>
  </form>`;
  document.body.appendChild(d);
  const close = () => { if (d.open) d.close(); };
  d.addEventListener('close', () => { d.remove(); if (from && from.isConnected) from.focus(); });
  d.addEventListener('click', e => { if (e.target.closest('[data-close]')) { e.preventDefault(); close(); } });
  d.showModal();
  (d.querySelector('[autofocus]') || d.querySelector('#modal-h')).focus();
  if (onOpen) onOpen(d, close);
  return { el: d, close };
}
/* Resolves { ok, comment }. A required comment is validated before confirming. */
function confirmDialog({ title, body, confirmLabel, variant = 'primary', comment = null, cancelLabel = 'Cancel' }) {
  return new Promise(resolve => {
    let done = false;
    const commentField = comment ? field({ id: 'cf-comment', label: comment.label, hint: comment.hint || '', required: !!comment.required, textarea: true, rows: 3, value: comment.value || '' }) : '';
    const m = openModal({
      title,
      body: `${body}${commentField}`,
      actions: `${btn({ label: cancelLabel, variant: 'text', attrs: 'data-close' })}${btn({ label: confirmLabel, variant, type: 'submit', attrs: 'data-confirm' })}`,
      onOpen(d, close) {
        d.querySelector('form').addEventListener('submit', e => {
          e.preventDefault();
          const ta = d.querySelector('#cf-comment');
          if (comment && comment.required && !ta.value.trim()) { setFieldError(ta, `Enter ${comment.label.toLowerCase()} so others know why.`); ta.focus(); return; }
          done = true; resolve({ ok: true, comment: ta ? ta.value.trim() : '' }); close();
        });
        d.addEventListener('close', () => { if (!done) resolve({ ok: false }); });
      }
    });
    return m;
  });
}

/* ---------- Toast: polite live region, optional action (Undo), 5 seconds ---------- */
function toast(msg, { kind = 'info', action, onAction, ms = 5000 } = {}) {
  const host = $('#toasts');
  const t = document.createElement('div');
  t.className = `toast toast-${kind}`;
  t.innerHTML = `${ic(kind === 'error' ? 'error' : kind === 'success' ? 'check_circle' : 'info', 20, 'f1')}<span class="toast-msg">${esc(msg)}</span>${action ? `<button type="button" class="toast-act">${esc(action)}</button>` : ''}<button type="button" class="toast-x" aria-label="Dismiss notification">${ic('close', 20)}</button>`;
  host.appendChild(t);
  let timer;
  const kill = () => { clearTimeout(timer); t.classList.add('out'); setTimeout(() => t.remove(), 200); };
  const arm = () => { clearTimeout(timer); timer = setTimeout(kill, ms); };
  t.addEventListener('mouseenter', () => clearTimeout(timer)); t.addEventListener('mouseleave', arm);
  t.addEventListener('focusin', () => clearTimeout(timer)); t.addEventListener('focusout', arm);
  t.querySelector('.toast-x').onclick = kill;
  if (action) t.querySelector('.toast-act').onclick = () => { kill(); onAction && onAction(); };
  arm();
}

/* ---------- Preview frame ----------
   An isolated iframe (srcdoc, sandbox="allow-scripts" without same-origin) so the designs/guest CSS can't leak into
   the Admin and the Admin can't reach into it. The Admin posts the configuration in; the frame renders it.
   PREVIEW_CSS, PREVIEW_JS and PREVIEW_HTML are inlined by build.py from src/preview/. */
function previewDoc() {
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap">
<link rel="stylesheet" href="${ICON_FONT_URL}">
<style>${PREVIEW_CSS}</style></head><body>${PREVIEW_HTML}<script>${PREVIEW_JS}<\/script></body></html>`;
}
/* Mounts a phone frame in host; returns { render(payload) } */
function mountPreview(host, { title }) {
  host.innerHTML = `<div class="pv-device"><div class="pv-screen"><iframe class="pv-frame" sandbox="allow-scripts" title="${esc(title)}"></iframe></div></div>`;
  const frame = $('iframe', host);
  let ready = false, pending = null;
  const send = p => frame.contentWindow && frame.contentWindow.postMessage({ type: 'mycare-preview', ...p }, '*');
  const onMsg = e => {
    if (e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type === 'mycare-preview-ready') { ready = true; if (pending) send(pending); }
    if (e.data.type === 'mycare-preview-rendered') host.dataset.rendered = String(Date.now());
  };
  window.addEventListener('message', onMsg);
  frame.srcdoc = previewDoc();
  return {
    render(payload) { pending = payload; if (ready) send(payload); },
    destroy() { window.removeEventListener('message', onMsg); }
  };
}

function visibleNav(role) {
  return NAV.map(sec => ({ ...sec, items: sec.items.filter(i => can(role, i.area, 'view')) })).filter(sec => sec.items.length);
}
const initials = u => `${u.first[0]}${u.last[0]}`;

function renderShell() {
  const app = $('#app');
  app.className = 'app';
  app.innerHTML = `
    <a class="skip" href="#main" data-skip>Skip to main content</a>
    <header class="topbar">
      <button type="button" class="nav-toggle btn btn-text btn-icon" aria-controls="sidebar" aria-expanded="false" aria-label="Show navigation">${ic('menu')}</button>
      <a class="brand" href="#home-layout" aria-label="UTSW MyCare Admin, go to Home screen layout"><img src="${LOGO_REVERSED}" alt="" width="200"><span class="brand-admin" aria-hidden="true">Admin</span></a>
      <div class="env-pill" title="This Admin runs as a prototype">${ic('dns', 20)}<span><span class="env-k">Environment</span> <b>Prototype</b></span></div>
      <p class="mock-flag">${ic('database', 20)}<span><span class="mf-long">Prototype – mock data, not connected to MyCare</span><span class="mf-short" aria-hidden="true">Mock data</span></span></p>
      <div class="user" id="user"></div>
    </header>
    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Admin sections"></nav>
      <div class="scrim" id="scrim" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>`;
  $('[data-skip]').addEventListener('click', e => { e.preventDefault(); $('#main').focus(); });
  const toggle = $('.nav-toggle'), side = $('#sidebar'), scrim = $('#scrim');
  const setNav = open => {
    app.classList.toggle('nav-open', open); toggle.setAttribute('aria-expanded', open);
    toggle.setAttribute('aria-label', open ? 'Hide navigation' : 'Show navigation'); scrim.hidden = !open;
    if (open) { const a = $('[aria-current="page"]', side) || $('a,button', side); a && a.focus(); }
  };
  toggle.onclick = () => setNav(!app.classList.contains('nav-open'));
  scrim.onclick = () => { setNav(false); toggle.focus(); };
  side.addEventListener('keydown', e => { if (e.key === 'Escape' && app.classList.contains('nav-open')) { setNav(false); toggle.focus(); } });
  side.addEventListener('click', e => { if (e.target.closest('a')) setNav(false); });
  side.addEventListener('click', e => {
    const b = e.target.closest('[data-sec]'); if (!b) return;
    const id = b.dataset.sec, open = b.getAttribute('aria-expanded') !== 'true';
    open ? navOpen.add(id) : navOpen.delete(id);
    b.setAttribute('aria-expanded', open); $(`#nav-${id}`).hidden = !open;
  });
  renderUser();
}

function renderSidebar(currentRoute) {
  const side = $('#sidebar'); if (!side) return;
  const role = Session.role();
  const cur = currentRoute && currentRoute.section ? currentRoute.section.id : null;
  if (cur) navOpen.add(cur);
  const link = (item, label, nested) => {
    const here = currentRoute && currentRoute.item === item;
    const tag = item.built ? '' : `<span class="nav-tag" aria-hidden="true">Phase ${item.phase}</span><span class="vh">, planned for Phase ${item.phase}</span>`;
    return `<a href="#${item.route}" class="nav-link${nested ? ' nested' : ''}" ${here ? 'aria-current="page"' : ''}><span class="nav-l">${esc(label)}</span>${tag}</a>`;
  };
  side.innerHTML = `<ul class="nav">${visibleNav(role).map(sec => {
    if (sec.items.length === 1 && NAV.find(s => s.id === sec.id).items.length === 1) {
      return `<li class="nav-sec single">${link(sec.items[0], sec.label).replace('<span class="nav-l">', `${ic(sec.icon, 20)}<span class="nav-l">`)}</li>`;
    }
    const open = navOpen.has(sec.id);
    return `<li class="nav-sec">
      <button type="button" class="nav-head" data-sec="${sec.id}" aria-expanded="${open}" aria-controls="nav-${sec.id}">${ic(sec.icon, 20)}<span class="nav-l">${esc(sec.label)}</span>${ic('expand_more', 20, 'chev')}</button>
      <ul class="nav-sub" id="nav-${sec.id}" ${open ? '' : 'hidden'}>${sec.items.map(i => `<li>${link(i, i.label, true)}</li>`).join('')}</ul>
    </li>`;
  }).join('')}</ul>
  <p class="nav-foot">${badge('pending', 'Role access: proposed')}<span>Navigation follows the proposed permission matrix for ${esc(ROLES[role].label)}.</span></p>`;
}

function renderUser() {
  const u = Session.user(), role = Session.role(), host = $('#user');
  host.innerHTML = `
    <button type="button" class="user-btn" aria-expanded="false" aria-controls="user-menu">
      <span class="avatar" aria-hidden="true">${esc(initials(u))}</span>
      <span class="user-txt"><span class="user-n">${esc(u.first)} ${esc(u.last)}</span><span class="user-r">${esc(ROLES[role].label)}</span></span>
      ${ic('expand_more', 20)}
    </button>
    <div class="user-menu" id="user-menu" hidden>
      <div class="um-id"><p class="um-n">${esc(u.first)} ${esc(u.last)}</p><p class="um-e">${esc(u.email)}</p><p class="um-s">${badge('simulated', 'Simulated SSO session')}</p></div>
      <fieldset class="um-roles"><legend>Role <span class="proto">Prototype only</span></legend>
        ${Object.entries(ROLES).map(([k, r]) => `<label class="radio" for="um-role-${k}"><input type="radio" name="um-role" id="um-role-${k}" value="${k}" ${k === role ? 'checked' : ''}><span>${esc(r.label)}</span></label>`).join('')}
        <p class="um-note">Switching roles lets reviewers see each role’s navigation and actions. The real role comes from the approved identity provider.</p>
      </fieldset>
      <div class="um-row"><span id="um-err-l">Simulate service errors <span class="proto">Prototype only</span></span>${switchBtn({ id: 'um-err', checked: MockSettings.simulateErrors, labelledby: 'um-err-l' })}</div>
      <div class="um-acts">
        <button type="button" class="um-act" data-um="expire">${ic('timer_off', 20)}<span>Simulate session expiry</span></button>
        <button type="button" class="um-act" data-um="reset">${ic('restart_alt', 20)}<span>Reset mock data</span></button>
        <button type="button" class="um-act" data-um="signout">${ic('logout', 20)}<span>Sign out</span></button>
      </div>
    </div>`;
  const b = $('.user-btn', host), menu = $('#user-menu');

  b.onclick = () => set(menu.hidden);
  host.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { set(false); b.focus(); } });
  document.onclick = e => { const m = $('#user-menu'); if (m && !m.hidden && !$('#user').contains(e.target)) { m.hidden = true; $('.user-btn').setAttribute('aria-expanded', 'false'); } };
  menu.addEventListener('change', e => {
    if (e.target.name !== 'um-role') return;
    Session.switchRole(e.target.value);
    set(false); renderUser(); $('.user-btn').focus();
    toast(`Role switched to ${ROLES[e.target.value].label} (prototype only).`);
    Router.refresh();
  });
  $('#um-err').onclick = e => {
    const on = e.currentTarget.getAttribute('aria-checked') !== 'true';
    e.currentTarget.setAttribute('aria-checked', on);
    MockSettings.simulateErrors = on; DB.prefs.simulateErrors = on; saveDb();
    toast(on ? 'Simulated service errors are on. The next mock calls fail.' : 'Simulated service errors are off.');
  };
  menu.addEventListener('click', async e => {
    const a = e.target.closest('[data-um]'); if (!a) return;
    set(false);
    if (a.dataset.um === 'expire') { Session.end(); Router.go('expired', { force: true }); }
    if (a.dataset.um === 'signout') { if (await Router.canLeave()) { Session.end(); Router.go('signed-out', { force: true }); } else b.focus(); }
    if (a.dataset.um === 'reset') {
      const r = await confirmDialog({ title: 'Reset mock data?', body: '<p>This puts every mock configuration, version and history entry back to the seeded sample data on this device. Your simulated session stays signed in.</p>', confirmLabel: 'Reset mock data', variant: 'danger' });
      if (r.ok) { Router.clearGuard(); resetMockData(); renderUser(); Router.refresh(); toast('Mock data reset to the sample seed.', { kind: 'success' }); }
    }
  });
}

/* ===== src/app/router.js ===== */
/* ---------- Hash router with session and role guards ----------
   Public routes: login, mfa, signed-out, expired. Everything else needs the simulated session,
   and a role that can view the page's area; otherwise the access-denied view shows in place. */
const DEFAULT_ROUTE = 'home-layout';
const PUBLIC_PAGES = {};  /* filled by pages/auth.js */
const BUILT_PAGES = {};   /* filled by built pages, keyed by route */

function matchRoute(name) {
  const exact = ROUTES.find(r => r.pattern === name);
  if (exact) return { route: exact, params: {} };
  for (const r of ROUTES) {
    if (!r.pattern.endsWith('-:id')) continue;
    const pre = r.pattern.slice(0, -3);
    if (name.startsWith(pre) && name.length > pre.length && !ROUTES.some(x => x.pattern === name)) return { route: r, params: { id: name.slice(pre.length) } };
  }
  return null;
}

const Router = {
  current: null, active: null, loaded: false, guardFn: null, returnTo: null, skipNext: false,
  setGuard(fn) { this.guardFn = fn; },
  clearGuard() { this.guardFn = null; },
  async canLeave() { return this.guardFn ? await this.guardFn() : true; },
  go(name, { force = false } = {}) {
    if (force) this.clearGuard();
    if (location.hash.slice(1) === name) this.resolve(); else location.hash = name;
  },
  refresh() { this.resolve(true); },
  async onHash() {
    if (this.skipNext) { this.skipNext = false; return; }
    const next = location.hash.slice(1);
    if (this.guardFn && next !== this.current) {
      const ok = await this.guardFn();
      if (!ok) { history.replaceState(null, '', `#${this.current}`); return; }
      this.clearGuard();
    }
    this.resolve();
  },
  resolve(isRefresh = false) {
    const name = location.hash.slice(1) || DEFAULT_ROUTE;
    if (this.active && this.active.leave) this.active.leave();
    this.active = null;
    this.current = name;
    if (PUBLIC_PAGES[name]) { document.body.classList.remove('signed-in'); PUBLIC_PAGES[name](); this.loaded = true; return; }
    if (!Session.current()) { this.returnTo = name; history.replaceState(null, '', '#login'); this.current = 'login'; PUBLIC_PAGES.login(); this.loaded = true; return; }
    if (Session.expired()) { Session.end(); history.replaceState(null, '', '#expired'); this.current = 'expired'; return PUBLIC_PAGES.expired(); }
    Session.touch(); saveDb();
    if (!document.body.classList.contains('signed-in') || !$('#main')) { document.body.classList.add('signed-in'); renderShell(); }
    const main = $('#main');
    const role = Session.role();
    const m = name === 'denied' ? null : matchRoute(name);
    let title;
    if (name === 'denied') { title = 'Access denied'; renderSidebar(null); main.innerHTML = deniedView(null); }
    else if (!m) { title = 'Page not found'; renderSidebar(null); main.innerHTML = notFoundView(name); }
    else if (!can(role, m.route.item.area, 'view')) { title = 'Access denied'; renderSidebar(m.route); main.innerHTML = deniedView(m.route); }
    else {
      renderSidebar(m.route);
      title = m.route.title;
      const page = !m.route.parent && BUILT_PAGES[m.route.pattern];
      if (page) { this.active = page; page.render(main, { route: m.route, params: m.params, role }); }
      else main.innerHTML = plannedView(m.route, m.params, role);
    }
    document.title = `${title} – MyCare Admin (prototype)`;
    /* Move focus to the new heading on navigation, but not on first load, so Tab starts at the skip link */
    if (!isRefresh && this.loaded) { const h = $('#page-h'); (h || main).focus({ preventScroll: true }); window.scrollTo(0, 0); }
    this.loaded = true;
    announce(`${title} page`);
  }
};
window.addEventListener('hashchange', () => Router.onHash());
