/* Admin tokens. Block 1 is designs/guest/src.html lines 11–61, copied unchanged (the app palette, type, spacing,
   radii, motion, focus and the board chrome tokens). Never edit block 1 here; change designs/guest and re-copy. */
:root{
  /* Board chrome (theme-aware) */
  --bd-bg:#F2F5F8; --bd-panel:#FFFFFF; --bd-ink:#1F2A33; --bd-muted:#5B6770; --bd-line:#D5DDE5; --bd-accent:#004278; --bd-chip:#EBF0F5; --bd-bezel:#0E2236;

  /* ===== App palette (identical across themes – the app frame is a brand surface) ===== */
  --blue:#004278; --blue-80:#336893; --pms542:#7BAFD4; --cyan:#00A9E0;
  --bg:#F7F8FA; --surface:#FFFFFF; --tint:#EBF0F5; --tint-2:#D1DDE6; --sky:#D6E4F0;
  --line:#D5DDE5; --line-strong:#808B96;
  --ink:#333333; --ink-2:#5B6770;
  --on-blue-2:#D6E4F0; --on-blue-3:#A9C7E0;
  --alert:#B0003A;
  /* Theme roles. --blue is the accent for text and icons; --brand is the large Blue surface (always #004278, so the
     logo's own tile never shows an edge); --ctl is Blue on small controls (buttons, solid circles, selected chips). */
  --brand:#004278; --ctl:#004278; --alert-ink:#B0003A;
  --field-on-brand:#FFFFFF; --bar-glass:rgba(255,255,255,.94); --inverse:#333333; --on-inverse:#FFFFFF;
  --map-bg:#E6EDF3; --map-block:#D6E4F0; --map-block-2:#D1DDE6; --map-road:#FFFFFF;

  --ts:1;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  /* Spacing – one 4-pt scale */
  --s1:4.0px; --s2:8.0px; --s3:12.0px; --s4:16.0px; --s6:24.0px; --s8:32.0px; --s10:40.0px; --s12:48.0px;
  --hit:44.0px; --hit-lg:48.0px;

  /* Radii */
  --r-sm:8.0px; --r-md:12.0px; --r-lg:16.0px; --r-xl:24.0px; --r-pill:999px;

  /* Motion */
  --d-fast:150ms; --d-base:240ms; --d-slow:400ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in-out:cubic-bezier(.65,0,.35,1);
  --spring-snappy:linear(0, 0.066, 0.218, 0.401, 0.58, 0.735, 0.857, 0.945, 1.003, 1.037, 1.051, 1.054, 1.049, 1.04, 1.03, 1.02, 1.012, 1.006, 1.002, 0.999, 0.998, 0.997, 0.997, 0.997, 1);
  --spring-gentle:linear(0, 0.049, 0.158, 0.285, 0.412, 0.526, 0.624, 0.706, 0.772, 0.825, 0.867, 0.899, 0.924, 0.943, 0.957, 0.968, 0.976, 0.983, 0.987, 0.991, 0.993, 0.995, 0.996, 0.997, 1);
  --d-snappy:360ms; --d-gentle:400ms;

  --shadow-1:0 1px 2px rgba(16,38,60,.06), 0 2px 8px rgba(16,38,60,.06);
  --shadow-2:0 4px 12px rgba(16,38,60,.10), 0 16px 40px rgba(16,38,60,.14);
  --focus:0 0 0 2px #FFFFFF, 0 0 0 5px #004278;
  --focus-on-blue:0 0 0 2px #004278, 0 0 0 4px #FFFFFF;
  --glow:radial-gradient(90% 70% at 100% 20%, rgba(0,169,224,.30) 0, rgba(0,169,224,0) 70%);
  --hero-glow:radial-gradient(75% 55% at 100% 58%, rgba(0,169,224,.26) 0, rgba(0,169,224,0) 72%);

  /* Icon axes – inherited, so a container's state (selected, pressed, dark) reaches its glyph */
  --fill:0; --wght:500; --grad:0;
}
/* Tokens that follow the text-size setting are declared again on .phone so they resolve against its --ts */
:root,.phone{
  --t12:calc(12.0px * var(--ts)); --t14:calc(14.0px * var(--ts)); --t16:calc(16.0px * var(--ts)); --t18:calc(18.0px * var(--ts));
  --t20:calc(20.0px * var(--ts)); --t24:calc(24.0px * var(--ts)); --t28:calc(28.0px * var(--ts)); --t32:calc(32.0px * var(--ts));
  --i16:calc(16.0px * var(--ts)); --i20:calc(20.0px * var(--ts)); --i24:calc(24.0px * var(--ts)); --i32:calc(32.0px * var(--ts));
  --dot40:calc(40.0px * var(--ts)); --dot48:calc(48.0px * var(--ts)); --dot56:calc(56.0px * var(--ts));
}

/* Block 2 – admin-only layout tokens (not in the mobile files) */
:root{
  --a-sidebar:272px;          /* persistent sidebar */
  --a-header:64px;            /* top header */
  --a-content-max:1440px;     /* main column max width */
  --a-gutter:24px;            /* page side padding */
  --a-row:48px;               /* table row min height */
  --a-dense:14.0px;           /* dense body for tables and side notes */
  --a-preview-scale:.8;       /* phone preview scale */
}

/* Block 3 – the Admin follows the viewer's theme. Dark values are the designs/guest .phone.dark values (lines 1010–1021),
   unchanged; --brand stays UT Southwestern Blue in both themes, as in the app. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1620; --surface:#16222E; --tint:#1F3042; --tint-2:#2A4157; --sky:#1F3042;
    --line:#2B3C4D; --line-strong:#7D8E9E; --ink:#E6EDF3; --ink-2:#A6B4C0;
    --blue:#8CC0EA; --ctl:#2D6CA6; --alert-ink:#FF8AA8;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
    --shadow-2:0 4px 12px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    --focus:0 0 0 2px #0D1620, 0 0 0 5px #8CC0EA; --inverse:#E6EDF3; --on-inverse:#0D1620;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1620; --surface:#16222E; --tint:#1F3042; --tint-2:#2A4157; --sky:#1F3042;
  --line:#2B3C4D; --line-strong:#7D8E9E; --ink:#E6EDF3; --ink-2:#A6B4C0;
  --blue:#8CC0EA; --ctl:#2D6CA6; --alert-ink:#FF8AA8;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-2:0 4px 12px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  --focus:0 0 0 2px #0D1620, 0 0 0 5px #8CC0EA; --inverse:#E6EDF3; --on-inverse:#0D1620;
  color-scheme:dark;
}

/* MyCare Admin – components and layouts. Every color, radius, focus ring and motion value comes from tokens.css
   (designs/guest tokens, unchanged) plus the admin layout tokens. Layout: Blue top bar · persistent sidebar · content. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%; background:var(--bg); -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16.0px; line-height:1.5; font-optical-sizing:auto}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:60; background:var(--brand)}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:var(--blue)}
:focus-visible{outline:none; box-shadow:var(--focus); border-radius:var(--r-sm)}
.vh{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.muted{color:var(--ink-2)}
.nowrap{white-space:nowrap}
.text-link{display:inline-flex; align-items:center; gap:var(--s1); font-weight:600; color:var(--blue); text-decoration:underline; text-underline-offset:3px}

/* Icons: Material Symbols Rounded only (rules from designs/guest) */
.ms{font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal; font-size:24.0px; width:1em; height:1em; line-height:1; display:inline-block; flex:none; overflow:hidden; text-align:center;
  letter-spacing:normal; text-transform:none; white-space:nowrap; direction:ltr; font-feature-settings:"liga"; -webkit-font-smoothing:antialiased; user-select:none;
  --opsz:24; font-variation-settings:"FILL" var(--fill), "wght" var(--wght), "GRAD" var(--grad), "opsz" var(--opsz)}
.ms.s16{font-size:16.0px; --opsz:20} .ms.s20{font-size:20.0px; --opsz:20} .ms.s32{font-size:32.0px; --opsz:32}
.ms.f1{--fill:1}
html:not(.ms-ready) .ms{color:transparent!important}

/* ===================== Shell ===================== */
.skip{position:absolute; left:var(--s4); top:-100px; z-index:100; padding:var(--s3) var(--s4); background:var(--surface); color:var(--blue); font-weight:700; border-radius:var(--r-md); box-shadow:var(--shadow-2)}
.skip:focus{top:calc(var(--s2) + env(safe-area-inset-top, 0px))}
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:40; height:var(--a-header); display:flex; align-items:center; gap:var(--s4);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:var(--brand); color:#FFFFFF; --grad:-25}
.topbar :focus-visible{box-shadow:var(--focus-on-blue)}
.brand{display:flex; align-items:center; gap:var(--s2); text-decoration:none; color:#FFFFFF; flex:none; border-radius:var(--r-sm); margin-left:calc(-1 * var(--s4))}
.brand img{display:block; width:200px; height:auto}
.brand-admin{font-size:var(--t14); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--on-blue-2); padding-left:var(--s3); border-left:1px solid rgba(255,255,255,.3); line-height:24px}
.env-pill,.mock-flag{display:inline-flex; align-items:center; gap:var(--s2); min-height:36px; padding:0 var(--s3); border-radius:var(--r-pill); font-size:var(--t14); white-space:nowrap}
.env-pill{background:rgba(255,255,255,.10); box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); color:var(--on-blue-2)}
.env-pill b{color:#FFFFFF}
.mock-flag{background:#FFFFFF; color:var(--brand); font-weight:600; --grad:0}
.mf-short{display:none}
.user{margin-left:auto; position:relative}
.user-btn{display:flex; align-items:center; gap:var(--s2); min-height:var(--hit); padding:0 var(--s2) 0 var(--s1); border:0; border-radius:var(--r-pill); background:transparent; color:#FFFFFF; cursor:pointer; text-align:left}
.user-btn:hover{background:rgba(255,255,255,.10)}
.avatar{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:#FFFFFF; color:var(--brand); font-size:var(--t14); font-weight:700; flex:none}
.user-txt{display:grid; line-height:1.25}
.user-n{font-size:var(--t14); font-weight:600}
.user-r{font-size:var(--t12); color:var(--on-blue-2)}
.user-btn[aria-expanded="true"] .ms{transform:rotate(180deg)}
.user-menu{position:absolute; right:0; top:calc(100% + var(--s2)); width:320px; max-width:calc(100vw - 32px); z-index:50; background:var(--surface); color:var(--ink); border-radius:var(--r-lg); box-shadow:var(--shadow-2), 0 0 0 1px var(--line); padding:var(--s2); --grad:0}
.user-menu :focus-visible{box-shadow:var(--focus)}
.um-id{padding:var(--s3)}
.um-n{font-weight:700}
.um-e{font-size:var(--t14); color:var(--ink-2); overflow-wrap:anywhere}
.um-s{margin-top:var(--s2)}
.um-roles{border:0; border-top:1px solid var(--line); margin:0; padding:var(--s3)}
.um-roles legend{float:left; width:100%; font-weight:700; font-size:var(--t14); margin-bottom:var(--s2); display:flex; gap:var(--s2); align-items:center}
.proto{display:inline-block; font-size:var(--t12); font-weight:700; color:var(--ink-2); background:var(--bg); box-shadow:inset 0 0 0 1px var(--line); padding:0 var(--s2); border-radius:var(--r-pill); line-height:20px; white-space:nowrap}
.um-note{clear:both; font-size:var(--t12); color:var(--ink-2); margin-top:var(--s2)}
.um-row{display:flex; align-items:center; justify-content:space-between; gap:var(--s3); padding:var(--s3); border-top:1px solid var(--line); font-size:var(--t14); font-weight:600}
.um-acts{border-top:1px solid var(--line); padding-top:var(--s1); display:grid}
.um-act{display:flex; align-items:center; gap:var(--s3); min-height:var(--hit); padding:0 var(--s3); border:0; background:none; border-radius:var(--r-md); text-align:left; font-size:var(--t14); font-weight:600; cursor:pointer; color:var(--ink)}
.um-act .ms{color:var(--blue)}
.um-act:hover{background:var(--tint)}

.layout{display:grid; grid-template-columns:var(--a-sidebar) minmax(0,1fr); min-height:calc(100vh - var(--a-header))}
.sidebar{position:sticky; top:calc(var(--a-header) + env(safe-area-inset-top, 0px)); align-self:start; height:calc(100vh - var(--a-header) - env(safe-area-inset-top, 0px)); overflow-y:auto;
  background:var(--surface); box-shadow:1px 0 0 var(--line); padding:var(--s3) var(--s2) var(--s6); padding-left:max(8px, env(safe-area-inset-left, 0px))}
.nav{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.nav ul{list-style:none; margin:0; padding:0}
.nav-head,.nav-link{display:flex; align-items:center; gap:var(--s3); width:100%; min-height:40px; padding:var(--s2) var(--s3); border:0; border-radius:var(--r-md); background:none; color:var(--ink); font-size:var(--t14); font-weight:600; line-height:1.3; text-align:left; text-decoration:none; cursor:pointer}
.nav-head .ms,.single .nav-link > .ms{color:var(--blue)}
.nav-head .chev{margin-left:auto; color:var(--ink-2); transition:transform var(--d-fast) var(--ease-out); align-self:center}
.nav-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.nav-head:hover,.nav-link:hover{background:var(--tint)}
.nav .nav-sub{position:relative; margin:2px 0 var(--s2) calc(var(--s3) + 9px); padding-left:var(--s3); border-left:1px solid var(--line); display:grid; gap:2px}
.nav-link.nested{position:relative; min-height:36px; padding:var(--s2) var(--s3); font-weight:400; color:var(--ink-2)}
.nav-link.nested:hover{color:var(--ink)}
.nav-l{flex:1; min-width:0}
.nav-link[aria-current="page"]{background:var(--tint); color:var(--blue); font-weight:700}
.nav-link.nested[aria-current="page"]::before{content:""; position:absolute; left:calc(-1 * var(--s3) - 1px); top:6px; bottom:6px; width:3px; border-radius:2px; background:var(--ctl)}
.nav-sec.single .nav-link[aria-current="page"] > .ms{--fill:1}
.nav-tag{font-size:var(--t12); color:var(--ink-2); white-space:nowrap}
.nav-foot{margin:var(--s6) var(--s3) 0; display:grid; gap:var(--s2); font-size:var(--t12); color:var(--ink-2)}
.topbar .nav-toggle{display:none}
.scrim{position:fixed; inset:0; z-index:34; background:rgba(0,20,40,.4)}
main{min-width:0; container:main / inline-size}
.page > *,#col-body > *,#aud-panel > *,.ed-grid > *{min-width:0}
#col-body,#sg-body,#wf,#db,#an-body,#nt-body,#us-body,#au,#ch,#pi,#pm,#as,#sr,#tg,#zr{display:grid; gap:var(--s6); align-content:start; min-width:0}
#col-body > *,#sg-body > *,#wf > *,#db > *,#an-body > *{min-width:0}
main:focus{outline:none}
.page{max-width:var(--a-content-max); margin:0 auto; padding-block:var(--s6) var(--s12);
  padding-left:max(var(--a-gutter), env(safe-area-inset-left, 0px)); padding-right:max(var(--a-gutter), env(safe-area-inset-right, 0px)); display:grid; gap:var(--s6)}

/* Page heading and breadcrumbs */
.page-head{display:grid; gap:var(--s2)}
.crumbs ol{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:var(--s1) var(--s2); font-size:var(--t14); color:var(--ink-2)}
.crumbs li{display:flex; align-items:center; gap:var(--s2)}
.crumbs li + li::before{content:"/"; color:var(--line-strong)}
.crumbs a{color:var(--blue); font-weight:600}
.crumbs [aria-current]{color:var(--ink)}
.ph-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--s3)}
.ph-main{display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3)}
h1{font-size:var(--t28); line-height:1.2; font-weight:700; letter-spacing:-.015em; color:var(--blue)}
h1:focus{outline:none}
.lede{max-width:72ch; color:var(--ink-2)}

/* ===================== Buttons ===================== */
.btn{position:relative; min-height:var(--hit); padding:0 var(--s4); border:0; border-radius:var(--r-pill); display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  font-size:var(--t14); font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap; transition:background-color var(--d-fast) var(--ease-out), transform var(--d-snappy) var(--spring-snappy)}
.btn:active{transform:scale(.97)}
.btn-lg{min-height:var(--hit-lg); padding:0 var(--s6); font-size:var(--t16)}
.btn-primary{background:var(--ctl); color:#FFFFFF; --grad:-25}
.btn-primary:hover{background:var(--blue-80)}
.btn-secondary{background:var(--surface); color:var(--blue); box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn-secondary:hover,.btn-text:hover{background:var(--tint)}
.btn-tonal{background:var(--tint); color:var(--blue)}
.btn-tonal:hover{background:var(--tint-2)}
.btn-text{background:transparent; color:var(--blue)}
.btn-danger{background:var(--alert); color:#FFFFFF}
.btn-icon{width:var(--hit); padding:0}
.btn[disabled]{color:var(--ink-2); opacity:.55; cursor:default}
.btn[disabled]:hover{background:transparent}
.btn[aria-disabled="true"]{background:var(--bg); color:var(--ink-2); box-shadow:inset 0 0 0 1.5px var(--line); cursor:not-allowed}
.btn .dots{position:absolute; inset:0; display:none; align-items:center; justify-content:center; gap:6px}
.btn .dots i{width:6px; height:6px; border-radius:50%; background:currentColor; animation:dotHop 600ms var(--ease-in-out) infinite}
.btn .dots i:nth-child(2){animation-delay:100ms} .btn .dots i:nth-child(3){animation-delay:200ms}
.btn.loading > :not(.dots){visibility:hidden}
.btn.loading .dots{display:flex}
@keyframes dotHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}

/* ===================== Badges: icon + word ===================== */
.badge{display:inline-flex; align-items:center; gap:var(--s1); min-height:24px; padding:0 var(--s2) 0 6px; border-radius:var(--r-pill); font-size:var(--t12); font-weight:700; line-height:1.2; white-space:nowrap; vertical-align:middle;
  background:var(--surface); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line-strong)}
.badge-draft,.badge-unsaved{box-shadow:none; background-image:none; outline:1.5px dashed var(--line-strong); outline-offset:-1.5px}
.badge-unsaved{color:var(--ink); background:var(--tint-2); outline-color:var(--ink-2)}
.badge-demo{background:var(--tint); color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue)}
.badge-production,.badge-live{background:var(--ctl); color:#FFFFFF; box-shadow:none; --grad:-25}
.badge-review,.badge-changes{color:var(--blue); box-shadow:inset 0 0 0 1.5px var(--blue)}
.badge-visible{color:var(--blue); background:var(--tint); box-shadow:none}
.badge-hidden{color:var(--ink-2); background:var(--bg)}
.badge-planned,.badge-pending{color:var(--ink); background:var(--bg)}
.badge-error{color:var(--alert-ink); box-shadow:inset 0 0 0 1.5px var(--alert-ink)}
.badge-simulated,.badge-mock{color:var(--ink); background:var(--bg)}

/* ===================== Fields, switch, checkbox, radio, segmented ===================== */
.field{display:grid; gap:6px; margin:0; align-content:start}
.field label{font-weight:600; font-size:var(--t14)}
.req{font-weight:400; color:var(--ink-2)}
.hint{font-size:var(--t14); color:var(--ink-2)}
.input{width:100%; min-height:var(--hit); padding:var(--s2) var(--s3); border:0; border-radius:var(--r-md); background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line-strong); font-size:var(--t16)}
textarea.input{resize:vertical; line-height:1.5}
select.input{appearance:none; -webkit-appearance:none; padding-right:40px; cursor:pointer;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position:calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size:5px 5px, 5px 5px; background-repeat:no-repeat}
select.input:disabled{cursor:not-allowed}
.input:focus-visible{box-shadow:inset 0 0 0 2px var(--blue), var(--focus)}
.has-error .input{box-shadow:inset 0 0 0 2px var(--alert-ink)}
.err{display:flex; align-items:center; gap:var(--s1); color:var(--alert-ink); font-size:var(--t14); font-weight:600}
.switch{flex:none; width:52px; height:var(--hit); padding:0; border:0; background:none; display:grid; place-items:center; cursor:pointer; border-radius:var(--r-pill)}
.switch .track{position:relative; width:44px; height:24px; border-radius:var(--r-pill); background:var(--surface); box-shadow:inset 0 0 0 2px var(--line-strong); transition:background-color var(--d-fast) var(--ease-out)}
.switch .track::after{content:""; position:absolute; top:4px; left:4px; width:16px; height:16px; border-radius:50%; background:var(--line-strong); transition:transform var(--d-base) var(--spring-snappy), background-color var(--d-fast)}
.switch[aria-checked="true"] .track{background:var(--ctl); box-shadow:none}
.switch[aria-checked="true"] .track::after{transform:translateX(20px); background:#FFFFFF}
.check,.radio{display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--hit); cursor:pointer; font-size:var(--t14); font-weight:600}
.check input{position:absolute; opacity:0; width:1px; height:1px}
.check .box{width:20px; height:20px; border-radius:4px; box-shadow:inset 0 0 0 2px var(--line-strong); display:grid; place-items:center; color:transparent; background:var(--surface); flex:none}
.check input:checked + .box{background:var(--ctl); box-shadow:none; color:#FFFFFF}
.check input:focus-visible + .box{box-shadow:var(--focus)}
.radio{width:100%}
.radio input{width:20px; height:20px; margin:0; accent-color:var(--ctl)}
.radio input:focus-visible{box-shadow:var(--focus); border-radius:50%}
.seg{display:inline-flex; flex-wrap:wrap; padding:3px; border-radius:var(--r-pill); background:var(--tint); gap:2px}
.seg button{min-height:38px; padding:0 var(--s3); border:0; border-radius:var(--r-pill); background:none; color:var(--ink); font-size:var(--t14); font-weight:600; cursor:pointer; white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--surface); color:var(--blue); box-shadow:var(--shadow-1), inset 0 0 0 1.5px var(--blue)}

/* ===================== Cards ===================== */
.card{background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-1), 0 0 0 1px var(--line); min-width:0}
.card-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--s2) var(--s3); padding:var(--s4) var(--s6) 0}
.card-head h2{font-size:var(--t20); line-height:1.3; color:var(--blue)}
.card-head h2:focus{outline:none}
.card-actions{display:flex; flex-wrap:wrap; gap:var(--s2)}
.card-body{padding:var(--s4) var(--s6) var(--s6)}
.sub-h{font-size:var(--t16); font-weight:700; color:var(--ink); margin-top:var(--s6); margin-bottom:var(--s2)}
.card-body > .sub-h:first-child{margin-top:0}

/* ===================== States ===================== */
.state{display:grid; justify-items:center; text-align:center; gap:var(--s3); padding:var(--s10) var(--s6); border-radius:var(--r-lg); background:var(--surface); box-shadow:0 0 0 1px var(--line)}
.state > .ms{color:var(--blue)}
.state h1,.state h2,.state h3,.state h4{font-size:var(--t20); color:var(--ink)}
.state p{max-width:60ch; color:var(--ink-2)}
.state-error > .ms{color:var(--alert-ink)}
.state-loading{justify-items:stretch; text-align:left}
.sk-stack{display:grid; gap:var(--s3)}
.sk{display:block; height:14px; border-radius:7px; background:var(--tint); animation:pulse 1.2s var(--ease-in-out) infinite}
.sk-w1{width:30%; height:22px} .sk-w2{width:70%} .sk-w3{width:50%} .sk-block{height:160px; border-radius:var(--r-md)}
@keyframes pulse{50%{opacity:.55}}

/* ===================== Stepper ===================== */
.stepper{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:var(--s3); counter-reset:step}
.step{position:relative; display:flex; gap:var(--s3); padding:var(--s3) var(--s4); border-radius:var(--r-md); background:var(--bg); box-shadow:inset 0 0 0 1px var(--line)}
.step-ic{color:var(--ink-2); line-height:0; padding-top:2px}
.step-done .step-ic{color:var(--blue)}
.step-current{background:var(--tint); box-shadow:inset 0 0 0 2px var(--blue)}
.step-current .step-ic{color:var(--blue)}
.step-txt{display:grid; gap:var(--s1); min-width:0; align-content:start}
.step-t{font-weight:700}
.step-d{font-size:var(--t14); color:var(--ink-2); display:flex; flex-wrap:wrap; align-items:center; gap:var(--s1) var(--s2)}

/* ===================== Table ===================== */
.tbl-tools{display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2) var(--s3); margin-bottom:var(--s4)}
.tbl-search{position:relative; flex:1 1 240px; max-width:380px}
.tbl-search .ms{position:absolute; left:var(--s3); top:50%; transform:translateY(-50%); color:var(--ink-2)}
.tbl-search .input{padding-left:40px; min-height:40px}
.tbl-filter{display:inline-flex; align-items:center; min-height:40px; border-radius:var(--r-md); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-strong); padding-left:var(--s3); font-size:var(--t14); color:var(--ink-2); white-space:nowrap}
.tbl-filter:focus-within{box-shadow:inset 0 0 0 2px var(--blue), var(--focus)}
.tbl-filter .input{width:auto; min-width:0; min-height:38px; box-shadow:none; background-color:transparent; font-size:var(--t14); font-weight:600; color:var(--ink); padding-left:var(--s2)}
.tbl-filter .input:focus-visible{box-shadow:none}
.tbl-count{margin-left:auto; font-size:var(--t14); color:var(--ink-2); white-space:nowrap}
.tbl-wrap{overflow-x:auto; border-radius:var(--r-md); box-shadow:0 0 0 1px var(--line)}
.tbl{width:100%; border-collapse:collapse; font-size:var(--a-dense)}
.tbl .num,.tbl .nowrap,.tbl .sched,.tbl-count,.pg-info{font-variant-numeric:tabular-nums}
.tbl tbody th[scope="row"]{min-width:180px}
.tbl td.acts{text-align:right; width:1%; white-space:nowrap}
.tbl th,.tbl td{padding:var(--s2) var(--s3); min-height:var(--a-row); height:var(--a-row); text-align:left; vertical-align:middle; border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--bg); color:var(--ink-2); font-size:var(--t12); font-weight:700; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap}
.tbl tbody th{font-weight:600}
.tbl tbody tr:last-child > *{border-bottom:0}
.tbl tbody tr:hover{background:var(--bg)}
.tbl .wrap{min-width:200px}
.tbl .num{text-align:right}
.th-sort{display:inline-flex; align-items:center; gap:var(--s1); min-height:32px; padding:0 var(--s1); margin-left:calc(-1 * var(--s1)); border:0; background:none; color:inherit; font:inherit; letter-spacing:inherit; text-transform:inherit; cursor:pointer; border-radius:var(--r-sm)}
[aria-sort="ascending"] .th-sort,[aria-sort="descending"] .th-sort{color:var(--blue)}
.tbl .btn{min-height:36px}

/* ===================== Modal ===================== */
.modal{width:min(560px, calc(100vw - 32px)); max-height:calc(100vh - 48px); padding:0; border:0; border-radius:var(--r-xl); background:var(--surface); color:var(--ink); box-shadow:var(--shadow-2)}
.modal.wide{width:min(760px, calc(100vw - 32px))}
.modal::backdrop{background:rgba(0,20,40,.5)}
.modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s3); padding:var(--s6) var(--s6) 0}
.modal-head h2{font-size:var(--t20); line-height:1.3; color:var(--ink); padding-top:6px}
.modal-head h2:focus{outline:none}
.modal-head .btn{margin:calc(-1 * var(--s1)) calc(-1 * var(--s2)) 0 0; color:var(--ink-2)}
.modal-body{padding:var(--s3) var(--s6) var(--s2); display:grid; gap:var(--s3)}
.modal-body .field{margin-top:var(--s2)}
.modal-actions{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:var(--s2); padding:var(--s4) var(--s6) var(--s6)}
.changes{margin:0; padding-left:var(--s6); display:grid; gap:var(--s1)}
.warn-box{display:flex; gap:var(--s3); padding:var(--s3) var(--s4); border-radius:var(--r-md); background:var(--tint); color:var(--ink)}
.warn-box .ms{color:var(--blue)}

/* ===================== Toast ===================== */
#toasts{position:fixed; z-index:90; left:50%; transform:translateX(-50%); bottom:calc(var(--s6) + env(safe-area-inset-bottom, 0px)); display:grid; gap:var(--s2); width:min(560px, calc(100vw - 32px)); pointer-events:none}
.toast{pointer-events:auto; display:flex; align-items:center; gap:var(--s3); padding:var(--s2) var(--s2) var(--s2) var(--s4); min-height:var(--hit-lg); border-radius:var(--r-lg); background:var(--inverse); color:var(--on-inverse); box-shadow:var(--shadow-2); font-size:var(--t14); animation:toastIn var(--d-base) var(--ease-out) both}
.toast-msg{flex:1}
.toast-act{min-height:var(--hit); padding:0 var(--s3); border:0; border-radius:var(--r-pill); background:transparent; color:var(--on-inverse); font-weight:700; text-decoration:underline; cursor:pointer}
.toast-x{width:var(--hit); height:var(--hit); border:0; border-radius:50%; background:transparent; color:var(--on-inverse); display:grid; place-items:center; cursor:pointer}
.toast :focus-visible{box-shadow:0 0 0 2px var(--on-inverse)}
.toast.out{opacity:0; transition:opacity 200ms}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)}}

/* ===================== Sign-in and system pages ===================== */
.auth-main{min-height:100vh; display:grid; place-content:center; justify-items:center; gap:var(--s4); padding-block:var(--s10);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); background:var(--bg)}
.auth-main:focus{outline:none}
.auth-card{width:min(480px, 100%); display:grid; gap:var(--s4); justify-items:start; padding:var(--s8); border-radius:var(--r-xl); background:var(--surface); box-shadow:var(--shadow-2), 0 0 0 1px var(--line)}
.auth-logo{width:232px; height:auto; margin-left:-12px}
:root[data-theme="dark"] .auth-logo{background:#FFFFFF; border-radius:var(--r-md)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .auth-logo{background:#FFFFFF; border-radius:var(--r-md)} }
.auth-lede{color:var(--ink-2)}
.auth-card .btn{min-width:240px}
.auth-acts{display:flex; flex-wrap:wrap; gap:var(--s2); justify-content:flex-end; width:100%}
.auth-acts .btn{min-width:0}
.sim-note{display:flex; align-items:flex-start; gap:var(--s2); font-size:var(--t14); color:var(--ink-2); padding-top:var(--s3); border-top:1px solid var(--line); width:100%}
.auth-flag{display:flex; align-items:center; gap:var(--s2); font-size:var(--t14); font-weight:600; color:var(--ink-2)}
.idp{display:grid; gap:var(--s4); width:100%}
.idp fieldset{border:0; margin:0; padding:0; display:grid; gap:var(--s2)}
.acct{display:flex; align-items:center; gap:var(--s3); padding:var(--s3); border-radius:var(--r-md); box-shadow:inset 0 0 0 1px var(--line-strong); cursor:pointer}
.acct:has(input:checked){box-shadow:inset 0 0 0 2px var(--blue); background:var(--tint)}
.acct input{width:20px; height:20px; margin:0; accent-color:var(--ctl)}
.acct input:focus-visible{box-shadow:var(--focus); border-radius:50%}
.acct .avatar{background:var(--ctl); color:#FFFFFF}
.acct-t{display:grid; min-width:0}
.acct-n{font-weight:700}
.acct-r{font-size:var(--t14); color:var(--ink-2); overflow-wrap:anywhere}
.mfa-wait{display:flex; align-items:center; gap:var(--s3); width:100%; padding:var(--s4); border-radius:var(--r-md); background:var(--tint); color:var(--blue); font-weight:600}
.exit-ic{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--tint); color:var(--blue)}
.sys-page{padding-top:var(--s10)}

/* ===================== Planned pages ===================== */
.planned-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:var(--s4); align-items:start}
.ticks,.qs{list-style:none; margin:0; padding:0; display:grid; gap:var(--s2)}
.ticks li,.qs li{display:flex; gap:var(--s2); align-items:flex-start}
.ticks .ms{color:var(--blue); margin-top:2px}
.q-n{flex:none; font-size:var(--t12); font-weight:700; color:var(--blue); background:var(--tint); border-radius:var(--r-pill); padding:0 var(--s2); line-height:22px; margin-top:1px; font-variant-numeric:tabular-nums}
.qs + .muted{margin-top:var(--s3); font-size:var(--t14)}
.built-note{display:flex; gap:var(--s2); align-items:flex-start; font-size:var(--t14)}

/* ===================== Home screen layout ===================== */
.tabs{display:flex; gap:var(--s1); box-shadow:inset 0 -1px 0 var(--line)}
.tabs [role="tab"]{min-height:var(--hit-lg); padding:0 var(--s4); border:0; background:none; color:var(--ink-2); font-size:var(--t16); font-weight:600; cursor:pointer; border-radius:var(--r-sm) var(--r-sm) 0 0; box-shadow:inset 0 -3px 0 transparent}
.tabs [role="tab"][aria-selected="true"]{color:var(--blue); box-shadow:inset 0 -3px 0 var(--ctl)}
.tabs [role="tab"]:hover{background:var(--tint)}
#aud-panel{display:grid; gap:var(--s6)}
.lc-actions{display:flex; flex-wrap:wrap; gap:var(--s2); margin-top:var(--s4); justify-content:flex-end}
.role-note{display:flex; gap:var(--s2); align-items:flex-start; margin-top:var(--s3); font-size:var(--t14); color:var(--ink-2)}
.role-note .ms,.pv-note .ms{color:var(--blue); margin-top:2px}
.hl-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:var(--s6); align-items:start}
.hl-preview{min-width:0}
.hint-line{font-size:var(--t14); color:var(--ink-2); margin-bottom:var(--s3)}
.fixed-list,.mod-list,.lib-list{list-style:none; margin:0; padding:0; display:grid; gap:var(--s2)}
.fixed-list li{display:flex; align-items:center; gap:var(--s3); padding:var(--s2) var(--s3); border-radius:var(--r-md); background:var(--bg); color:var(--ink)}
.fixed-list li > .ms{color:var(--ink-2)}
.fixed-list .mod-txt{flex:1}
.hl-edit{min-width:0; container:edit / inline-size}
.mod-row,.lib-row{display:grid; grid-template-columns:auto auto minmax(0,1fr); grid-template-areas:"pos ic txt" ". . ctl"; align-items:center; gap:var(--s2) var(--s3); padding:var(--s3); border-radius:var(--r-md); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-strong)}
.mod-pos{grid-area:pos} .mod-row .mod-ic{grid-area:ic} .mod-row .mod-txt{grid-area:txt}
.mod-row > .badge{grid-area:ctl; justify-self:start}
.mod-ctl{grid-area:ctl; justify-self:end}
.lib-row{grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:none; box-shadow:inset 0 0 0 1px var(--line); background:var(--bg)}
@container edit (min-width: 640px){
  .mod-row{grid-template-columns:auto auto minmax(0,1fr) auto auto; grid-template-areas:"pos ic txt badge ctl"}
  .mod-row > .badge{grid-area:badge}
}
.mod-row.is-off{background:var(--bg)}
.mod-row.is-off .mod-t{color:var(--ink-2)}
.mod-pos{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--tint); color:var(--blue); font-size:var(--t14); font-weight:700; font-variant-numeric:tabular-nums}
.mod-ic{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--tint); color:var(--blue); flex:none}
.mod-txt{display:grid; min-width:0}
.mod-t{font-weight:600}
.mod-d{font-size:var(--t14); color:var(--ink-2)}
.mod-ctl{display:flex; align-items:center; gap:2px}
.lib-empty{display:flex; align-items:center; gap:var(--s2); font-size:var(--t14); color:var(--ink-2)}
.lib-empty .ms{color:var(--blue)}

/* Preview */
.pv-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--s2) var(--s3); margin-bottom:var(--s3)}
.pv-k{font-size:var(--t14); font-weight:700}
.pv-what{margin-bottom:var(--s3)}
.hl-grid{--s:var(--a-preview-scale)}
.pv-host{display:grid; justify-content:center}
.pv-device{padding:10px; border-radius:calc(56px * var(--s)); background:var(--bd-bezel); box-shadow:0 16px 40px rgba(0,30,60,.24)}
.pv-screen{width:calc(390px * var(--s)); height:calc(844px * var(--s)); border-radius:calc(44px * var(--s)); overflow:hidden; background:var(--brand)}
.pv-frame{display:block; width:390px; height:844px; border:0; transform:scale(var(--s)); transform-origin:0 0; background:transparent}
.pv-note{display:flex; gap:var(--s2); margin-top:var(--s4); font-size:var(--t12); color:var(--ink-2)}

/* Two columns once the main column has room; the preview scales down before the editor gets cramped */
/* Preview column = scaled phone + bezel (20) + card padding (48) */
@container main (min-width: 700px){
  .hl-grid{--s:.6; grid-template-columns:minmax(0,1fr) calc(390px * var(--s) + 68px)}
  .hl-preview{position:sticky; top:calc(var(--a-header) + var(--s4))}
}
@container main (min-width: 1000px){ .hl-grid{--s:.72} }
@container main (min-width: 1140px){ .hl-grid{--s:var(--a-preview-scale)} }
@container main (max-width: 700px){ .stepper{grid-template-columns:minmax(0,1fr)} }

/* ===================== Responsive shell ===================== */
@media (max-width: 1279px){ .env-k{display:none} }
@media (max-width: 1100px){ .user-txt{display:none} }
@media (max-width: 1180px){ .env-pill{display:none} }
@media (max-width: 1023px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .topbar .nav-toggle{display:inline-flex; color:#FFFFFF; flex:none}
  .sidebar{position:fixed; z-index:35; top:calc(var(--a-header) + env(safe-area-inset-top, 0px)); left:0; bottom:0; height:auto; width:min(var(--a-sidebar), 86vw); transform:translateX(-105%); visibility:hidden; transition:transform var(--d-base) var(--ease-out), visibility 0s var(--d-base); box-shadow:var(--shadow-2)}
  .app.nav-open .sidebar{transform:none; visibility:visible; transition:transform var(--d-base) var(--ease-out)}
  .brand{margin-left:0}
}
@media (max-width: 760px){
  .mf-long,.env-pill{display:none}
  .mf-short{display:inline}
  .brand img{width:187px}
  .brand-admin{display:none}
  .page{--a-gutter:16px}
  h1{font-size:var(--t24)}
  .card-head,.card-body{padding-left:var(--s4); padding-right:var(--s4)}
  .auth-card{padding:var(--s6)}
}
/* Phone width: the mock-data flag gets its own full-width row so it stays visible */
@media (max-width: 560px){
  :root{--a-header:112px}
  .topbar{flex-wrap:wrap; height:auto; min-height:var(--a-header); gap:var(--s2); padding-block:var(--s2); align-content:center}
  .mock-flag{order:5; width:100%; justify-content:center}
  .mf-long{display:inline} .mf-short{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important; animation-iteration-count:1!important; transition-duration:1ms!important}
}

/* ===================== Full portal: shared page parts ===================== */
.theme-sw{display:inline-flex; gap:2px; padding:3px; border-radius:var(--r-pill); background:rgba(255,255,255,.10); box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); flex:none}
.theme-sw button{width:36px; height:36px; border:0; border-radius:50%; background:none; color:var(--on-blue-2); display:grid; place-items:center; cursor:pointer}
.theme-sw button[aria-checked="true"]{background:#FFFFFF; color:var(--brand); --fill:1; --grad:0}
.auth-main .theme-sw{background:var(--surface); box-shadow:var(--shadow-1), 0 0 0 1px var(--line)}
.auth-main .theme-sw button{color:var(--ink-2)}
.auth-main .theme-sw button[aria-checked="true"]{background:var(--ctl); color:#FFFFFF; --grad:-25}
.note-line{display:flex; gap:var(--s2); align-items:flex-start; padding:var(--s3) var(--s4); border-radius:var(--r-md); background:var(--tint); color:var(--ink); font-size:var(--t14)}
.note-line .ms{color:var(--blue); margin-top:1px}
.note-line.small{padding:0; background:none; color:var(--ink-2); font-size:var(--t12)}
.note-line.in-card{margin:var(--s4) var(--s6) 0}
.muted.small,.small{font-size:var(--t12)}
.stat-strip{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:var(--s3)}
.stat{display:flex; align-items:center; gap:var(--s3); padding:var(--s3) var(--s4); border-radius:var(--r-md); background:var(--surface); box-shadow:0 0 0 1px var(--line); font-size:var(--t14); color:var(--ink-2)}

ghbors, in every browser.\n   If the five labels still cannot fit on one line (wider system font), .wrap lets labels break onto two lines. */\n.tabbar{display:flex}\n.tab{flex:1 1 0; min-width:max-content; padding-inline:var(--s1); letter-spacing:-.01em}\n.tab .tl{display:block; text-align:center; line-height:1.2; white-space:nowrap}\n.tabbar.wrap .tab{min-width:min-content; white-space:normal}\n.tabbar.wrap .tab .tl{white-space:normal}\n\n/* Logo yields width before the pill clips (never below the 187.0 brand minimum) */\n.appbar .logo{width:auto; flex:0 1 232px; min-width:200px; max-width:232px}\n/* App bar sign-in pill (guests have no notifications or account) */\n.pill-btn{min-height:var(--hit); padding:0 var(--s4) 0 var(--s3); border:0; border-radius:var(--r-pill); background:rgba(255,255,255,.14); color:#FFFFFF; font-weight:600; font-size:var(--t14); display:inline-flex; align-items:center; gap:var(--s2); white-space:nowrap; flex:none; transition:transform var(--d-snappy) var(--spring-snappy), background-color var(--d-fast)}\n.pill-btn:active{transform:scale(.95); background:rgba(255,255,255,.24); transition-duration:80ms}\n\n/* Quick links: open tiles are Blue; MyChart tiles are tint with a lock and route to sign-in */\n.qa-tile.lockd .dot{background:var(--tint); color:var(--blue); --grad:0}\n.qa-lock{position:absolute; top:var(--s3); right:var(--s3); color:var(--ink-2)}\n.tag{display:inline-flex; align-items:center; gap:var(--s1); font-size:var(--t12); font-weight:600; line-height:1.3; color:var(--blue); background:var(--tint); padding:var(--s1) var(--s2); border-radius:var(--r-pill)}\n.tag.ft{background:var(--ctl); color:#FFFFFF; --grad:-25}\n.tag.muted{background:var(--bg); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line)}\n/* 704, 773\u2013778: keyframes and app bar menu button */\n@keyframes iconPop{from{transform:scale(.5)}}\n/* App bar menu button; Sign in collapses to its icon when the bar runs out of room (360 with large text) */\n.appbar .menu-btn{position:relative}\n.menu-btn .mdot{position:absolute; top:8px; right:8px; width:10px; height:10px; border-radius:50%; background:var(--cyan); box-shadow:0 0 0 2px var(--brand)}\n.phone.narrow.lg .pill-btn{padding:0; width:var(--hit); justify-content:center}\n.phone.narrow.lg .pill-btn .pl{display:none}\n.appbar .logo{min-width:187px}\n/* 1007\u20131033: dark mode */\n/* ===================== Dark mode (app setting: Light, Dark, or System) ===================== */\n/* Only tokens change. Brand surfaces (app bar, hero, splash, campaign) stay UT Southwestern Blue; the page goes\n   deep navy; Blue text and icons lift to a light blue; small controls use a brighter Blue that keeps white text at 5.5:1. */\n.phone.dark{\n  color-scheme:dark;\n  --bg:#0D1620; --surface:#16222E; --tint:#1F3042; --tint-2:#2A4157; --sky:#1F3042;\n  --line:#2B3C4D; --line-strong:#7D8E9E;\n  --ink:#E6EDF3; --ink-2:#A6B4C0;\n  --blue:#8CC0EA; --ctl:#2D6CA6; --alert-ink:#FF8AA8;\n  --field-on-brand:#0D1620; --bar-glass:rgba(22,34,46,.94); --inverse:#E6EDF3; --on-inverse:#0D1620;\n  --map-bg:#132130; --map-block:#1C2F42; --map-block-2:#24394F; --map-road:#2E4760;\n  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);\n  --shadow-2:0 4px 12px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);\n  --focus:0 0 0 2px #0D1620, 0 0 0 5px #8CC0EA;\n}\n/* Map drawings take their colors from the theme */\n.m-bg{fill:var(--map-bg)} .m-block{fill:var(--map-block)} .m-block2{fill:var(--map-block-2)}\n.m-road{stroke:var(--map-road); fill:none} .m-edge{stroke:var(--map-road)} .m-pin{fill:var(--blue)} .m-start{fill:var(--surface); stroke:var(--blue)}\n/* Dark-only touches: a hairline so the search field reads on Blue, softer illustrations, and the offline bar's Retry on a light pill */\n.phone.dark .search-field{box-shadow:0 8px 24px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.16)}\n.phone.dark :is(.feat-art,.art-hero,.blog-th) svg{filter:brightness(.86) saturate(.92)}\n.phone.dark .netbar button{background:rgba(13,22,32,.1); color:var(--on-inverse)}\n.phone.dark .netbar :focus-visible{box-shadow:0 0 0 3px var(--on-inverse)!important}\n.phone.dark .content{box-shadow:0 -8px 24px rgba(0,0,0,.35)}\n.phone.dark .tabbar{box-shadow:0 8px 24px rgba(0,0,0,.45), 0 0 0 1px var(--line)}\n.phone.dark .sk{background:var(--tint)}\n.phone.dark .choice.primary small{color:#FFFFFF}\n/* 1049\u20131050: module stack */\n.content{gap:var(--s6)}\n.mods{display:grid; grid-template-columns:minmax(0,1fr); gap:var(--s8)}\n\n/* 439\u2013451: sheet (EULA and alert details) */\n.sheet{position:absolute; left:0; right:0; bottom:0; z-index:51; background:var(--surface); border-radius:var(--r-xl) var(--r-xl) 0 0; padding:var(--s3) var(--s6) var(--s8); max-height:85%; overflow-y:auto; transform:translateY(100%); transition:transform var(--d-slow) var(--spring-gentle)}\n.sheet.show{transform:none}\n.sheet .grab{width:40px; height:4px; border-radius:var(--r-pill); background:var(--line); margin:0 auto var(--s4)}\n.sheet h2{font-size:var(--t24); line-height:1.25; color:var(--blue); font-weight:700; letter-spacing:-.01em; padding-right:var(--s12)}\n.sheet p{margin-top:var(--s3)}\n.sheet .meta{font-size:var(--t14); color:var(--ink-2)}\n.sheet .close{position:absolute; top:var(--s3); right:var(--s3)}\n.sheet .btn{margin-top:var(--s6); width:100%}\n.sheet .group{margin:var(--s4) 0 0; box-shadow:0 0 0 1px var(--line)}\n.sheet .kick-alert{display:inline-flex; align-items:center; gap:var(--s2); background:var(--alert); color:#FFFFFF; font-weight:700; font-size:var(--t14); text-transform:uppercase; letter-spacing:.04em; padding:var(--s1) var(--s3) var(--s1) var(--s2); border-radius:var(--r-pill); margin-bottom:var(--s3); --grad:-25}\n.sheet .phone-num{font-weight:700; color:var(--blue); user-select:all}\n.sheet-empty{display:grid; justify-items:center; text-align:center; gap:var(--s2); padding-top:var(--s4)}\n.sheet-empty p{color:var(--ink-2)}\n/* 781\u2013795: menu drawer */\n.dr-bd{position:absolute; inset:0; z-index:48; background:rgba(0,20,40,.4); opacity:0; transition:opacity var(--d-base) var(--ease-out)}\n.dr-bd.show{opacity:1}\n.drawer{position:absolute; top:0; bottom:0; right:0; z-index:49; width:min(88%, 344px); background:var(--bg); border-radius:var(--r-xl) 0 0 var(--r-xl); display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow-2); transform:translateX(100%); transition:transform var(--d-gentle) var(--spring-gentle)}\n.drawer.show{transform:none}\n.dr-hd{display:flex; align-items:center; justify-content:space-between; gap:var(--s2); padding:56.0px var(--s4) var(--s4) var(--s6); background:var(--glow), var(--brand); color:#FFFFFF; --grad:-25}\n.dr-hd h2{font-size:var(--t24); line-height:1.2; font-weight:700; letter-spacing:-.01em}\n.dr-hd p{font-size:var(--t14); color:var(--on-blue-2); margin-top:var(--s1)}\n.dr-hd :focus-visible{box-shadow:var(--focus-on-blue)}\n.dr-body{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:var(--s2) 0 var(--s8)}\n.dr-body .group{margin:0 var(--s4)}\n.dr-body .ts-label{margin-top:var(--s6)}\n.row .ext{color:var(--ink-2)}\n.row .newc{font-size:var(--t12); font-weight:700; color:#FFFFFF; background:var(--ctl); border-radius:var(--r-pill); padding:2px var(--s2); white-space:nowrap; --grad:-25}\n.social{list-style:none; margin:0; padding:0 var(--s4); display:flex; flex-wrap:wrap; gap:var(--s2)}\n.dr-foot{padding:var(--s6) var(--s6) 0; font-size:var(--t12); color:var(--ink-2)}\n/* 966\u2013983: sign-in choice */\n/* Sign-in choice */\n.lg-top{position:relative; flex:0 0 auto; padding:96.0px var(--s6) var(--s8); background:var(--hero-glow), var(--brand); border-radius:0 0 var(--r-xl) var(--r-xl); overflow:hidden; color:#FFFFFF; display:grid; justify-items:start; gap:var(--s4); --grad:-25}\n.lg-top .logo{display:block; width:232px; height:auto; margin-left:calc(-1 * var(--s4))}\n.lg-top h2{font-size:var(--t32); line-height:1.15; font-weight:700; letter-spacing:-.02em; text-wrap:balance; position:relative}\n.lg-top p{color:var(--on-blue-2); position:relative}\n.lg-body{flex:1; overflow-y:auto; padding:var(--s6) var(--s4) var(--s8); display:grid; gap:var(--s3); align-content:start}\n.lg-body > h3{font-size:var(--t20); line-height:1.3; font-weight:700; color:var(--blue); padding-inline:var(--s2)}\n.choice{width:100%; display:flex; align-items:center; gap:var(--s3); padding:var(--s4); border:0; border-radius:var(--r-lg); background:var(--surface); box-shadow:var(--shadow-1), 0 0 0 1px var(--line); text-align:left; color:var(--ink); transition:transform var(--d-snappy) var(--spring-snappy), background-color var(--d-fast)}\n.choice:active{transform:scale(.98); background:var(--tint); transition-duration:80ms; --fill:1}\n.choice .txt{flex:1; min-width:0; display:grid; gap:2px}\n.choice b{font-size:var(--t18); line-height:1.3; color:var(--blue)}\n.choice small{font-size:var(--t14); line-height:1.4; color:var(--ink-2)}\n.choice.primary{background:var(--ctl); box-shadow:0 12px 32px -12px rgba(0,66,120,.6); --grad:-25}\n.choice.primary b{color:#FFFFFF}\n.choice.primary small{color:var(--on-blue-2)}\n.choice.primary .dot{background:#FFFFFF; color:var(--brand); --grad:0}\n.choice.primary .chev{color:#FFFFFF}\n.choice.primary:focus-visible{box-shadow:var(--focus)}\n\n/* ===================== Admin preview additions (not in designs/guest) ===================== */\n/* The preview is read-only: controls are drawn but take no pointer or keyboard input; the scroller is the one tab stop */\n.phone button{pointer-events:none}\n.scroller:focus-visible{outline:none; box-shadow:inset 0 0 0 3px #FFFFFF, inset 0 0 0 6px #004278!important}\n.mod{animation:none}\n.pv-empty{margin:0 var(--s4); padding:var(--s6) var(--s4); border-radius:var(--r-lg); border:1.5px dashed var(--line-strong); color:var(--ink-2); font-size:var(--t14); text-align:center}\n/* Static states for the preview: the drawer, sheets and lock screen show open */\n.drawer.pv{transform:none; width:min(88%, 344px)}\n.dr-bd.pv{opacity:1}\n.sheet.pv{transform:none; box-shadow:0 -12px 32px rgba(0,20,40,.24)}\n.pv-shade{position:absolute; inset:0; z-index:50; background:rgba(0,20,40,.4)}\n.lg-wrap{display:flex; flex-direction:column; min-height:100%; background:var(--bg)}\n.lg-top .hero-art{position:absolute}\n.dot.d40 .ms{font-size:20px}\n.dr-off{opacity:.45}\n.dr-off .rt::after{content:\" (hidden)\"; font-weight:400}\n.lock{position:absolute; inset:0; background:radial-gradient(120% 80% at 80% 0%, #336893 0, #004278 55%, #0D1620 100%); color:#FFFFFF; display:flex; flex-direction:column; align-items:center; padding:96px var(--s4) 0; --grad:-25}\n.lock-time{font-size:72px; font-weight:300; line-height:1; letter-spacing:-.02em}\n.lock-date{font-size:var(--t16); color:var(--on-blue-2); margin-top:var(--s2)}\n.push{width:100%; margin-top:var(--s10); background:rgba(255,255,255,.92); color:#1F2A33; border-radius:var(--r-lg); padding:var(--s3); display:grid; gap:var(--s1); box-shadow:0 8px 24px rgba(0,0,0,.25)}\n.push-top{display:flex; align-items:center; gap:var(--s2); font-size:var(--t12); color:#4A5560; text-transform:uppercase; letter-spacing:.04em; font-weight:600}\n.push-top img{width:20px; height:20px; border-radius:5px}\n.push-top .when{margin-left:auto; text-transform:none; letter-spacing:0; font-weight:400}\n.push-t{font-weight:700; font-size:var(--t16); line-height:1.3}\n.push-b{font-size:var(--t14); line-height:1.4}\n.push-img{border-radius:var(--r-md); overflow:hidden; height:120px; margin-top:var(--s2)}\n.push-img svg{width:100%; height:100%; display:block}\n.push-note{margin-top:auto; margin-bottom:var(--s8); font-size:var(--t12); color:var(--on-blue-2); text-align:center}\n.inbox-card{margin:var(--s4); display:grid; gap:var(--s3)}\n.camp-img{height:120px; overflow:hidden}\n.camp-img svg{display:block; width:100%; height:100%}\n.loc-card{margin:var(--s4); background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-1), 0 0 0 1px var(--line); overflow:hidden}\n.loc-map{height:140px; background:var(--map-bg); position:relative}\n.loc-map i{position:absolute; left:50%; top:50%; width:20px; height:20px; border-radius:50%; background:var(--ctl); box-shadow:0 0 0 6px rgba(0,66,120,.2); transform:translate(-50%,-50%)}\n.loc-body{padding:var(--s4); display:grid; gap:var(--s2)}\n.loc-body h2{font-size:var(--t20); color:var(--blue); line-height:1.3}\n.loc-tip{display:flex; gap:var(--s2); align-items:flex-start; padding:var(--s3); border-radius:var(--r-md); background:var(--tint); color:var(--ink); font-size:var(--t14)}\n.loc-tip .ms{color:var(--blue)}\n.loc-row{display:flex; gap:var(--s2); align-items:center; font-size:var(--t14); color:var(--ink-2)}\n.loc-row .ms{color:var(--blue)}\n.pv-head{padding:56px var(--s4) var(--s4); background:var(--brand); color:#FFFFFF}\n.pv-head h1{font-size:var(--t24); font-weight:700}\n.pv-head p{color:var(--on-blue-2); font-size:var(--t14)}\n.alert-cta{display:flex; gap:var(--s2); flex-wrap:wrap}\n";

t|Oct|Nov|Dec)\\. (\\d)/g, '$1.\u00a0$2'], [/UT Southwestern/g, 'UT\u00a0Southwestern']];\n  function nbsp(root) {\n    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);\n    for (let n = w.nextNode(); n; n = w.nextNode()) { const v = NB.reduce((s, [re, to]) => s.replace(re, to), n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }\n  }\n\n  let C = null, M = null;\n  const R = {\n    alerts() {\n      const list = (C.alerts || []).slice().sort((a, b) => a.priority - b.priority).slice(0, 2);\n      if (!list.length) return '';\n      return `<section class=\"alerts\" aria-label=\"Emergency alerts\"><div class=\"alert-wrap all\">${list.map((al, i) => `<div class=\"alert ${i ? 'extra' : 'open'}\">\n        <div class=\"alert-row\"><span class=\"alert-ico\">${ico(al.icon === 'warning' ? 'alert' : al.icon)}</span>\n          <div class=\"alert-txt\"><p class=\"alert-kicker\">Alert${list.length > 1 ? `<span class=\"pri\">\u00b7 Priority ${i + 1} of ${list.length}</span>` : ''}</p><p class=\"alert-title\">${esc(al.title)}</p></div>\n          ${i === 0 ? `<button class=\"alert-tog\" type=\"button\" aria-expanded=\"true\" aria-label=\"Hide alert details\">${ico('expand')}</button>` : ''}</div>\n        ${i === 0 ? `<div class=\"alert-body\"><div><p>${esc(al.message)}</p>${al.window ? `<p class=\"alert-meta\">${esc(al.window)}</p>` : ''}\n          <div class=\"alert-actions\">${al.ctaLabel ? `<button class=\"alert-btn\" type=\"button\">${esc(al.ctaLabel)}</button>` : ''}${al.dismissible ? '<button class=\"alert-btn\" type=\"button\" style=\"background:transparent;color:#FFFFFF;box-shadow:inset 0 0 0 1.5px #FFFFFF\">Dismiss</button>' : ''}</div></div></div>` : ''}\n      </div>`).join('')}</div></section>`;\n    },\n    greeting() {\n      const signed = M.audience === 'authenticated';\n      return `<section class=\"greet\" aria-labelledby=\"greet-h\">\n        <div class=\"greet-top\"><p class=\"eyebrow\">${signed ? 'Welcome back, Jordan' : 'Welcome to U ><span class=\"qa-lbl\">${esc(t.title)}</span></span><span class=\"qa-lock\">${ico('lock', 16)}</span></button>`\n        : `<button class=\"qa-tile\" type=\"button\">${circle(t.icon, 48, 'solid')}<span class=\"qa-txt\"><span class=\"qa-lbl\">${esc(t.title)}</span></span></button>`;\n      const list = C.quickLinks || [];\n      return `<section aria-labelledby=\"qa-h\"><div class=\"sec-head\"><h2 id=\"qa-h\">Quick links</h2></div>\n        ${list.length ? `<div class=\"qa\">${list.map(tile).join('')}</div>` : '<p class=\"pv-empty\">No quick links are on.</p>'}</section>`;\n    },\n    featured() {\n      return `<section aria-labelledby=\"feat-h\">\n        <div class=\"sec-head\"><h2 id=\"feat-h\">MedBlog</h2><button class=\"link\" type=\"button\">See all</button></div>\n        <div class=\"car\" role=\"group\" aria-roledescription=\"carousel\" aria-label=\"Latest MedBlog articles\">${C.featured.map(f => `\n          <button class=\"feat\" type=\"button\"><span class=\"feat-art\">${art(f.art)}</span>\n            <span class=\"feat-body\"><span class=\"kick\">${esc(f.kick)}</span><span class=\"feat-title\">${esc(f.title)}</span><span class=\"feat-meta\">${esc(f.meta)}</span></span></button>`).join('')}\n        </div>\n        <div class=\"car-ctrl\"><span class=\"car-track\" aria-hidden=\"true\"><span class=\"car-thumb\" style=\"width:25%\"></span></span>\n          <div class=\"car-arrows\"><button class=\"icon-btn\" type=\"button\" aria-label=\"Previous article\">${ico('prev')}</button><button class=\"icon-btn\" type=\"button\" aria-label=\"Next article\">${ico('next')}</button></div></div>\n      </section>`;\n    },\n    services() {\n      const list = C.resources || [];\n      return `<section aria-labelledby=\"svc-h\"><div class=\"sec-head\"><h2 id=\"svc-h\">UTSW resources</h2></div>\n        ${list.length ? `<ul class=\"group\">${list.map(s => row({ ic: s.icon, title: s.title, sub: s.subtitle, cls: s.highlight ? 'pv-hl' : '' })).join('')}</ul>` : '<p class=\"pv-empty\">No featured cards are on.</p>'}</section>`;\n    },\n    campaign() {\n      const k = C.campaign;\n      if (!k) return '';\n      return `<section class=\"camp\" aria-labelledby=\"camp-h\">\n        ${k.art ? `<div class=\"camp-img\">${art(k.art)}</div>` : ''}\n        <div class=\"camp-top\">\n          <div><p class=\"camp-tag\"><i></i>${esc(k.tag || k.type)}</p><h2 id=\"camp-h\">${esc(k.title || 'Campaign title')}</h2></div>\n          <div class=\"camp-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 96 96\"><g class=\"rings\"><circle cx=\"48\" cy=\"48\" r=\"47\" fill=\"#336893\" opacity=\".55\"/><circle cx=\"48\" cy=\"48\" r=\"38\" fill=\"none\" stroke=\"#7BAFD4\" stroke-width=\"1.5\" stroke-dasharray=\"3 5\" opacity=\".8\"/><circle cx=\"86\" cy=\"22\" r=\"5\" fill=\"#00A9E0\"/><circle cx=\"12\" cy=\"74\" r=\"3\" fill=\"#7BAFD4\"/></g></svg>${circle(k.icon || 'vaccines', 56)}</div>\n          ${k.description ? `<p>${esc(k.description)}</p>` : ''}\n        </div>\n        ${k.fact1Label || k.fact2Label ? `<ul class=\"camp-facts\">${[[k.fact1Label, k.fact1Value, 'countdown'], [k.fact2Label, k.fact2Value, 'place']].filter(f => f[0]).map(([kk, v, i]) => `<li>${ico(i === 'countdown' ? 'schedule' : 'location_on', 20)}<span class=\"k\">${esc(kk)}</span><span class=\"v\">${esc(v)}</span></li>`).join('')}</ul>` : ''}\n        <div class=\"camp-cta\">${k.ctaLabel ? `<button class=\"btn btn-light\" type=\"button\"><span class=\"lbl\">${esc(k.ctaLabel)}</span>${ico('go', 20)}</button>` : ''}\n          <button class=\"camp-cal\" type=\"button\" aria-pressed=\"false\" aria-label=\"Add to calendar\">${ico('addCal', 24)}</button></div>\n      </section>`;\n    },\n    news() {\n      return `<section aria-labelledby=\"ann-h\"><div class=\"sec-head\"><h2 id=\"ann-h\">Announcements</h2><button class=\"link\" type=\"button\">See all</button></div>\n        <ul class=\"group\">${C.announcements.map(a => row({ lead: `<span class=\"datebox\" aria-hidden=\"true\"><spa const ic = (name, size = 24, extra = '') => `<span class="ms${size === 24 ? '' : ' s' + size}${extra ? ' ' + extra : ''}" aria-hidden="true">${name}</span>`;

/* AP style dates and times in Central Time (Dallas): Oct. 30, 2026, 9:41 a.m. CT */
const AP_MONTHS = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
const TZ = 'America/Chicago';
function tzParts(iso) {
  const d = new Date(iso);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true })
    .formatToParts(d).map(x => [x.type, x.value]));
  return { y: p.year, m: +p.month - 1, d: p.day, h: +p.hour, min: p.minute, pm: /p/i.test(p.dayPeriod) };
}
function apTime(p) {
  if (p.min === '00' && p.h === 12) return p.pm ? 'noon' : 'midnight';
  return `${p.h}${p.min === '00' ? '' : ':' + p.min} ${p.pm ? 'p.m.' : 'a.m.'}`;
}
const fmtDate = iso => { const p = tzParts(iso); return `${AP_MONTHS[p.m]} ${p.d}, ${p.y}`; };
const fmtDateTime = iso => { const p = tzParts(iso); return `${AP_MONTHS[p.m]} ${p.d}, ${p.y}, ${apTime(p)} CT`; };

/* Device storage: always wrapped, the page works without it (private windows, previews) */
const STORE_KEY = 'utsw-admin-mock-v1';
const store = {
  read() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || null; } catch (e) { return null; } },
  write(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep working in memory */ } },
  clear() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } }
};

/* Screen reader announcements (polite) */
function announce(msg) {
  const el = $('#sr-live'); if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 30);
}
const pluralize = w => /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : /(s|x|ch|sh)$/.test(w) ? w + 'es' : w + 's';
const plural = (n, one, many = pluralize(one)) => `${n} ${n === 1 ? one : many}`;

/* Local Central Time date-times stored as 'YYYY-MM-DDTHH:MM' (what a datetime-local field gives) */
function nowLocal() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
function fmtLocal(s, withYear = true) {
  if (!s) return '–';
  const [d, tm = '00:00'] = s.split('T'), [y, m, day] = d.split('-').map(Number), [h, min] = tm.split(':').map(Number);
  const p = { h: h % 12 || 12, min: String(min).padStart(2, '0'), pm: h >= 12 };
  return `${AP_MONTHS[m - 1]} ${day}${withYear ? `, ${y}` : ''}, ${h === 12 && !min ? 'noon' : h === 0 && !min ? 'midnight' : apTime(p)}`;
}
const fmtDay = s => { const [y, m, d] = s.split('-').map(Number); return `${AP_MONTHS[m - 1]} ${d}`; };
/* Scheduled content status from its window */
function windowStatus(d) {
  if (d.enabled === false) return 'off';
  const n = nowLocal();
  if (d.start && n < d.start) return 'upcoming';
  if (d.end && n > d.end) return 'ended';
  return 'active';
}
const fmtNum = (v, unit) => unit === 'count' ? Math.round(v).toLocaleString('en-US') : unit === '%' ? `${v.toFixed(1)}%` : unit === 's' ? `${v.toFixed(2)} s` : unit === 'ms' ? `${Math.round(v)} ms` : String(v);
const debounce = (fn, ms = 150) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* Levels, lowest to highest. draft = edit drafts and request review; demo = also deploy to demo;
   publish = also publish to production, request changes and roll back; manage = full control (users). */

const PERMISSIONS = {
  status: 'Proposed – pending confirmation',
  areas: {
    dashboard: { superAdmin: 'view', admin: 'view', marketing: 'view' },
    analytics: { superAdmin: 'view', admin: 'view', marketing: 'view' },
    homeLayout: { superAdmin: 'publish', admin: 'publish', marketing: 'draft' },
    quickLinks: { superAdmin: 'publish', admin: 'publish', marketing: 'draft' },
    featuredCards: { superAdmin: 'publish', admin: 'publish', marketing: 'draft' },
    drawer: { superAdmin: 'publish', admin: 'publish', marketing: 'draft' },
    appEntry: { superAdmin: 'publish', admin: 'publish', marketing: 'draft' },
    campaigns: { superAdmin: 'publish', admin: 'publish', marketing: 'demo' },
    alerts: { superAdmin: 'publish', admin: 'publish', marketing: 'view' },

    adminSettings: { superAdmin: 'publish', admin: 'view', marketing: 'none' },
    locations: { superAdmin: 'publish', admin: 'publish', marketing: 'view' }
  }
};
const levelOf = (role, area) => (PERMISSIONS.areas[area] || {})[role] || 'none';
const can = (role, area, need = 'view') => LEVELS.indexOf(levelOf(role, area)) >= LEVELS.indexOf(need);
/* Lifecycle actions → the level each needs */
const ACTION_NEEDS = { saveDraft: 'draft', requestReview: 'draft', deployDemo: 'demo', requestChanges: 'publish', publish: 'publish', rollback: 'publish' };
const canAct = (role, area, action) => can(role, area, ACTION_NEEDS[action]);

/* ===== src/services/services.js ===== */
/* ==========================================================================================
   MOCK SERVICE LAYER. Async interfaces with simulated latency and optional simulated errors.
   No network requests are made; there are no endpoints or credentials anywhere in this app.
   A real backend replaces the bodies of these functions; screens only call the interfaces.
   ========================================================================================== */
const MockSettings = { latency: [160, 380], simulateErrors: false };
class ServiceError extends Error {}
const wait = ms => new Promise(r => setTimeout(r, ms));
const SCHEMA = 3;
let DB = null;
function loadDb() {
  const saved = store.read();
  DB = saved && saved.db && saved.db.schema === SCHEMA ? saved : { db: seedDb(), session: saved && saved.session && saved.db && saved.db.schema === SCHEMA ? saved.session : null, prefs: (saved && saved.prefs) || {} };
  MockSettings.simulateErrors = !!DB.prefs.simulateErrors;
}
const saveDb = () => store.write(DB);
function resetMockData() {
  DB = { db: seedDb(), session: DB.session, prefs: { theme: DB.prefs.theme } };
  MockSettings.simulateErrors = false;
  saveDb();
}
async function mockCall(name, fn) {
  const [a, b] = MockSettings.latency;
  await wait(a + Math.random() * (b - a));
  if (MockSettings.simulateErrors) throw new ServiceError(`The mock ${name} service returned a simulated error. Turn off “Simulate service errors” in the user menu, then try again.`);
  const out = fn();
  saveDb();
  return clone(out);
}
const actor = () => DB.session && DB.session.userId;
const nowIso = () => new Date().toISOString();
function needs(area, level) {
  const role = DB.session && DB.session.role;
  if (!role || !can(role, area, level)) throw new ServiceError('Your role does not allow this action.');
}
function audit(action, target, { targetId = null, targetType = null, environment = null, version = null, comment = '', before = null, after = null } = {}) {
  DB.db.audit.push({ id: uid('au'), at: nowIso(), by: actor(), action, target, targetId, targetType, environment, version, comment, before: before && clone(before), after: after && clone(after) });
}

/* ---------- Config schema (HANDOVER §6.3) ----------
   supportsRollback is per type; every value is an assumption pending confirmation (§10.17). */
const CONFIG_TYPES = {
  homeLayout: { label: 'Home screen layout', area: 'homeLayout', supportsRollback: true, route: 'home-layout' },
  campaign: { label: 'Campaign', area: 'campaigns', supportsRollback: false, route: 'home-campaigns' },
  alert: { label: 'Emergency alert', area: 'alerts', supportsRollback: false, route: 'home-alerts' },
  quickLink: { label: 'Quick link', area: 'quickLinks', supportsRollback: true, route: 'home-quick-links' },
  featuredCard: { label: 'Featured card', area: 'featuredCards', supportsRollback: true, route: 'home-featured-cards' },
  drawer: { label: 'Drawer / More options', area: 'drawer', supportsRollback: true, route: 'content-drawer' },
  globalColors: { label: 'Global colors', area: 'colors', supportsRollback: true, route: 'content-colors' },
  appEntry: { label: 'App entry', area: 'appEntry', supportsRollback: true, route: 'content-app-entry' },
  searchMappings: { label: 'Query mappings', area: 'search', supportsRollback: true, route: 'search-query-mappings' },
  searchSynonyms: { label: 'Synonyms', area: 'search', supportsRollback: true, route: 'search-synonyms' },
  searchSpecialties: { label: 'Specialty mapping', area: 'search', supportsRollback: true, route: 'search-specialties' },
  searchRanking: { label: 'Ranking', area: 'search', supportsRollback: true, route: 'search-ranking' },
  segment: { label: 'Audience segment', area: 'audiences', supportsRollback: false, route: 'audiences' },
  locations: { label: 'Location-aware configuration', area: 'locations', supportsRollback: true, route: 'admin-settings-locations' }
};
const recLink = r => CONFIG_TYPES[r.type].route + (['campaign', 'alert', 'quickLink', 'featuredCard', 'segment'].includes(r.type) ? `-${r.id}` : '');
/* What each environment holds */
const dataAt = (r, env) => env === 'draft' ? r.draft && r.draft.data : env === 'demo' ? r.demo && r.versions[r.demo].data : r.production && r.versions[r.production].data;
const latestData = r => dataAt(r, 'draft') || dataAt(r, 'demo') || dataAt(r, 'production');
const recName = d => d.title || d.name || null;

function rec(id) { const r = DB.db.records[id]; if (!r) throw new ServiceError('That item no longer exists. It may have been deleted.'); return r; }
function guard(r, action) {
  const role = DB.session && DB.session.role;
  if (!role || !canAct(role, CONFIG_TYPES[r.type].area, action)) throw new ServiceError('Your role does not allow this action.');
}
function logEvent(r, action, environment, version, comment, before, after) {
  const e = { id: uid('ev'), action, environment, version, by: actor(), at: nowIso(), comment: comment || '' };
  r.events.push(e);
  audit(action, r.name, { targetId: r.id, targetType: r.type, environment, version, comment, before, after });
}

const ConfigService = {
  get: id => mockCall('configuration', () => rec(id)),
  list: type => mockCall('configuration', () => Object.values(DB.db.records).filter(r => !type || r.type === type)),
  peek: id => DB.db.records[id] ? clone(DB.db.records[id]) : null, /* synchronous read for previews and pickers */
  peekAll: type => clone(Object.values(DB.db.records).filter(r => r.type === type)),
  create: (type, data, comment) => mockCall('configuration', () => {
    const area = CONFIG_TYPES[type].area; needs(area, 'draft');
    const id = `${type.replace(/[A-Z]/g, c => '-' + c.toLowerCase())}-${Date.now().toString(36)}`;
    const r = { id, type, name: recName(data) || CONFIG_TYPES[type].label, versions: {}, production: null, demo: null, draft: null, review: null, nextVersion: 1, events: [] };
    r.draft = { data: clone(data), updatedBy: actor(), updatedAt: nowIso(), comment: comment || '', baseVersion: null };
    DB.db.records[id] = r;
    logEvent(r, 'Created as draft', 'draft', null, comment, null, data);
    return r;
  }),
  remove: id => mockCall('configuration', () => {
    const r = rec(id); guard(r, 'saveDraft');
    if (r.production || r.demo) throw new ServiceError('Published items can’t be deleted. Turn the item off and publish instead, so the change is versioned.');
    delete DB.db.records[id];
    audit('Deleted draft', r.name, { targetId: id, targetType: r.type, environment: 'draft', before: r.draft && r.draft.data });
    return { id };
  }),
  saveDraft: (id, data, comment) => mockCall('configuration', () => {
    const r = rec(id); guard(r, 'saveDraft');
    const before = latestData(r);
    r.draft = { data: clone(data), updatedBy: actor(), updatedAt: nowIso(), comment: comment || '', baseVersion: r.production };
    r.review = null;
    if (recName(data)) r.name = recName(data);
    logEvent(r, 'Draft saved', 'draft', null, comment, before, data);
    return r;
  }),
  discardDraft: id => mockCall('configuration', () => {
    const r = rec(id); guard(r, 'saveDraft');
    const before = r.draft && r.draft.data;
    r.draft = null; r.review = null;
    const d = latestData(r); if (d && recName(d)) r.name = recName(d);
    logEvent(r, 'Draft discarded', 'draft', null, '', before, null);
    return r;
  }),
  requestReview: (id, comment) => mockCall('configuration', () => {
    const r = rec(id); guard(r, 'requestReview');
    if (!r.draft) throw new ServiceError('Save a draft before you request a review.');
    r.review = { by: actor(), at: nowIso(), comment: comment || '' };
    logEvent(r, 'Review requested', 'draft', null, comment);
    return r;
  }),
  deployToDemo: (id, comment) => mockCall('publishing', () => {
    const r = rec(id); guard(r, 'deployDemo');
    if (!r.draft) throw new ServiceError('There is no saved draft to deploy.');
    const before = dataAt(r, 'demo');
    const v = r.nextVersion++;
    r.versions[v] = { version: v, data: clone(r.draft.data), updatedBy: actor(), updatedAt: nowIso(), comment: comment || r.draft.comment || '' };
    r.demo = v; r.draft = null; r.review = null;
    logEvent(r, 'Deployed to demo', 'demo', v, comment, before, r.versions[v].data);
    return r;
  }),
  requestChanges: (id, comment) => mockCall('publishing', () => {
    const r = rec(id); guard(r, 'requestChanges');
    if (!r.demo || r.demo === r.production) throw new ServiceError('There is nothing on demo waiting for production.');
    r.draft = { data: clone(r.versions[r.demo].data), updatedBy: actor(), updatedAt: nowIso(), comment: `Changes requested: ${comment}`, baseVersion: r.production, changesRequested: comment };
    logEvent(r, 'Changes requested', 'demo', r.demo, comment);
    return r;
  }),
  publish: (id, comment) => mockCall('publishing', () => {
    const r = rec(id); guard(r, 'publish');
    if (!r.demo || r.demo === r.production) throw new ServiceError('Deploy to demo and check it there before you publish.');
    if (DB.db.settings.requirePublishComment && !comment) throw new ServiceError('A comment is required to publish (Administrative settings).');
    const before = dataAt(r, 'production');
    r.production = r.demo;
    logEvent(r, 'Published to production', 'production', r.demo, comment, before, r.versions[r.demo].data);
    return r;
  }),
  rollback: (id, toVersion, comment) => mockCall('publishing', () => {
    const r = rec(id); guard(r, 'rollback');
    if (!CONFIG_TYPES[r.type].supportsRollback) throw new ServiceError(`${CONFIG_TYPES[r.type].label} does not support rollback.`);
    const old = r.versions[toVersion]; if (!old) throw new ServiceError(`Version ${toVersion} does not exist.`);
    const before = dataAt(r, 'production');
    const v = r.nextVersion++;
    r.versions[v] = { version: v, data: clone(old.data), updatedBy: actor(), updatedAt: nowIso(), comment: `Rollback to v${toVersion}: ${comment}`, rollbackOf: toVersion };
    r.production = v; r.demo = v;
    logEvent(r, `Rolled back to v${toVersion}`, 'production', v, comment, before, old.data);
    return r;
  })
};

/* ---------- Admin users ---------- */
const UserService = {
  list: () => mockCall('users', () => DB.db.users),
  get: id => mockCall('users', () => { const u = DB.db.users.find(x => x.id === id); if (!u) throw new ServiceError('That user no longer exists.'); return u; }),
  byId: id => DB.db.users.find(u => u.id === id) || null,
  name: id => { const u = UserService.byId(id); return u ? `${u.first} ${u.last}` : 'Unknown user'; },
  emailTaken: (email, exceptId) => DB.db.users.some(u => u.email.toLowerCase() === email.trim().toLowerCase() && u.id !== exceptId),
  create: d => mockCall('users', () => {
    needs('users', 'manage');
    if (UserService.emailTaken(d.email)) throw new ServiceError(`An account already exists for ${d.email}.`);
    const u = { id: uid('u'), first: d.first.trim(), last: d.last.trim(), email: d.email.trim().toLowerCase(), role: d.role, status: 'invited', created: nowIso(), lastSignIn: null };
    DB.db.users.push(u);
    audit('User invited', `${u.first} ${u.last}`, { targetId: u.id, targetType: 'user', after: { role: ROLES[u.role].label, status: 'Invited', email: u.email } });
    return u;
  }),
  update: (id, patch) => mockCall('users', () => {
    needs('users', 'manage');
    const u = DB.db.users.find(x => x.id === id); if (!u) throw new ServiceError('That user no longer exists.');
    if (patch.email && UserService.emailTaken(patch.email, id)) throw new ServiceError(`Another account already uses ${patch.email}.`);
    if (id === actor() && patch.role && patch.role !== u.role) throw new ServiceError('You can’t change your own role. Ask another Super Admin.');
    const before = {}, after = {};
    Object.keys(patch).forEach(k => { if (u[k] !== patch[k]) { before[k] = k === 'role' ? ROLES[u[k]].label : u[k]; after[k] = k === 'role' ? ROLES[patch[k]].label : patch[k]; u[k] = patch[k]; } });
    if (Object.keys(after).length) audit(after.role ? 'Role changed' : 'User updated', `${u.first} ${u.last}`, { targetId: id, targetType: 'user', before, after });
    return u;
  }),
  setStatus: (id, status, comment) => mockCall('users', () => {
    needs('users', 'manage');
    const u = DB.db.users.find(x => x.id === id); if (!u) throw new ServiceError('That user no longer exists.');
    if (id === actor()) throw new ServiceError('You can’t deactivate your own account.');
    const label = { active: 'Active', deactivated: 'Deactivated', invited: 'Invited' };
    audit(status === 'deactivated' ? 'User deactivated' : 'User reactivated', `${u.first} ${u.last}`, { targetId: id, targetType: 'user', comment, before: { status: label[u.status] }, after: { status: label[status] } });
    u.status = status;
    return u;
  }),
  resendInvite: id => mockCall('users', () => {
    needs('users', 'manage');
    const u = DB.db.users.find(x => x.id === id);
    audit('Invitation resent', `${u.first} ${u.last}`, { targetId: id, targetType: 'user' });
    return u;
  }),
  remove: id => mockCall('users', () => {
    needs('users', 'manage');
    if (id === actor()) throw new ServiceError('You can’t delete your own account.');
    const i = DB.db.users.findIndex(x => x.id === id); if (i < 0) throw new ServiceError('That user no longer exists.');
    const [u] = DB.db.users.splice(i, 1);
    audit('User deleted', `${u.first} ${u.last}`, { targetId: id, targetType: 'user', before: { email: u.email, role: ROLES[u.role].label } });
    return u;
  })
};

/* ---------- Notifications: draft → pending approval → scheduled or sent; cancel while scheduled ---------- */
const NOTE_STATUS = { draft: 'Draft', pending: 'Pending approval', scheduled: 'Scheduled', sent: 'Sent', cancelled: 'Cancelled' };
const NotificationService = {
  list: () => mockCall('notifications', () => DB.db.notifications),
  get: id => mockCall('notifications', () => { const n = DB.db.notifications.find(x => x.id === id); if (!n) throw new ServiceError('That notification no longer exists.'); return n; }),
  save: (id, data) => mockCall('notifications', () => {
    needs('notifications', 'draft');
    if (!id) {
      const n = { ...clone(data), id: uid('n'), status: 'draft', createdBy: actor(), createdAt: nowIso(), updatedAt: nowIso(), sentAt: null, stats: null };
      DB.db.notifications.unshift(n);
      audit('Notification created', n.title, { targetId: n.id, targetType: 'notification', after: data });
      return n;
    }
    const n = DB.db.notifications.find(x => x.id === id);
    if (!['draft', 'pending'].includes(n.status)) throw new ServiceError(`${NOTE_STATUS[n.status]} notifications can’t be edited. Duplicate it instead.`);
