/* ---------- Wayfinding: manual Gozio JSON. The schema checked here is a placeholder until UTSW shares a real export. ---------- */
const WAY_CATEGORIES = ['Clinic', 'Imaging', 'Lab', 'Pharmacy', 'Restroom', 'Elevator', 'Entrance', 'Parking', 'Food', 'Information', 'Other'];
function validateGozio(text) {
  const errors = [], warnings = [];
  let doc;
  try { doc = JSON.parse(text); }
  catch (e) {
    const m = /position (\d+)/.exec(e.message); let where = '';
    if (m) { const pos = +m[1], before = text.slice(0, pos); where = ` at line ${before.split('\n').length}, column ${pos - before.lastIndexOf('\n')}`; }
    return { ok: false, errors: [`The file isn’t valid JSON${where}. Export the file again from Gozio and upload the new copy.`], warnings, stats: null };
  }
  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) return { ok: false, errors: ['The file must contain one JSON object with venue and buildings.'], warnings, stats: null };
  if (!doc.schemaVersion) errors.push('Missing “schemaVersion”.');
  if (!doc.venue || !doc.venue.id || !doc.venue.name) errors.push('Missing “venue” with an id and a name.');
  if (!Array.isArray(doc.buildings) || !doc.buildings.length) errors.push('“buildings” must be a list with at least one building.');
  let floors = 0, dests = 0; const ids = new Set();
  (Array.isArray(doc.buildings) ? doc.buildings : []).forEach((b, bi) => {
    const bn = b && b.name ? `“${b.name}”` : `Building ${bi + 1}`;
    if (!b || !b.id || !b.name) errors.push(`${bn} needs an id and a name.`);
    if (!Array.isArray(b && b.floors) || !b.floors.length) { errors.push(`${bn} has no floors.`); return; }
    b.floors.forEach((f, fi) => {
      floors++;
      const fn = `${bn}, floor ${f && f.name ? `“${f.name}”` : fi + 1}`;
      if (typeof (f && f.level) !== 'number') errors.push(`${fn} needs a numeric “level”.`);
      if (!Array.isArray(f && f.destinations) || !f.destinations.length) { warnings.push(`${fn} has no destinations.`); return; }
      f.destinations.forEach((d, di) => {
        dests++;
        if (!d || !d.id) errors.push(`${fn}, destination ${di + 1} has no id.`);
        else if (ids.has(d.id)) errors.push(`Destination id “${d.id}” is used more than once.`);
        else ids.add(d.id);
        if (d && !d.name) warnings.push(`${fn}: destination “${d.id}” has no name, so patients can’t search for it.`);
        if (d && d.category && !WAY_CATEGORIES.includes(d.category)) errors.push(`${fn}: “${d.category}” isn’t a known category for “${d.id}”.`);
      });
    });
  });
  return { ok: !errors.length, errors: errors.slice(0, 50), moreErrors: Math.max(0, errors.length - 50), warnings, stats: { buildings: (doc.buildings || []).length, floors, destinations: dests, venue: doc.venue && doc.venue.name } };
}

/* ---------- Analytics: deterministic mock series (clearly labeled in the UI) ---------- */
function prng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
const ANALYTICS_END = '2026-10-30';
function series(key, days, base, spread, trend = 0, weekly = 0) {
  const r = prng(key), out = [], end = new Date(ANALYTICS_END + 'T12:00:00Z');
  for (let i = 179; i >= 0; i--) {
    const d = new Date(end.getTime() - i * 864e5), dow = d.getUTCDay();
    const v = base + trend * (179 - i) + (r() - .5) * spread + (dow === 0 || dow === 6 ? -weekly : weekly / 3);
    out.push({ x: d.toISOString().slice(0, 10), y: v });
  }
  return out.slice(-days);
}

/* Arrow keys move the selection, as radios do */
function wireSegmented(root, onChange) {
  const opts = $$('[role="radio"]', root);
  const pick = (b, focus) => {
    opts.forEach(o => { const on = o === b; o.setAttribute('aria-checked', on); o.tabIndex = on ? 0 : -1; });
    if (focus) b.focus(); onChange(b.dataset.value);
  };
  opts.forEach((b, i) => {
    b.addEventListener('click', () => pick(b));
    b.addEventListener('keydown', e => {
      const d = ['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : ['ArrowLeft', 'ArrowUp'].includes(e.key) ? -1 : 0;
      if (d) { e.preventDefault(); pick(opts[(i + d + opts.length) % opts.length], true); }
    });
  });
}

    </div>
    <div class="tbl-wrap" tabindex="0" role="region" aria-labelledby="${id}-cap">
      <table class="tbl"><caption id="${id}-cap" class="vh">${esc(cfg.caption)}</caption><thead></thead><tbody></tbody></table>
    </div>

  const thead = $('thead', host), tbody = $('tbody', host), empty = $('.tbl-empty', host), wrap = $('.tbl-wrap', host);
  const visible = () => {
    const q = st.q.trim().toLowerCase();
    let rows = st.rows.filter(r => (!q || cfg.searchText(r).toLowerCase().includes(q)) &&
      (cfg.filters || []).every(f => !st.filters[f.key] || f.match(r, st.filters[f.key])));
    if (st.sort) {

      rows = [...rows].sort((a, b) => (v(a) > v(b) ? 1 : v(a) < v(b) ? -1 : 0) * (st.sort.dir === 'asc' ? 1 : -1));
    }

  };

      const inner = c.sortable ? `<button type="button" class="th-sort" data-sort="${c.key}">${esc(c.label)}${ic(sorted ? (st.sort.dir === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more', 16)}</button>` : (c.hideLabel ? `<span class="vh">${esc(c.label)}</span>` : esc(c.label));

    const pager = $('.pager', host);

}

/* ---------- Modal and confirm dialog (native <dialog>: inert background, Escape closes) ---------- */
function openModal({ title, body, actions, onOpen, wide = false }) {
  const from = document.activeElement;
  const d = document.createElement('dialog');
  d.className = `modal${wide ? ' wide' : ''}`;
  d.setAttribute('aria-labelledby', 'modal-h');
  d.innerHTML = `<form method="dialog" class="modal-form" novalidate>
    <div class="modal-head"><h2 id="modal-h" tabindex="-1">${esc(title)}</h2>${btn({ label: 'Close', icon: 'close', variant: 'text', iconOnly: true, attrs: 'data-close' })}</div>
    <div class="modal-body">${body}</div>
    <div class="modal-actions">${actions}</div>
  </form>`;
  document.body.appendChild(d);
  const close = () => { if (d.open) d.close(); };
  d.addEventListener('close', () => { d.remove(); if (from && from.isConnected) from.focus(); });
  d.addEventListener('click', e => { if (e.target.closest('[data-close]')) { e.preventDefault(); close(); } });
  d.showModal();
  (d.querySelector('[autofocus]') || d.querySelector('#modal-h')).focus();
  if (onOpen) onOpen(d, close);
  return { el: d, close };
}
/* Resolves { ok, comment }. A required comment is validated before confirming. */
function confirmDialog({ title, body, confirmLabel, variant = 'primary', comment = null, cancelLabel = 'Cancel', wide = false }) {
  return new Promise(resolve => {
    let done = false;
    const commentField = comment ? field({ id: 'cf-comment', label: comment.label, hint: comment.hint || '', required: !!comment.required, textarea: true, rows: 3, value: comment.value || '' }) : '';
    const m = openModal({
      title, wide,
      body: `${body}${commentField}`,
      actions: `${btn({ label: cancelLabel, variant: 'text', attrs: 'data-close' })}${btn({ label: confirmLabel, variant, type: 'submit', attrs: 'data-confirm' })}`,
      onOpen(d, close) {
        d.querySelector('form').addEventListener('submit', e => {
          e.preventDefault();
          const ta = d.querySelector('#cf-comment');
          if (comment && comment.required && !ta.value.trim()) { setFieldError(ta, `Enter ${comment.label.toLowerCase()} so others know why.`); ta.focus(); return; }
          done = true; resolve({ ok: true, comment: ta ? ta.value.trim() : '' }); close();
        });
        d.addEventListener('close', () => { if (!done) resolve({ ok: false }); });
      }
    });
    return m;
  });
}

/* ---------- Toast: polite live region, optional action (Undo), 5 seconds ---------- */
function toast(msg, { kind = 'info', action, onAction, ms = 5000 } = {}) {
  const host = $('#toasts');
  const t = document.createElement('div');
  t.className = `toast toast-${kind}`;
  t.innerHTML = `${ic(kind === 'error' ? 'error' : kind === 'success' ? 'check_circle' : 'info', 20, 'f1')}<span class="toast-msg">${esc(msg)}</span>${action ? `<button type="button" class="toast-act">${esc(action)}</button>` : ''}<button type="button" class="toast-x" aria-label="Dismiss notification">${ic('close', 20)}</button>`;
  host.appendChild(t);
  let timer;
  const kill = () => { clearTimeout(timer); t.classList.add('out'); setTimeout(() => t.remove(), 200); };
  const arm = () => { clearTimeout(timer); timer = setTimeout(kill, ms); };
  t.addEventListener('mouseenter', () => clearTimeout(timer)); t.addEventListener('mouseleave', arm);
  t.addEventListener('focusin', () => clearTimeout(timer)); t.addEventListener('focusout', arm);
  t.querySelector('.toast-x').onclick = kill;
  if (action) t.querySelector('.toast-act').onclick = () => { kill(); onAction && onAction(); };
  arm();
}

/* Wires a form host: input/change/switch clicks update data and call onChange; error summary links focus fields */

function lineChart(host, { points, unit, label, height = 220, zeroBase = false }) {

    <div class="chart-tip" hidden></div>

      <tbody>${points.map(p => `<tr><th scope="row">${fmtDay(p.x)}</th><td class="num">${fmtNum(p.y, unit)}</td></tr>`).join('')}</tbody></table></div></details>`;

    const ys = points.map(p => p.y);

  plot.addEventListener('pointermove', e => { const r = plot.getBoundingClientRect(), x = e.clientX - r.left; show(Math.round((x - geom.m.l) / (geom.W - geom.m.l - geom.m.r) * (points.length - 1))); });
  plot.addEventListener('pointerleave', hide);
  plot.addEventListener('blur', hide);

/* ===== src/ui/lifecycle.js ===== */

function Lifecycle(opts) {

  const lastEvent = (r, env, version) => [...r.events].reverse().find(e => e.environment === env && (version == null || e.version === version));

    const r = opts.getRec(), d = opts.isDirty(), isNew = opts.isNew && opts.isNew();
    const host = opts.host();

    const stateOf = i => i < stage ? 'done' : i === stage ? (stage === 2 ? 'done' : 'current') : 'todo';
    const steps = [
      { title: 'Draft', state: stateOf(0), detail: isNew ? `${badge('unsaved', 'New – not saved')}` : d ? `${badge('unsaved')} Not saved yet` : r.draft
        ? `${r.draft.changesRequested ? badge('changes') : r.review ? badge('review') : badge('draft', 'Saved')} ${when(lastEvent(r, 'draft'))}` : 'No open draft' },
      { title: 'Demo', state: stateOf(1), detail: r && r.demo ? `${badge('demo', `v${r.demo}`)} ${when(lastEvent(r, 'demo', r.demo))}` : 'Nothing on demo' },
      { title: 'Production', state: stateOf(2), detail: r && r.production ? `${badge('production', `v${r.production}`)} ${when(lastEvent(r, 'production', r.production))}` : 'Not published' }

      if (!ok) reason[key] = why;
    };

    const v = k => (k === next ? 'primary' : 'secondary');
    if (!isNew && d) acts.push(btn({ label: 'Discard changes', variant: 'text', attrs: 'data-lc="discard"' }));
    else if (hasDraft && may('saveDraft')) acts.push(btn({ label: 'Discard draft', variant: 'text', attrs: 'data-lc="discardDraft"' }));
    if (r && !r.production && !r.demo && may('saveDraft')) acts.push(btn({ label: 'Delete', icon: 'delete', variant: 'text', attrs: 'data-lc="delete"' }));
    if (may('saveDraft')) add('save', isNew ? 'Save as draft' : 'Save draft', v('save'), d || isNew, 'There are no unsaved changes to save.', 'save');
    if (!isNew && may('requestReview') && !may('deployDemo')) add('review', r.review ? 'Review requested' : 'Request review', v('review'), !!hasDraft && !d && !r.review,
      d ? 'Save the draft before you request a review.' : r.review ? 'A review is already requested for this draft.' : 'Save a draft first, then request a review.', 'rate_review');
    if (!isNew && may('deployDemo')) add('deploy', 'Deploy to demo', v('deploy'), !!hasDraft && !d, d ? 'Save the draft first. Demo only takes saved drafts.' : 'Save a draft first. Demo only takes saved drafts.', 'science');

      : !may('deployDemo') ? `As ${ROLES[role()].label}, you can save drafts and request a review. An Admin or Super Admin deploys to demo and publishes.`
      : !may('publish') ? `As ${ROLES[role()].label}, you can deploy to demo. An Admin or Super Admin publishes to production.` : '';

      ${acts.length ? `<div class="lc-actions">${acts.join('')}</div>` : ''}
      ${Object.entries(reason).map(([k, t]) => `<span class="vh" id="why-${k}">${esc(t)}</span>`).join('')}

      catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
    };
    const needComment = DB.db.settings.requirePublishComment;
    if (key === 'save') {
      if (opts.validate && !opts.validate()) { toast('Fix the highlighted fields, then save again.', { kind: 'error' }); return; }
      if (opts.isNew && opts.isNew()) return run(() => opts.create(opts.getWorking()), 'Saving draft', `Draft saved. The ${opts.noun} isn’t on demo or production yet.`, 'created');
      return run(() => ConfigService.saveDraft(r.id, opts.getWorking(), ''), 'Saving draft', 'Draft saved. It isn’t on demo or production yet.', 'save');
    }
    if (key === 'discard') {
      const base = r.draft ? r.draft.data : dataAt(r, 'production') || dataAt(r, 'demo');
      const c = await confirmDialog({ title: 'Discard unsaved changes?', body: `<p>The editor goes back to ${r.draft ? 'your saved draft' : `production v${r.production}`}. These changes are lost:</p>${changeList(opts.describe(base, opts.getWorking()))}`, confirmLabel: 'Discard changes', variant: 'danger', cancelLabel: 'Keep editing' });
      if (c.ok) { opts.onDiscard(); announce('Changes discarded'); }
      return;
    }
    if (key === 'discardDraft') {
      const c = await confirmDialog({ title: 'Discard the saved draft?', body: `<p>The draft is deleted${r.production ? ` and the editor goes back to production v${r.production}` : ''}. Demo and production don’t change.</p>`, confirmLabel: 'Discard draft', variant: 'danger' });
      if (c.ok) run(() => ConfigService.discardDraft(r.id), 'Discarding draft', 'Draft discarded.', 'discardDraft');
      return;
    }
    if (key === 'delete') {
      const c = await confirmDialog({ title: `Delete this ${opts.noun}?`, body: `<p>“${esc(r.name)}” has never been published, so it’s deleted for good. The audit log keeps a record.</p>`, confirmLabel: `Delete ${opts.noun}`, variant: 'danger' });
      if (!c.ok) return;
      setBusy(b, true, 'Deleting');
      try { await ConfigService.remove(r.id); toast(`Deleted “${r.name}”.`, { kind: 'success' }); opts.afterDelete(); }
      catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
      return;
    }
    if (key === 'review') {
      const c = await confirmDialog({ title: 'Request a review?', body: '<p>An Admin or Super Admin checks the draft and deploys it to demo. The request shows on their Dashboard.</p>', confirmLabel: 'Request review', comment: { label: 'Note for the reviewer', hint: 'Optional' } });
      if (c.ok) run(() => ConfigService.requestReview(r.id, c.comment), 'Requesting review', 'Review requested.', 'review');
      return;
    }
    if (key === 'deploy') {
      const c = await confirmDialog({ title: `Deploy to demo as v${r.nextVersion}?`, wide: true, body: `<p>The saved draft becomes version ${r.nextVersion} in the demo environment, for checking on demo devices. ${r.production ? `Production stays on v${r.production}, so patients see no change.` : 'Nothing is in production yet.'}</p><h3 class="sub-h">Changes from ${r.demo ? `demo v${r.demo}` : 'empty'}</h3>${changeList(opts.describe(dataAt(r, 'demo'), r.draft.data))}`, confirmLabel: 'Deploy to demo', comment: { label: 'Comment', hint: 'Optional. Shown in the change history.', value: r.draft.comment || '' } });
      if (c.ok) run(() => ConfigService.deployToDemo(r.id, c.comment), 'Deploying to demo', `Deployed to demo as v${r.nextVersion}. Production is unchanged.`, 'deploy');
      return;
    }
    if (key === 'changes') {
      const c = await confirmDialog({ title: `Request changes to demo v${r.demo}?`, body: '<p>The demo version goes back to a draft with your comment, so it can be fixed and deployed again. Production doesn’t change.</p>', confirmLabel: 'Request changes', comment: { label: 'What needs to change', required: true } });
      if (c.ok) run(() => ConfigService.requestChanges(r.id, c.comment), 'Requesting changes', 'Changes requested. The demo version is back in draft.', 'changes');
      return;
    }
    if (key === 'publish') {
      const c = await confirmDialog({ title: `Publish v${r.demo} to production?`, wide: true, body: `<div class="warn-box">${ic('public', 20)}<p>Production is what patients see in the MyCare app. In this prototype, publishing is simulated.</p></div>
        <h3 class="sub-h">Changes from ${r.production ? `production v${r.production}` : 'nothing published'}</h3>${changeList(opts.describe(dataAt(r, 'production'), r.versions[r.demo].data))}
        ${r.draft || opts.isDirty() ? '<p class="muted">Your open draft isn’t included. Only the version checked on demo is published.</p>' : ''}`,
        confirmLabel: `Publish v${r.demo}`, comment: { label: 'Comment', required: needComment, hint: needComment ? 'Required by Administrative settings.' : 'Optional. Shown in the change history.' } });
      if (c.ok) run(() => ConfigService.publish(r.id, c.comment), 'Publishing', `Published v${r.demo} to production.`, 'publish');
    }
  }
  return { render };
}

/* Change history table with rollback where the type supports it */
function historyCard(id = 'hist') {
  return `<section class="card" aria-labelledby="${id}-h"><div class="card-head"><h2 id="${id}-h" tabindex="-1">Change history</h2><div class="card-actions" id="${id}-rb"></div></div><div class="card-body" id="${id}"></div></section>`;
}
function mountHistory({ hostId = 'hist', getRec, describe, onSaved }) {
  const r0 = getRec(), type = CONFIG_TYPES[r0.type];
  $(`#${hostId}-rb`).innerHTML = type.supportsRollback ? badge('pending', 'Rollback supported – assumed, pending confirmation') : badge('fixed', `No rollback for ${type.label.toLowerCase()}s`);
  const canRb = () => type.supportsRollback && canAct(Session.role(), type.area, 'rollback');
  const rollback = async (version, b) => {
    const r = getRec();
    const c = await confirmDialog({ title: `Roll back to v${version}?`, wide: true, body: `<p>This creates version ${r.nextVersion} with the contents of v${version} and puts it on demo and production. Production v${r.production} stays in the history.</p>
      <h3 class="sub-h">Changes from production v${r.production}</h3>${changeList(describe(dataAt(r, 'production'), r.versions[version].data))}`,
      confirmLabel: `Roll back to v${version}`, variant: 'danger', comment: { label: 'Reason for the rollback', required: true } });
    if (!c.ok) return;
    setBusy(b, true, 'Rolling back');
    try { const rec = await ConfigService.rollback(r.id, version, c.comment); onSaved(rec, 'rollback'); toast(`Rolled back. Production is now v${rec.production}, a copy of v${version}.`, { kind: 'success' }); $(`#${hostId}-h`).focus(); }
    catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
  };
  return dataTable($(`#${hostId}`), {
    id: hostId, caption: 'Change history', noun: 'change', searchPlaceholder: 'Search events, people and comments',
    rows: r0.events, defaultSort: { key: 'at', dir: 'desc' }, pageSize: 10,
    searchText: e => `${e.action} ${UserService.name(e.by)} ${e.comment} v${e.version || ''}`,
    filters: [
      { key: 'env', label: 'Environment', options: [['draft', 'Draft'], ['demo', 'Demo'], ['production', 'Production']], match: (e, v) => e.environment === v },
      { key: 'by', label: 'Changed by', options: DB.db.users.map(u => [u.id, `${u.first} ${u.last}`]), match: (e, v) => e.by === v }
    ],
    empty: { icon: 'history', title: 'No changes yet', text: 'Saved drafts, deployments and publications appear here.' },
    columns: [
      { key: 'at', label: 'When', sortable: true, render: e => `<span class="nowrap">${esc(fmtDateTime(e.at))}</span>` },
      { key: 'action', label: 'Event', sortable: true, render: e => esc(e.action) },
      { key: 'environment', label: 'Environment', render: e => badge(e.environment) },
      { key: 'version', label: 'Version', sortable: true, sortValue: e => e.version || 0, render: e => e.version ? `v${e.version}` : '<span class="muted">–</span>', cls: 'num' },
      { key: 'by', label: 'By', render: e => esc(UserService.name(e.by)) },
      { key: 'comment', label: 'Comment', render: e => e.comment ? esc(e.comment) : '<span class="muted">None</span>', cls: 'wrap' },
      { key: 'acts', label: 'Actions', hideLabel: true, render: e => { const r = getRec(); return canRb() && e.environment === 'production' && e.version && e.version !== r.production && r.versions[e.version]
        ? btn({ label: `Roll back to v${e.version}`, icon: 'history', variant: 'text', attrs: `data-rollback="${e.version}"` }) : ''; } }
    ],
    onRender(tbody) { tbody.onclick = ev => { const b = ev.target.closest('[data-rollback]'); if (b) rollback(+b.dataset.rollback, b); }; }
  });
}

/* Environment status badges for list rows */
function envBadges(r) {
  const out = [];
  if (r.production) out.push(badge('production', `Production v${r.production}`));
  if (r.demo && r.demo !== r.production) out.push(badge('demo', `Demo v${r.demo}`));
  if (r.draft) out.push(r.review ? badge('review') : r.draft.changesRequested ? badge('changes') : badge('draft'));
  return `<span class="badges">${out.join('')}</span>`;
}
const envRank = r => r.draft ? 'draft' : r.demo !== r.production ? 'demo' : 'production';

function visibleNav(role) {
  return NAV.map(sec => ({ ...sec, items: sec.items.filter(i => can(role, i.area, 'view')) })).filter(sec => sec.items.length);
}
const initials = u => `${u.first[0]}${u.last[0]}`;

/* ---------- Theme: Light, Dark or System (follows the device). Saved on this device. ---------- */
const THEMES = [['light', 'Light', 'light_mode'], ['dark', 'Dark', 'dark_mode'], ['system', 'System', 'contrast']];
function applyTheme() {
  const t = DB.prefs.theme || 'system';
  if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
}
const themeControl = id => `<div class="theme-sw" role="radiogroup" aria-label="Appearance" id="${id}">${THEMES.map(([k, l, g]) => {
  const on = (DB.prefs.theme || 'system') === k;
  return `<button type="button" role="radio" aria-checked="${on}" tabindex="${on ? 0 : -1}" data-value="${k}" aria-label="${l} appearance" title="${l}">${ic(g, 20)}</button>`; }).join('')}</div>`;
function wireThemeControl(el) {
  if (!el) return;
  wireSegmented(el, v => { DB.prefs.theme = v; saveDb(); applyTheme(); announce(`${v === 'system' ? 'System' : v === 'dark' ? 'Dark' : 'Light'} appearance`); });
}

function renderShell() {
  const app = $('#app');
  app.className = 'app';
  app.innerHTML = `
    <a class="skip" href="#main" data-skip>Skip to main content</a>

      <button type="button" class="nav-toggle btn btn-text btn-icon" aria-controls="sidebar" aria-expanded="false" aria-label="Show navigation">${ic('menu')}</button>
      <a class="brand" href="#dashboard" aria-label="UTSW MyCare Admin, go to the dashboard"><img src="${LOGO_REVERSED}" alt="" width="200"><span class="brand-admin" aria-hidden="true">Admin</span></a>
      <div class="env-pill" title="This Admin runs as a prototype">${ic('dns', 20)}<span><span class="env-k">Environment</span> <b>Prototype</b></span></div>
      <p class="mock-flag">${ic('database', 20)}<span><span class="mf-long">Prototype – mock data, not connected to MyCare</span><span class="mf-short" aria-hidden="true">Mock data</span></span></p>
      ${themeControl('hdr-theme')}
      <div class="user" id="user"></div>
    </header>

/* ===== src/app/router.js ===== */
/* ---------- Hash router with session and role guards ----------
   Public routes: login, mfa, signed-out, expired. Everything else needs the simulated session,
   and a role that can view the page's area; otherwise the access-denied view shows in place. */
const DEFAULT_ROUTE = 'dashboard';
const PUBLIC_PAGES = {};  /* filled by pages/auth.js */
const BUILT_PAGES = {};   /* filled by built pages, keyed by route */

function matchRoute(name) {
  const exact = ROUTES.find(r => r.pattern === name);
  if (exact) return { route: exact, params: {} };
  for (const r of ROUTES) {
    if (!r.pattern.endsWith('-:id')) continue;
    const pre = r.pattern.slice(0, -3);
    if (name.startsWith(pre) && name.length > pre.length && !ROUTES.some(x => x.pattern === name)) return { route: r, params: { id: name.slice(pre.length) } };
  }
  return null;
}

const Router = {
  current: null, active: null, loaded: false, guardFn: null, returnTo: null, skipNext: false,
  setGuard(fn) { this.guardFn = fn; },
  clearGuard() { this.guardFn = null; },
  async canLeave() { return this.guardFn ? await this.guardFn() : true; },
  go(name, { force = false } = {}) {
    if (force) this.clearGuard();
    if (location.hash.slice(1) === name) this.resolve(); else location.hash = name;
  },
  refresh() { this.resolve(true); },
  async onHash() {
    if (this.skipNext) { this.skipNext = false; return; }
    const next = location.hash.slice(1);
    if (this.guardFn && next !== this.current) {
      const ok = await this.guardFn();
      if (!ok) { history.replaceState(null, '', `#${this.current}`); return; }
      this.clearGuard();
    }
    this.resolve();
  },
  resolve(isRefresh = false) {
    const name = location.hash.slice(1) || DEFAULT_ROUTE;
    if (this.active && this.active.leave) this.active.leave();
    this.active = null;
    this.current = name;
    if (PUBLIC_PAGES[name]) { document.body.classList.remove('signed-in'); PUBLIC_PAGES[name](); this.loaded = true; return; }
    if (!Session.current()) { this.returnTo = name; history.replaceState(null, '', '#login'); this.current = 'login'; PUBLIC_PAGES.login(); this.loaded = true; return; }
    if (Session.expired()) { Session.end(); history.replaceState(null, '', '#expired'); this.current = 'expired'; return PUBLIC_PAGES.expired(); }
    Session.touch(); saveDb();
    if (!document.body.classList.contains('signed-in') || !$('#main')) { document.body.classList.add('signed-in'); renderShell(); }
    const main = $('#main');
    const role = Session.role();
    const m = name === 'denied' ? null : matchRoute(name);
    let title;
    if (name === 'denied') { title = 'Access denied'; renderSidebar(null); main.innerHTML = deniedView(null); }
    else if (!m) { title = 'Page not found'; renderSidebar(null); main.innerHTML = notFoundView(name); }
    else if (!can(role, m.route.item.area, 'view')) { title = 'Access denied'; renderSidebar(m.route); main.innerHTML = deniedView(m.route); }
    else {
      renderSidebar(m.route);
      title = m.route.title;
      const page = BUILT_PAGES[m.route.pattern];
      if (page) { this.active = page; page.render(main, { route: m.route, params: m.params, role }); }
      else { title = 'Page not found'; main.innerHTML = notFoundView(name); }
    }
    document.title = `${title} – MyCare Admin (prototype)`;
    /* Move focus to the new heading on navigation, but not on first load, so Tab starts at the skip link */
    if (!isRefresh && this.loaded) { const h = $('#page-h'); (h || main).focus({ preventScroll: true }); window.scrollTo(0, 0); }
    this.loaded = true;
    announce(`${title} page`);
  }
};
window.addEventListener('hashchange', () => Router.onHash());

/* ---------- Home screen management → Layout ----------
   Order and visibility of the home modules for guests and signed-in patients, a module library, a live preview
   built from the designs/guest modules, and the shared Draft → Demo → Production lifecycle. */
/* EXTRA_GLYPHS: save rate_review science public */
const AUDIENCES = [['guest', 'Guest'], ['authenticated', 'Authenticated']];
const modLabel = id => (HOME_MODULES[id] || {}).label || id;
function describeLayout(from, to) {
  if (!from) return ['New layout'];
  const out = [], pos = list => Object.fromEntries(list.map((m, i) => [m.id, i + 1]));
  const pf = pos(from.modules), pt = pos(to.modules);
  to.modules.forEach(m => {
    const was = from.modules.find(x => x.id === m.id);
    if (!was) { out.push(`${modLabel(m.id)} is added at position ${pt[m.id]}${m.on ? '' : ', hidden'}`); return; }
    if (pf[m.id] !== pt[m.id]) out.push(`${modLabel(m.id)} moves from position ${pf[m.id]} to ${pt[m.id]}`);
    if (was.on !== m.on) out.push(`${modLabel(m.id)} is ${m.on ? 'shown' : 'hidden'}`);
  });
  from.modules.forEach(m => { if (!pt[m.id]) out.push(`${modLabel(m.id)} is removed`); });
  return out;
}

BUILT_PAGES['home-layout'] = (() => {
  let st = { aud: 'guest', showAlert: true }, main, pv;
  const may = a => canAct(Session.role(), 'homeLayout', a);
  const base = () => latestData(st.rec);
  const dirty = () => !!st.rec && !same(st.working, base());

  function render(host) {
    main = host;
    main.innerHTML = `<div class="page hl">
      ${pageHead({ crumbs: [['Home screen management', null]], title: 'Home screen layout',
        lede: 'Choose which modules patients see on the MyCare home screen and in what order, for guests and for signed-in patients.' })}
      <div class="tabs" role="tablist" aria-label="Audience">${AUDIENCES.map(([k, l]) =>
        `<button type="button" role="tab" id="aud-${k}" aria-controls="aud-panel" aria-selected="${k === st.aud}" tabindex="${k === st.aud ? 0 : -1}" data-aud="${k}">${esc(l)}</button>`).join('')}</div>
      <div id="aud-panel" role="tabpanel" aria-labelledby="aud-${st.aud}"></div>
    </div>`;
    const tabs = $$('[role="tab"]', main);
    const pick = async (t, focus) => {
      if (t.dataset.aud === st.aud) return;
      if (dirty()) {
        const r = await confirmDialog({ title: 'Discard unsaved changes?', body: `<p>You have unsaved changes to the ${st.aud} layout. Switching audiences discards them.</p>`, confirmLabel: 'Discard and switch', variant: 'danger', cancelLabel: 'Keep editing' });
        if (!r.ok) return;
      }
      tabs.forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; });
      if (focus) t.focus();
      st.aud = t.dataset.aud;
      $('#aud-panel').setAttribute('aria-labelledby', t.id);
      load();
    };
    tabs.forEach((t, i) => {
      t.onclick = () => pick(t);
      t.onkeydown = e => { const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (d) { e.preventDefault(); pick(tabs[(i + d + tabs.length) % tabs.length], true); } };
    });
    load();
  }

  async function load() {
    const panel = $('#aud-panel');
    panel.innerHTML = loadingState('Loading the layout');
    if (pv) { pv.destroy(); pv = null; }
    try { st.rec = await ConfigService.get(`home-layout-${st.aud}`); }
    catch (err) { panel.innerHTML = errorState(err.message); $('[data-retry]', panel).onclick = load; return; }
    st.working = clone(base());
    panel.innerHTML = `
      ${st.aud === 'authenticated' ? `<p class="note-line">${ic('info', 20)}<span>The signed-in home has no approved design yet (§10.5). These modules come from the personalised homepage prototype; “Your next visits” is read only from MyChart – Epic stays the source.</span></p>` : ''}
      <section class="card lc" aria-labelledby="lc-h"><div class="card-head"><h2 id="lc-h" tabindex="-1">Publishing</h2><div id="lc-badges" class="card-actions"></div></div><div class="card-body" id="lc"></div></section>
      <div class="hl-grid">
        <div class="hl-edit" id="editor"></div>
        <aside class="hl-preview" id="hl-pv"></aside>
      </div>
      ${historyCard()}`;
    const lc = Lifecycle({
      host: () => $('#lc'), area: 'homeLayout', noun: 'layout', getRec: () => st.rec, getWorking: () => clone(st.working), isDirty: dirty, describe: describeLayout,
      onSaved: rec => { st.rec = rec; st.working = clone(base()); update(); hist.update(rec.events); $('#lc-h').focus(); },
      onDiscard: () => { st.working = clone(base()); update(); $('#lc-h').focus(); }, afterDelete: () => {}
    });
    st.lc = lc;
    const hist = mountHistory({ getRec: () => st.rec, describe: describeLayout, onSaved: rec => { st.rec = rec; st.working = clone(base()); update(); hist.update(rec.events); } });
    pv = mountPreviewCard($('#hl-pv'), {
      title: `Mobile preview of the ${st.aud} home screen`,
      sources: () => recSources(st.rec, dirty(), false),
      extras: checkbox({ id: 'pv-alert', label: 'Show emergency alerts', checked: st.showAlert }),
      onExtras: (h, send) => { $('#pv-alert', h).onchange = e => { st.showAlert = e.target.checked; send(); }; },
      payload: src => {
        const data = src === 'working' ? st.working : dataAt(st.rec, src);
        const content = appContent({ audience: st.aud, allAlerts: true });
        if (!st.showAlert) content.alerts = [];
        return { screen: 'home', audience: st.aud, layout: clone(data), content, colors: colorsFor('production'),
          label: src === 'working' ? (dirty() ? 'unsaved edits, not live' : st.rec.draft ? 'saved draft, not live' : `production version ${st.rec.production}`) : `${src} version ${src === 'demo' ? st.rec.demo : st.rec.production}` };
      }
    });
    Router.setGuard(async () => {
      if (!dirty()) return true;
      const r = await confirmDialog({ title: 'Leave without saving?', body: '<p>Your changes to the layout aren’t saved. If you leave, they’re lost.</p>', confirmLabel: 'Leave page', variant: 'danger', cancelLabel: 'Stay on this page' });
      return r.ok;
    });
    update();
  }

  function update(focus) {
    $('#lc-badges').innerHTML = `${badge('mock')}${dirty() ? badge('unsaved') : ''}`;
    st.lc.render(); renderEditor(focus); pv.update();
  }

  function renderEditor(focus) {
    const ro = !may('saveDraft');
    const lib = AUDIENCE_MODULES[st.aud].filter(id => !st.working.modules.some(m => m.id === id));
    const n = st.working.modules.length;
    const row = (m, i) => {
      const meta = HOME_MODULES[m.id];
      return `<li class="mod-row${m.on ? '' : ' is-off'}" data-id="${m.id}">
        <span class="mod-pos" aria-hidden="true">${i + 1}</span>
        <span class="mod-ic">${ic(meta.icon, 20)}</span>
        <span class="mod-txt"><span class="mod-t" id="mt-${m.id}">${esc(meta.label)}<span class="vh">, position ${i + 1} of ${n}</span></span><span class="mod-d">${esc(meta.desc)}${meta.link ? ` <a class="text-link" href="#${meta.link}">Manage</a>` : ''}</span></span>
        ${badge(m.on ? 'visible' : 'hidden')}
        ${ro ? '' : `<span class="mod-ctl">
          ${switchBtn({ id: `vis-${m.id}`, checked: m.on, label: `Show ${meta.label} on the home screen`, attrs: 'data-act="vis"' })}
          <button type="button" class="btn btn-text btn-icon" data-act="up" aria-label="Move ${esc(meta.label)} up" ${i === 0 ? 'disabled' : ''}>${ic('arrow_upward', 20)}</button>
          <button type="button" class="btn btn-text btn-icon" data-act="down" aria-label="Move ${esc(meta.label)} down" ${i === n - 1 ? 'disabled' : ''}>${ic('arrow_downward', 20)}</button>
          <button type="button" class="btn btn-text btn-icon" data-act="remove" aria-label="Remove ${esc(meta.label)} from the layout">${ic('remove_circle', 20)}</button>
        </span>`}
      </li>`;
    };
    $('#editor').innerHTML = card({ title: `${st.aud === 'guest' ? 'Guest' : 'Authenticated'} home modules`, titleId: 'ed-h', actions: ro ? badge('fixed', 'View only') : '', body: `
      <h3 class="sub-h">Fixed at the top</h3>
      <ul class="fixed-list">${HOME_FIXED.map(f => `<li>${ic(f.icon, 20)}<span class="mod-txt"><span class="mod-t">${esc(f.label)}</span><span class="mod-d">${esc(f.desc)}</span></span>${badge('fixed')}</li>`).join('')}</ul>
      <h3 class="sub-h" id="ord-h" tabindex="-1">Modules, in order</h3>
      <p class="hint-line">Use the arrows to reorder. Hidden modules keep their place but patients don’t see them.</p>
      ${n ? `<ol class="mod-list" aria-labelledby="ord-h">${st.working.modules.map(row).join('')}</ol>`
        : emptyState({ icon: 'view_agenda', title: 'No modules on this layout', text: 'Add modules from the library below.', level: 4 })}
      <h3 class="sub-h" id="lib-h">Module library</h3>
      ${lib.length ? `<ul class="lib-list" aria-labelledby="lib-h">${lib.map(id => `<li class="lib-row" data-id="${id}">
          <span class="mod-ic">${ic(HOME_MODULES[id].icon, 20)}</span><span class="mod-txt"><span class="mod-t">${esc(HOME_MODULES[id].label)}</span><span class="mod-d">${esc(HOME_MODULES[id].desc)}</span></span>
          ${ro ? '' : btn({ label: 'Add to layout', icon: 'add', variant: 'tonal', attrs: `data-act="add" aria-label="Add ${esc(HOME_MODULES[id].label)} to the layout"` })}</li>`).join('')}</ul>`
        : `<p class="lib-empty">${ic('check_circle', 20)}<span>Every ${st.aud} module is on the layout. Remove one to move it here.</span></p>`}` });
    $('#editor').onclick = editorClick;
    if (focus) {
      const sel = focus.id ? `[data-id="${focus.id}"] [data-act="${focus.act}"]` : focus.sel;
      let el = sel && $(sel, main);
      if (el && el.disabled) el = $(`[data-id="${focus.id}"] [data-act="${focus.act === 'up' ? 'down' : 'up'}"]`, main);
      (el && !el.disabled ? el : $('#ord-h')).focus();
    }
  }

  function editorClick(e) {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const rowEl = b.closest('[data-id]'), id = rowEl && rowEl.dataset.id, list = st.working.modules, i = list.findIndex(m => m.id === id);
    const label = modLabel(id);
    if (b.dataset.act === 'vis') { list[i].on = !list[i].on; announce(`${label} ${list[i].on ? 'shown' : 'hidden'}`); update({ id, act: 'vis' }); }
    if (b.dataset.act === 'up' || b.dataset.act === 'down') {
      const j = i + (b.dataset.act === 'up' ? -1 : 1);
      [list[i], list[j]] = [list[j], list[i]];
      announce(`${label} moved to position ${j + 1} of ${list.length}`);
      update({ id, act: b.dataset.act });
    }
    if (b.dataset.act === 'remove') {
      const [gone] = list.splice(i, 1);
      announce(`${label} removed from the layout. It is in the module library.`);
      update({ sel: `[data-id="${id}"] [data-act="add"]` });
      toast(`${label} removed from the layout.`, { action: 'Undo', onAction: () => {
        if (st.working.modules.some(m => m.id === gone.id)) return;
        st.working.modules.splice(i, 0, gone); announce(`${label} restored to position ${i + 1}`); update({ id, act: 'remove' });
      } });
    }
    if (b.dataset.act === 'add') { list.push({ id, on: true }); announce(`${label} added at position ${list.length}`); update({ id, act: 'up' }); }
  }

  return { render, leave() { if (pv) { pv.destroy(); pv = null; } } };
})();

/* ===== src/pages/collection.js ===== */
/* ---------- Collections: a list page plus an editor (new and :id) for each item type ----------
   Used by Campaigns, Emergency alerts, Quick links, Featured cards and Audience segments. Each item is a
   config record with its own Draft → Demo → Production lifecycle and history. */
const fields = sections => sections.flatMap(s => s.fields);
function lastChange(r) { const e = r.events[r.events.length - 1]; return e ? e.at : ''; }

function defineCollection(cfg) {
  const allFields = () => fields(cfg.sections);
  /* ---- List ---- */
  BUILT_PAGES[cfg.route] = {
    async render(main) {
      const role = Session.role(), canEdit = can(role, cfg.area, 'draft');
      main.innerHTML = `<div class="page ${cfg.cls || ''}">${pageHead({ crumbs: [[cfg.section, null]], title: cfg.title, lede: cfg.lede,
        actions: canEdit ? `<a class="btn btn-primary" href="#${cfg.route}-new">${ic('add', 20)}<span class="lbl">${esc(cfg.newLabel)}</span></a>` : '' })}
        <div id="col-body">${loadingState(`Loading ${cfg.title.toLowerCase()}`)}</div></div>`;
      let list;
      try { list = await ConfigService.list(cfg.type); }
      catch (err) { $('#col-body').innerHTML = errorState(err.message); $('[data-retry]').onclick = () => this.render(main); return; }
      const counts = { live: list.filter(r => r.production && latestOn(r)).length, demo: list.filter(r => r.demo && r.demo !== r.production).length, draft: list.filter(r => r.draft).length, review: list.filter(r => r.review).length };
      $('#col-body').innerHTML = `${cfg.summary ? cfg.summary(list) : ''}
        <div class="stat-strip">
          <div class="stat">${ic('public', 20)}<span><b>${counts.live}</b> live in production</span></div>
          <div class="stat">${ic('science', 20)}<span><b>${counts.demo}</b> on demo, waiting for production</span></div>
          <div class="stat">${ic('edit_note', 20)}<span><b>${counts.draft}</b> with an open draft${counts.review ? `, ${counts.review} waiting for review` : ''}</span></div>
        </div>
        <section class="card"><div class="card-body" id="col-table"></div></section>`;
      dataTable($('#col-table'), {
        id: 'col', caption: cfg.title, noun: cfg.noun, searchPlaceholder: `Search ${cfg.title.toLowerCase()}`,
        rows: list, defaultSort: cfg.defaultSort || { key: 'updated', dir: 'desc' },
        searchText: r => `${r.name} ${cfg.searchExtra ? cfg.searchExtra(latestData(r)) : ''}`,
        filters: [
          { key: 'env', label: 'Publishing', options: [['production', 'Live, nothing pending'], ['demo', 'Waiting on demo'], ['draft', 'Open draft']], match: (r, v) => envRank(r) === v },
          ...(cfg.filters || [])
        ],
        empty: { icon: cfg.icon, title: `No ${cfg.title.toLowerCase()} yet`, text: canEdit ? `Create the first ${cfg.noun}.` : '' },
        columns: [
          { key: 'name', label: cfg.nameLabel || 'Title', sortable: true, sortValue: r => r.name.toLowerCase(), render: r => `<a class="row-link" href="#${cfg.route}-${r.id}">${cfg.nameIcon ? ic(cfg.nameIcon(latestData(r)), 20) : ''}<span>${esc(r.name)}</span></a>` },
          ...cfg.columns.map(c => ({ ...c, render: r => c.render(latestData(r), r), sortValue: c.sortValue ? r => c.sortValue(latestData(r)) : undefined })),
          { key: 'status', label: 'Publishing', render: envBadges },
          { key: 'updated', label: 'Last change', sortable: true, sortValue: lastChange, render: r => `<span class="nowrap">${esc(fmtDateTime(lastChange(r)))}</span>` }
        ]
      });
    }
  };
  const latestOn = r => { const d = dataAt(r, 'production'); return d && d.enabled !== false; };

  /* ---- Editor ---- */
  const editor = {
    st: null,
    async render(main, ctx) {
      const isNewRoute = ctx.route.pattern.endsWith('-new');
      const st = this.st = { rec: null, working: null, errors: {}, isNew: isNewRoute };
      const crumbs = [[cfg.section, null], [cfg.title, cfg.route]];
      main.innerHTML = `<div class="page ${cfg.cls || ''}" id="ed-page">${loadingState(`Loading the ${cfg.noun}`)}</div>`;
      if (!isNewRoute) {
        try { st.rec = await ConfigService.get(ctx.params.id); }
        catch (err) { $('#ed-page').innerHTML = `${pageHead({ crumbs, title: `${cfg.noun[0].toUpperCase()}${cfg.noun.slice(1)} not found` })}${errorState(err.message)}`; $('[data-retry]').onclick = () => this.render(main, ctx); return; }
        st.working = clone(latestData(st.rec));
      } else st.working = cfg.defaults();
      const base = () => st.isNew ? cfg.defaults() : latestData(st.rec);
      const dirty = () => !same(st.working, base());
      const ro = !can(Session.role(), cfg.area, 'draft');
      const title = () => recName(st.working) || (st.isNew ? cfg.newLabel : cfg.title);
      const secs = () => cfg.sections.map(s => ({ ...s, fields: s.fields.map(f => ro ? { ...f, readonly: true } : f) }));
      $('#ed-page').innerHTML = `${pageHead({ crumbs, title: title(), badges: `<span id="ed-badges">${st.isNew ? badge('unsaved', 'New') : envBadges(st.rec)}</span>`, lede: cfg.editorLede || '' })}
        ${cfg.banner ? cfg.banner : ''}
        <section class="card lc" aria-labelledby="lc-h"><div class="card-head"><h2 id="lc-h" tabindex="-1">Publishing</h2><div class="card-actions">${badge('mock')}</div></div><div class="card-body" id="lc"></div></section>
        <div class="ed-grid${cfg.preview || cfg.side ? '' : ' single'}">
          <section class="card ${cfg.formCls || ''}" aria-labelledby="form-h"><div class="card-head"><h2 id="form-h">${esc(cfg.formTitle || 'Details')}</h2>${ro ? `<div class="card-actions">${badge('fixed', 'View only')}</div>` : ''}</div>
            <form class="card-body form" id="ed-form" novalidate></form></section>
          ${cfg.preview ? '<aside class="ed-side" id="ed-preview"></aside>' : cfg.side ? '<aside class="ed-side"><section class="card"><div class="card-body" id="ed-side"></div></section></aside>' : ''}
        </div>
        ${st.isNew ? '' : historyCard()}`;
      const form = $('#ed-form');
      const drawForm = () => { form.innerHTML = renderForm(secs(), st.working, st.errors, 'f'); };
      let pvCard = null;
      const refresh = () => {
        $('#ed-badges').innerHTML = st.isNew ? badge('unsaved', 'New') : `${envBadges(st.rec)}${dirty() ? badge('unsaved') : ''}`;
        $('#page-h').textContent = title();
        lc.render();
        if (pvCard) pvCard.update();
        if (cfg.side) $('#ed-side').innerHTML = cfg.side(st.working, st.rec);
      };
      const validate = () => {
        st.errors = validateData(allFields(), st.working, cfg.validate);
        drawForm();
        if (Object.keys(st.errors).length) { $('#f-errsum').focus(); return false; }
        return true;
      };
      form.addEventListener('submit', e => e.preventDefault());
      drawForm();
      wireForm(form, allFields, st.working, debounce(() => {
        if (Object.keys(st.errors).length) { const fresh = validateData(allFields(), st.working, cfg.validate); Object.keys(st.errors).forEach(k => { if (!fresh[k]) { delete st.errors[k]; const el = $(`[data-field="${k}"]`, form); if (el) { el.classList.remove('has-error'); const er = $('.err', el); if (er) er.hidden = true; $$('[aria-invalid]', el).forEach(x => x.removeAttribute('aria-invalid')); } } }); }
        refresh();
      }, 120), drawForm);
      const describe = (a, b) => cfg.describe ? cfg.describe(a, b) : describeData(a, b, allFields());
      const lc = Lifecycle({
        host: () => $('#lc'), area: cfg.area, noun: cfg.noun,
        getRec: () => st.rec, getWorking: () => clone(st.working), isDirty: dirty, isNew: () => st.isNew, describe, validate,
        create: data => ConfigService.create(cfg.type, data, 'Created in the Admin'),
        onSaved: (rec, kind) => {
          if (kind === 'created') { Router.clearGuard(); Router.go(`${cfg.route}-${rec.id}`); return; }
          st.rec = rec; const fresh = clone(latestData(rec)); Object.keys(st.working).forEach(k => delete st.working[k]); Object.assign(st.working, fresh);
          drawForm(); refresh(); if (hist) hist.update(rec.events); $('#lc-h').focus();
        },
        onDiscard: () => { const fresh = clone(base()); Object.keys(st.working).forEach(k => delete st.working[k]); Object.assign(st.working, fresh); st.errors = {}; drawForm(); refresh(); $('#lc-h').focus(); },
        afterDelete: () => { Router.clearGuard(); Router.go(cfg.route); }
      });
      let hist = null;
      if (!st.isNew) hist = mountHistory({ getRec: () => st.rec, describe, onSaved: (rec) => { st.rec = rec; Object.keys(st.working).forEach(k => delete st.working[k]); Object.assign(st.working, clone(latestData(rec))); drawForm(); refresh(); hist.update(rec.events); } });
      if (cfg.preview) {
        $('#ed-preview').id = 'ed-pv';
        pvCard = mountPreviewCard($('#ed-pv'), {
          title: `Mobile preview of the ${cfg.noun}`,
          sources: () => recSources(st.rec, dirty(), st.isNew),
          payload: src => cfg.preview(src === 'working' ? st.working : dataAt(st.rec, src), st.rec ? st.rec.id : '__new__', src)
        });
      }
      this.pv = pvCard;
      refresh();
      Router.setGuard(async () => {
        if (!dirty() || ro) return true;
        const r = await confirmDialog({ title: 'Leave without saving?', body: `<p>Your changes to “${esc(title())}” aren’t saved. If you leave, they’re lost.</p>`, confirmLabel: 'Leave page', variant: 'danger', cancelLabel: 'Stay on this page' });
        return r.ok;
      });
    },
    leave() { if (this.pv) { this.pv.destroy(); this.pv = null; } }
  };
  BUILT_PAGES[`${cfg.route}-new`] = editor;
  BUILT_PAGES[`${cfg.route}-:id`] = editor;
}

const ruleText = r => `${AUDIENCE_ATTRS[r.attr].label} ${r.op} ${r.value}`;
const segmentSummary = d => !d.rules.length ? 'Everyone who uses MyCare' : `People where ${d.rules.map(ruleText).join(d.match === 'all' ? ' and ' : ' or ')}`;
function segmentConflicts(d) {
  if (d.match !== 'all') return [];
  const out = [], by = {};
  d.rules.forEach(r => { if (r.op === 'is') (by[r.attr] = by[r.attr] || new Set()).add(r.value); });
  Object.entries(by).forEach(([a, vals]) => { if (vals.size > 1) out.push(`${AUDIENCE_ATTRS[a].label} can’t be ${[...vals].join(' and ')} at the same time, so nobody matches. Use “Any rule” or remove one.`); });
  return out;
}

/* Modal form: resolves the edited data, or null when cancelled */
function formModal({ title, sections, data, validate, confirmLabel = 'Save', note = '' }) {
  return new Promise(resolve => {
    const d = clone(data); let errors = {}, done = false;
    const fs = () => fields(sections);
    openModal({
      title, wide: true,
      body: `${note}<div id="mf"></div>`,
      actions: `${btn({ label: 'Cancel', variant: 'text', attrs: 'data-close' })}${btn({ label: confirmLabel, variant: 'primary', type: 'submit' })}`,
      onOpen(dlg, close) {
        const host = $('#mf', dlg);
        const draw = () => { host.innerHTML = renderForm(sections, d, errors, 'm'); };
        draw();
        wireForm(host, fs, d, () => {}, draw);
        const first = $('input:not([type=hidden]),select,textarea', host); first && first.focus();
        $('form', dlg).addEventListener('submit', e => {
          e.preventDefault();
          errors = validateData(fs(), d, validate);
          if (Object.keys(errors).length) { draw(); $('#m-errsum', dlg).focus(); return; }
          done = true; resolve(d); close();
        });
        dlg.addEventListener('close', () => { if (!done) resolve(null); });
      }
    });
  });
}

/* Editable rows (search tables, locations) on top of dataTable */
function rowsEditor(host, { rows, noun, caption, columns, sections, blank, validate, ro, onChange, searchText, rowTitle, extraActions, onExtraClick }) {
  const t = dataTable(host, {
    id: 'rows', caption, noun, rows, searchPlaceholder: `Search ${caption.toLowerCase()}`, pageSize: 10,
    searchText, actions: ro ? '' : btn({ label: `Add ${noun}`, icon: 'add', variant: 'primary', attrs: 'data-row-add' }),
    empty: { icon: 'table_rows', title: `No ${noun}s yet`, text: ro ? '' : `Add the first ${noun}.` },
    columns: [...columns, { key: 'acts', label: 'Actions', hideLabel: true, render: r => ro ? '' : `<span class="row-acts">${extraActions ? extraActions(r) : ''}${btn({ label: `Edit ${rowTitle(r)}`, icon: 'edit', variant: 'text', iconOnly: true, attrs: `data-row-edit="${r.id}"` })}${btn({ label: `Delete ${rowTitle(r)}`, icon: 'delete', variant: 'text', iconOnly: true, attrs: `data-row-del="${r.id}"` })}</span>` }]
  });
  host.onclick = async e => {
    if (onExtraClick) onExtraClick(e);
    const add = e.target.closest('[data-row-add]'), ed = e.target.closest('[data-row-edit]'), del = e.target.closest('[data-row-del]');
    if (add) {
      const d = await formModal({ title: `Add ${noun}`, sections, data: blank(), validate: v => validate(v, null), confirmLabel: `Add ${noun}` });
      if (d) { rows.push({ ...d, id: uid('r') }); t.update(rows); onChange(); toast(`${noun[0].toUpperCase()}${noun.slice(1)} added to your working copy. Save the draft to keep it.`); announce(`${noun} added`); }
      add.focus();
    }
    if (ed) {
      const i = rows.findIndex(r => r.id === ed.dataset.rowEdit);
      const d = await formModal({ title: `Edit ${noun}`, sections, data: rows[i], validate: v => validate(v, rows[i].id) });
      if (d) { rows[i] = d; t.update(rows); onChange(); announce(`${noun} updated`); }
      const again = $(`[data-row-edit="${rows[i].id}"]`, host); again && again.focus();
    }
    if (del) {
      const i = rows.findIndex(r => r.id === del.dataset.rowDel), gone = rows[i];
      rows.splice(i, 1); t.update(rows); onChange();
      toast(`Deleted “${rowTitle(gone)}” from your working copy.`, { action: 'Undo', onAction: () => { rows.splice(i, 0, gone); t.update(rows); onChange(); announce('Restored'); } });
      $('[data-row-add]', host) && $('[data-row-add]', host).focus();
    }
  };
  return t;
}

function defineSingleton(cfg) {

      try { st.rec = await ConfigService.get(cfg.id); }
      catch (err) { $('#sg-body').innerHTML = errorState(err.message); $('[data-retry]').onclick = () => this.render(main); return; }
      st.working = clone(latestData(st.rec));
      const base = () => latestData(st.rec), dirty = () => !same(st.working, base());
      const ro = !can(Session.role(), cfg.area, 'draft');
      const allF = () => cfg.sections ? fields(cfg.sections) : [];
      const describe = (a, b) => cfg.describe ? cfg.describe(a, b) : describeData(a, b, allF());
      $('#sg-body').innerHTML = `
        <section class="card lc" aria-labelledby="lc-h"><div class="card-head"><h2 id="lc-h" tabindex="-1">Publishing</h2><div class="card-actions"><span id="sg-badges"></span>${badge('mock')}</div></div><div class="card-body" id="lc"></div></section>
        <div class="ed-grid${cfg.preview || cfg.side || cfg.sideStatic ? '' : ' single'}">
          <div class="ed-main">
            <section class="card" aria-labelledby="form-h"><div class="card-head"><h2 id="form-h">${esc(cfg.formTitle || 'Settings')}</h2>${ro ? `<div class="card-actions">${badge('fixed', 'View only')}</div>` : ''}</div>
              <div class="card-body" id="sg-editor"></div></section>
            ${cfg.preview && cfg.side ? '<section class="card"><div class="card-body" id="sg-side"></div></section>' : ''}
          </div>
          ${cfg.preview ? '<aside class="ed-side" id="sg-pv"></aside>' : cfg.side || cfg.sideStatic ? `<aside class="ed-side"><section class="card"><div class="card-body" id="sg-side">${cfg.sideStatic ? cfg.sideStatic() : ''}</div></section></aside>` : ''}
        </div>
        ${historyCard()}`;
      let pv = null, hist = null;
      const refresh = () => {
        $('#sg-badges').innerHTML = `${envBadges(st.rec)}${dirty() ? badge('unsaved') : ''}`;
        lc.render(); if (pv) pv.update(); if (cfg.side) $('#sg-side').innerHTML = cfg.side(st.working, st); if (cfg.onRefresh) cfg.onRefresh(st);
      };
      const reset = data => { Object.keys(st.working).forEach(k => delete st.working[k]); Object.assign(st.working, clone(data)); st.errors = {}; drawEditor(); refresh(); };
      const editorHost = $('#sg-editor');
      const drawEditor = () => {
        if (cfg.sections) { editorHost.innerHTML = `<form class="form" novalidate id="sg-form">${renderForm(cfg.sections.map(s => ({ ...s, fields: s.fields.map(f => ro ? { ...f, readonly: true } : f) })), st.working, st.errors, 'f')}</form>`; }
        else cfg.renderEditor(editorHost, st, { ro, onChange: debounce(refresh, 80) });
      };
      drawEditor();
      if (cfg.sections) {
        editorHost.addEventListener('submit', e => e.preventDefault());
        wireForm(editorHost, allF, st.working, debounce(refresh, 100), drawEditor);
      }
      const validate = () => {
        const errs = cfg.sections ? validateData(allF(), st.working, cfg.validate) : (cfg.validate ? cfg.validate(st.working) : {});
        st.errors = errs;
        if (cfg.sections) { drawEditor(); if (Object.keys(errs).length) $('#f-errsum').focus(); }
        else if (Object.keys(errs).length) toast(Object.values(errs)[0], { kind: 'error', ms: 8000 });
        return !Object.keys(errs).length;
      };
      const lc = Lifecycle({
        host: () => $('#lc'), area: cfg.area, noun: cfg.noun, getRec: () => st.rec, getWorking: () => clone(st.working), isDirty: dirty, describe, validate,
        onSaved: rec => { st.rec = rec; reset(latestData(rec)); hist.update(rec.events); $('#lc-h').focus(); },
        onDiscard: () => { reset(base()); $('#lc-h').focus(); }, afterDelete: () => {}
      });
      hist = mountHistory({ getRec: () => st.rec, describe, onSaved: rec => { st.rec = rec; reset(latestData(rec)); hist.update(rec.events); } });
      if (cfg.preview) {
        pv = mountPreviewCard($('#sg-pv'), {
          title: `Mobile preview of ${cfg.title.toLowerCase()}`, sources: () => recSources(st.rec, dirty(), false),
          payload: src => cfg.preview(src === 'working' ? st.working : dataAt(st.rec, src), src, st),
          extras: cfg.previewExtras ? cfg.previewExtras(st) : '', onExtras: cfg.wireExtras ? (h, send) => cfg.wireExtras(h, send, st) : null
        });
        this.pv = pv;
      }
      if (cfg.afterRender) cfg.afterRender(st);
      refresh();
      Router.setGuard(async () => {
        if (!dirty() || ro) return true;
        const r = await confirmDialog({ title: 'Leave without saving?', body: `<p>Your changes to ${esc(cfg.title.toLowerCase())} aren’t saved. If you leave, they’re lost.</p>`, confirmLabel: 'Leave page', variant: 'danger', cancelLabel: 'Stay on this page' });
        return r.ok;
      });
    },
    leave() { if (this.pv) { this.pv.destroy(); this.pv = null; } }
  };
}

/* ---- Global colors ---- */
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function contrast(a, b) {
  if (!/^#[0-9a-f]{6}$/i.test(a) || !/^#[0-9a-f]{6}$/i.test(b)) return 0;
  const L = h => { const c = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
  const x = L(a), y = L(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05);
}
const COLOR_CHECKS = d => [
  ['White text on the primary color (buttons, app bar)', contrast('#FFFFFF', d.primary), 4.5, 'primary'],
  ['Primary text on the background (headings, links)', contrast(d.primary, d.background), 4.5, 'primary'],
  ['Body text #333333 on the background', contrast('#333333', d.background), 4.5, 'background'],
  ['White text on the secondary color (campaign gradient)', contrast('#FFFFFF', d.secondary), 3, 'secondary'],
  ['Tertiary icons on the primary color', contrast(d.tertiary, d.primary), 3, 'tertiary']
];

      </div>`;
    const form = $('#ne-form');
    const draw = () => { form.innerHTML = renderForm(NOTE_SECTIONS.map(s => ({ ...s, fields: s.fields.map(f => editable() ? f : { ...f, readonly: true }) })), working, errors, 'f'); };
    draw();
    form.addEventListener('submit', e => e.preventDefault());
    const pv = this.pv = mountPreviewCard($('#ne-pv'), {
      title: 'Mobile preview of the notification',
      sources: () => [['working', 'Lock screen', working.delivery === 'inbox' ? badge('draft', 'Inbox message') : badge('draft', 'Push notification')]],
      payload: () => ({ screen: 'push', layout: layoutFor('guest'), content: { ...appContent(), push: { title: working.title, body: working.description, art: working.image !== 'none' ? ART[working.image] : null, delivery: working.delivery, when: working.timing === 'scheduled' && working.scheduledAt ? fmtLocal(working.scheduledAt).replace(/, \d{4},.*$/, '') : 'Thursday, Oct. 30' } }, label: 'notification preview' })
    });
    const renderActions = () => {
      const s = n ? n.status : 'new', acts = [];
      const can2 = l => can(role, 'notifications', l);
      if (editable() && (dirty() || isNew)) acts.push(btn({ label: isNew ? 'Save as draft' : 'Save changes', icon: 'save', variant: 'primary', attrs: 'data-n="save"' }));
      if (s === 'draft' && !dirty() && can2('draft')) acts.push(btn({ label: 'Submit for approval', icon: 'rate_review', variant: can2('publish') ? 'secondary' : 'primary', attrs: 'data-n="submit"' }));
      if (s === 'pending' && !dirty() && can2('publish')) acts.push(btn({ label: working.timing === 'now' ? 'Approve and send now' : 'Approve and schedule', icon: working.timing === 'now' ? 'send' : 'schedule', variant: 'primary', attrs: 'data-n="approve"' }));
      if (['pending', 'scheduled'].includes(s) && can2('publish')) acts.push(btn({ label: 'Cancel notification', icon: 'cancel', variant: 'secondary', attrs: 'data-n="cancel"' }));
      if (n && can2('draft')) acts.push(btn({ label: 'Duplicate', icon: 'content_copy', variant: 'text', attrs: 'data-n="dup"' }));
      if (n && ['draft', 'cancelled'].includes(s) && can2('draft')) acts.push(btn({ label: 'Delete', icon: 'delete', variant: 'text', attrs: 'data-n="del"' }));
      const note = s === 'pending' && !can2('publish') ? 'Waiting for an Admin or Super Admin to approve it.' : s === 'draft' && !can2('publish') ? 'After you submit it, an Admin or Super Admin approves it.' : '';
      $('#ne-lc').innerHTML = `${stepper(steps(), 'Notification status')}<div class="lc-actions">${acts.join('')}</div>${note ? `<p class="role-note">${ic('info', 20)}<span>${note} Approval rules are pending confirmation.</span></p>` : ''}`;
      $('#ne-b').innerHTML = `${n ? noteBadge(n.status) : badge('unsaved', 'New')}${n && dirty() ? badge('unsaved') : ''}`;
      $('#page-h').textContent = title();
    };
    const refresh = debounce(() => { renderActions(); pv.update(); }, 100);
    wireForm(form, () => noteFields, working, refresh, draw);
    renderActions();
    const reload = async (msg, go) => { Router.clearGuard(); toast(msg, { kind: 'success' }); if (go) Router.go(go); else this.render(main, ctx); };
    $('#ne-lc').onclick = async e => {
      const b = e.target.closest('[data-n]'); if (!b) return;
      const k = b.dataset.n;
      const run = async (fn, busy, msg, go) => { setBusy(b, true, busy); try { const r = await fn(); reload(typeof msg === 'function' ? msg(r) : msg, typeof go === 'function' ? go(r) : go); } catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); } };
      if (k === 'save') {
        errors = validateData(noteFields, working, noteValidate); draw();
        if (Object.keys(errors).length) { $('#f-errsum').focus(); return; }
        return run(() => NotificationService.save(n && n.id, working), 'Saving', 'Saved as a draft. Submit it for approval when it’s ready.', r => isNew ? `notifications-${r.id}` : null);
      }
      if (k === 'submit') { const c = await confirmDialog({ title: 'Submit for approval?', body: `<p>An Admin or Super Admin reviews “${esc(n.title)}” before it’s ${n.timing === 'now' ? 'sent' : 'scheduled'}.</p>`, confirmLabel: 'Submit for approval' }); if (c.ok) run(() => NotificationService.submit(n.id), 'Submitting', 'Submitted for approval.'); }
      if (k === 'approve') {
        const c = await confirmDialog({ title: n.timing === 'now' ? 'Send this notification now?' : 'Approve and schedule?', body: `<div class="warn-box">${ic('notifications', 20)}<p>${n.timing === 'now' ? 'It goes to' : `On ${esc(fmtLocal(n.scheduledAt))} it goes to`} <b>${esc(segmentName(n.sendTo))}</b> as ${esc(deliveryLabel(n.delivery).toLowerCase())}. Sending is simulated in the prototype.</p></div>`, confirmLabel: n.timing === 'now' ? 'Send now' : 'Approve and schedule', comment: { label: 'Comment', hint: 'Optional' } });
        if (c.ok) run(() => NotificationService.approve(n.id, c.comment), 'Approving', r => r.status === 'sent' ? 'Sent (simulated).' : `Scheduled for ${fmtLocal(r.scheduledAt)}.`);
      }
      if (k === 'cancel') { const c = await confirmDialog({ title: 'Cancel this notification?', body: '<p>It won’t be sent. You can duplicate it later to send a new version.</p>', confirmLabel: 'Cancel notification', variant: 'danger', cancelLabel: 'Keep it', comment: { label: 'Reason', required: true } }); if (c.ok) run(() => NotificationService.cancel(n.id, c.comment), 'Cancelling', 'Notification cancelled.'); }
      if (k === 'dup') run(() => NotificationService.duplicate(n.id), 'Duplicating', 'Duplicated as a new draft.', r => `notifications-${r.id}`);
      if (k === 'del') { const c = await confirmDialog({ title: 'Delete this notification?', body: `<p>“${esc(n.title)}” is deleted for good. The audit log keeps a record.</p>`, confirmLabel: 'Delete', variant: 'danger' }); if (c.ok) run(() => NotificationService.remove(n.id), 'Deleting', 'Notification deleted.', 'notifications'); }
    };
    Router.setGuard(async () => {
      if (!dirty() || !editable()) return true;
      const r = await confirmDialog({ title: 'Leave without saving?', body: '<p>Your changes to this notification aren’t saved.</p>', confirmLabel: 'Leave page', variant: 'danger', cancelLabel: 'Stay on this page' });
      return r.ok;
    });
  },
  leave() { if (this.pv) { this.pv.destroy(); this.pv = null; } }
};

            ${val ? btn({ label: `Publish v${val.version} to demo`, icon: 'science', variant: 'primary', attrs: `data-w="demo" data-v="${val.version}"` }) : ''}
            ${w.demo !== w.production ? btn({ label: `Publish demo v${w.demo} to production`, icon: 'public', variant: val ? 'secondary' : 'primary', attrs: `data-w="prod" data-v="${w.demo}"` }) : ''}
          </div>` : `<p class="role-note">${ic('info', 20)}<span>Your role can view wayfinding. Admins and Super Admins upload and publish.</span></p>`}
        </div></section>
        ${canPub ? `<section class="card" aria-labelledby="wf-up-h"><div class="card-head"><h2 id="wf-up-h" tabindex="-1">Upload a file</h2></div><div class="card-body">
          <div class="drop" id="wf-drop">
            ${ic('upload_file', 32)}
            <p class="drop-t">Drag a Gozio JSON export here, or</p>
            <label class="btn btn-primary" for="wf-file">${ic('folder_open', 20)}<span class="lbl">Choose a file</span></label>
            <input type="file" id="wf-file" accept=".json,application/json" class="vh">
            <p class="hint">JSON only, up to 10 MB. The file is checked in your browser and isn’t sent anywhere.</p>
            <p class="drop-or">No export to hand? ${btn({ label: 'Use a valid sample file', variant: 'text', attrs: 'data-sample="ok"' })} ${btn({ label: 'Use a sample with errors', variant: 'text', attrs: 'data-sample="bad"' })}</p>
          </div>
          <div id="wf-progress"></div><div id="wf-result" tabindex="-1"></div>
        </div></section>` : ''}
        <section class="card" aria-labelledby="wf-v-h"><div class="card-head"><h2 id="wf-v-h" tabindex="-1">Published versions</h2><div class="card-actions">${badge('pending', 'Rollback supported – assumed, pending confirmation')}</div></div><div class="card-body" id="wf-versions"></div></section>
        <section class="card" aria-labelledby="wf-h-h"><div class="card-head"><h2 id="wf-h-h">Publication history</h2></div><div class="card-body" id="wf-hist"></div></section>`;
      dataTable($('#wf-versions'), {
        id: 'wfv', caption: 'Wayfinding versions', noun: 'version', rows: w.versions, defaultSort: { key: 'version', dir: 'desc' }, searchText: v => `${v.fileName} ${v.comment}`,
        columns: [
          { key: 'version', label: 'Version', sortable: true, render: v => `v${v.version}`, cls: 'num' },
          { key: 'fileName', label: 'File', render: v => `<span class="mono">${esc(v.fileName)}</span><br><span class="muted">${v.sizeKb.toLocaleString('en-US')} KB</span>` },
          { key: 'contents', label: 'Contents', render: v => `${v.buildings} buildings · ${v.floors} floors · ${v.destinations.toLocaleString('en-US')} destinations${v.warnings ? `<br>${badge('pending', `${v.warnings} warnings`)}` : ''}` },
          { key: 'status', label: 'Status', render: v => badge(...(WF_STATUS[v.status] || ['hidden', v.status])) },
          { key: 'at', label: 'Uploaded', sortable: true, render: v => `<span class="nowrap">${esc(fmtDateTime(v.at))}</span><br><span class="muted">${esc(UserService.name(v.by))}</span>` },
          { key: 'acts', label: 'Actions', hideLabel: true, render: v => canPub && v.version !== w.production && ['retired', 'demo'].includes(v.status) ? btn({ label: `Roll back to v${v.version}`, icon: 'history', variant: 'text', attrs: `data-w="rollback" data-v="${v.version}"` }) : '' }]
      });
      dataTable($('#wf-hist'), {
        id: 'wfh', caption: 'Publication history', noun: 'event', rows: w.history, defaultSort: { key: 'at', dir: 'desc' }, pageSize: 8, searchText: h => `${h.action} ${h.comment} ${UserService.name(h.by)}`,
        filters: [{ key: 'env', label: 'Environment', options: [['draft', 'Upload'], ['demo', 'Demo'], ['production', 'Production']], match: (h, v) => h.environment === v }],
        columns: [
          { key: 'at', label: 'When', sortable: true, render: h => `<span class="nowrap">${esc(fmtDateTime(h.at))}</span>` },
          { key: 'action', label: 'Event', render: h => esc(h.action) },
          { key: 'version', label: 'Version', render: h => `v${h.version}`, cls: 'num' },
          { key: 'environment', label: 'Environment', render: h => h.environment === 'draft' ? badge('draft', 'Upload') : badge(h.environment) },
          { key: 'by', label: 'By', render: h => esc(UserService.name(h.by)) },
          { key: 'comment', label: 'Comment', render: h => h.comment ? esc(h.comment) : '<span class="muted">None</span>', cls: 'wrap' }]
      });
      if (canPub) wireUpload();
    };
    const publish = async (b, env, v) => {
      const ver = vOf(v);
      const c = await confirmDialog({ title: env === 'demo' ? `Publish v${v} to demo?` : `Publish v${v} to production?`, body: env === 'demo'
        ? `<p>Demo devices get ${esc(ver.fileName)} (${ver.destinations.toLocaleString('en-US')} destinations). Production stays on v${w.production}.</p>`
        : `<div class="warn-box">${ic('public', 20)}<p>Patients get these indoor maps in the app. Walk a few routes on demo first. Publishing is simulated in the prototype.</p></div>`,
        confirmLabel: env === 'demo' ? 'Publish to demo' : 'Publish to production', comment: { label: 'Comment', hint: env === 'demo' ? 'Optional' : 'Optional, for example which routes you checked' } });
      if (!c.ok) return;
      setBusy(b, true, 'Publishing');
      try { w = await WayfindingService.publish(v, env, c.comment); toast(`v${v} is on ${env}.`, { kind: 'success' }); draw(); $('#wf-cur-h').focus(); }
      catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
    };
    const wireUpload = () => {
      const drop = $('#wf-drop'), input = $('#wf-file');
      const take = (name, size, text) => process(name, size, text);
      input.onchange = () => { const f = input.files[0]; if (!f) return; if (f.size > 10 * 1024 * 1024) { showResult({ ok: false, errors: [`${f.name} is ${(f.size / 1048576).toFixed(1)} MB. The limit is 10 MB.`], warnings: [] }, f.name, f.size); return; } const r = new FileReader(); r.onload = () => take(f.name, f.size, r.result); r.readAsText(f); };
      drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
      drop.ondragleave = () => drop.classList.remove('over');
      drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (!f) return; if (!/\.json$/i.test(f.name)) { showResult({ ok: false, errors: [`${f.name} isn’t a JSON file. Export the wayfinding data from Gozio as JSON.`], warnings: [] }, f.name, f.size); return; } const r = new FileReader(); r.onload = () => take(f.name, f.size, r.result); r.readAsText(f); };
      drop.onclick = e => { const s = e.target.closest('[data-sample]'); if (!s) return; const text = s.dataset.sample === 'ok' ? SAMPLE_GOZIO() : SAMPLE_BAD(); take(s.dataset.sample === 'ok' ? 'gozio-export-sample.json' : 'gozio-export-with-errors.json', text.length, text); };
    };
    const process = async (name, size, text) => {
      const prog = $('#wf-progress'); $('#wf-result').innerHTML = '';
      prog.innerHTML = `<div class="upl"><p><span class="mono">${esc(name)}</span> · ${(size / 1024).toFixed(1)} KB</p><div class="bar" role="progressbar" aria-label="Uploading ${esc(name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div><p class="hint" id="wf-pt">Uploading…</p></div>`;
      const bar = $('.bar', prog);
      for (let p = 0; p <= 100; p += 20) { bar.setAttribute('aria-valuenow', p); $('span', bar).style.width = `${p}%`; await wait(140); }
      $('#wf-pt').textContent = 'Checking the file…';
      try { const res = await WayfindingService.validate(text); prog.innerHTML = ''; showResult(res, name, size); }
      catch (err) { prog.innerHTML = ''; showResult({ ok: false, errors: [err.message], warnings: [] }, name, size); }
    };
    const showResult = (res, name, size) => {
      st.file = res.ok ? { name, size, res } : null;
      const out = $('#wf-result');
      out.innerHTML = res.ok
        ? `<div class="val ok"><h3>${ic('check_circle', 24, 'f1')} ${esc(name)} passed validation</h3>
            <p>${res.stats.buildings} buildings · ${res.stats.floors} floors · ${res.stats.destinations} destinations${res.stats.venue ? ` · ${esc(res.stats.venue)}` : ''}</p>
            ${res.warnings.length ? `<details open><summary>${plural(res.warnings.length, 'warning')} – you can still continue</summary><ul>${res.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
            <div class="field"><label for="wf-comment">Comment for the history</label><input class="input" id="wf-comment" type="text" maxlength="120" placeholder="For example, what changed in this export"></div>
            <div class="lc-actions">${btn({ label: 'Discard file', variant: 'text', attrs: 'data-up="discard"' })}${btn({ label: 'Save as a validated version', icon: 'save', variant: 'primary', attrs: 'data-up="save"' })}</div>
            <p class="muted">Saving doesn’t publish anything. Publish to demo is a separate step.</p></div>`
        : `<div class="val bad"><h3>${ic('error', 24, 'f1')} ${esc(name)} didn’t pass validation</h3><p>Fix these in Gozio, export again and upload the new file. Nothing was saved.</p>
            <ul class="val-errs">${res.errors.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${res.moreErrors ? `<p>And ${res.moreErrors} more.</p>` : ''}
            ${res.warnings && res.warnings.length ? `<details><summary>${plural(res.warnings.length, 'warning')}</summary><ul>${res.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}</div>`;
      out.focus();
      announce(res.ok ? 'File passed validation' : `File failed validation with ${plural(res.errors.length, 'error')}`);
      out.onclick = async e => {
        const b = e.target.closest('[data-up]'); if (!b) return;
        if (b.dataset.up === 'discard') { out.innerHTML = ''; st.file = null; $('#wf-file').value = ''; $('[for="wf-file"]').focus(); return; }
        setBusy(b, true, 'Saving');
        try { w = await WayfindingService.upload(name, Math.max(1, Math.round(size / 1024)), { ...res.stats, warnings: res.warnings.length }, $('#wf-comment').value.trim()); toast('Saved as a validated version. Publish it to demo when you’re ready.', { kind: 'success' }); draw(); $('#wf-cur-h').focus(); }
        catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
      };
    };
    $('#wf').addEventListener('click', async e => {
      const b = e.target.closest('[data-w]'); if (!b) return;
      const v = +b.dataset.v;
      if (b.dataset.w === 'demo') publish(b, 'demo', v);
      if (b.dataset.w === 'prod') publish(b, 'production', v);
      if (b.dataset.w === 'rollback') {
        const c = await confirmDialog({ title: `Roll back to v${v}?`, body: `<p>Demo and production go back to ${esc(vOf(v).fileName)}. v${w.production} stays in the history.</p>`, confirmLabel: `Roll back to v${v}`, variant: 'danger', comment: { label: 'Reason for the rollback', required: true } });
        if (!c.ok) return;
        setBusy(b, true, 'Rolling back');
        try { w = await WayfindingService.rollback(v, c.comment); toast(`Rolled back. Production is v${v}.`, { kind: 'success' }); draw(); $('#wf-v-h').focus(); }
        catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
      }
    });
    load();
  }
};

        if ($('#an-notes')) dataTable($('#an-notes'), { id: 'ann', caption: 'Sent notifications', noun: 'notification', rows: DB.db.notifications.filter(n => n.stats && n.stats.delivered), defaultSort: { key: 'conv', dir: 'desc' }, searchText: n => n.title,

const TYPE_LABEL = t => (CONFIG_TYPES[t] || { label: { user: 'User', notification: 'Notification', wayfinding: 'Wayfinding', search: 'Search', settings: 'Settings', platform: 'Platform' }[t] || t }).label;
function diffTable(before, after) {
  const flat = (o, p = '') => !o || typeof o !== 'object' ? { [p || 'value']: o } : Object.entries(o).reduce((a, [k, v]) => Object.assign(a, v && typeof v === 'object' && !Array.isArray(v) ? flat(v, p ? `${p}.${k}` : k) : { [p ? `${p}.${k}` : k]: v }), {});
  const A = flat(before || {}), B = flat(after || {});
  const keys = [...new Set([...Object.keys(A), ...Object.keys(B)])].filter(k => !same(A[k], B[k]));
  const show = v => v == null ? '<span class="muted">–</span>' : esc(Array.isArray(v) ? (v.length && typeof v[0] === 'object' ? `${v.length} items` : v.join(', ')) : String(v));
  if (!before && !after) return '<p class="muted">No before-and-after detail is recorded for this action.</p>';
  if (!keys.length) return '<p class="muted">No field-level differences.</p>';
  return `<div class="tbl-wrap" tabindex="0" role="region" aria-label="Before and after"><table class="tbl diff"><caption class="vh">Before and after values</caption><thead><tr><th scope="col">Field</th><th scope="col">Before</th><th scope="col">After</th></tr></thead>
    <tbody>${keys.slice(0, 40).map(k => `<tr><th scope="row">${esc(k)}</th><td class="wrap">${show(A[k])}</td><td class="wrap">${show(B[k])}</td></tr>`).join('')}</tbody></table></div>${keys.length > 40 ? `<p class="muted">And ${keys.length - 40} more fields.</p>` : ''}`;
}
