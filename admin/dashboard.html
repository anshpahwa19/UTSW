/* ---------- Sign-in and system pages ----------
   SIMULATED SSO and MFA. No identity provider is connected and no credentials are collected or stored.
   The real flow (SAML or OIDC, the approved MFA mechanism) replaces these screens' service calls only. */
function authLayout(inner) {
  const app = $('#app');
  app.className = 'auth';
  app.innerHTML = `<main id="main" class="auth-main" tabindex="-1">
    <div class="auth-card">
      <img class="auth-logo" src="${LOGO_HORIZONTAL}" alt="UTSW MyCare" width="232">
      ${inner}
    </div>
    <p class="auth-flag">${ic('database', 20)}<span>Prototype – mock data, not connected to MyCare</span></p>
  </main>`;
  const h = $('#page-h'); if (h && Router.loaded) h.focus();
}
const simNote = text => `<p class="sim-note">${badge('simulated')}<span>${text}</span></p>`;

PUBLIC_PAGES.login = function login(step = 'start') {
  document.title = 'Sign in – MyCare Admin (prototype)';
  if (Session.current()) { location.hash = DEFAULT_ROUTE; return; }
  if (step === 'start') {
    authLayout(`<h1 id="page-h" tabindex="-1">MyCare Admin</h1>
      <p class="auth-lede">Manage the MyCare app’s home screen, content and notifications. Sign in with your UT Southwestern account.</p>
      ${btn({ label: 'Sign in with UTSW SSO', icon: 'login', variant: 'primary', size: 'lg', attrs: 'id="sso"' })}
      ${simNote('No identity provider is connected. Next, you pick a sample account to sign in as.')}`);
    $('#sso').onclick = () => PUBLIC_PAGES.login('idp');
    return;
  }
  authLayout(`<h1 id="page-h" tabindex="-1">Choose a sample account</h1>
    <p class="auth-lede">This step stands in for the UTSW identity provider. Each account has one of the planned roles.</p>
    <form id="idp" class="idp" novalidate>
      <fieldset><legend class="vh">Sample accounts</legend>
        ${DB.db.users.filter(u => u.status === 'active').map((u, i) => `<label class="acct" for="acct-${u.id}"><input type="radio" name="acct" id="acct-${u.id}" value="${u.id}" ${i === 0 ? 'checked' : ''}>
          <span class="avatar" aria-hidden="true">${esc(initials(u))}</span><span class="acct-t"><span class="acct-n">${esc(u.first)} ${esc(u.last)}</span><span class="acct-r">${esc(ROLES[u.role].label)} · ${esc(u.email)}</span></span></label>`).join('')}
      </fieldset>
      <div class="auth-acts">${btn({ label: 'Back', variant: 'text', attrs: 'id="idp-back"' })}${btn({ label: 'Continue', variant: 'primary', type: 'submit', size: 'lg' })}</div>
    </form>
    ${simNote('Sample accounts only. There is no username or password.')}`);
  $('#idp-back').onclick = () => PUBLIC_PAGES.login('start');
  $('#idp').onsubmit = e => { e.preventDefault(); Session.begin($('input[name="acct"]:checked').value); location.hash = 'mfa'; };
};

PUBLIC_PAGES.mfa = function mfa() {
  document.title = 'Verify it’s you – MyCare Admin (prototype)';
  if (!Session.pending) { location.hash = 'login'; return; }
  const u = UserService.byId(Session.pending);
  authLayout(`<h1 id="page-h" tabindex="-1">Verify it’s you</h1>
    <p class="auth-lede">We sent a sign-in request to the approved MFA app for ${esc(u.first)} ${esc(u.last)}. Approve it to continue.</p>
    <div class="mfa-wait">${ic('phonelink_lock', 32)}<p>Waiting for approval</p></div>
    <div class="auth-acts">${btn({ label: 'Cancel', variant: 'text', attrs: 'id="mfa-cancel"' })}${btn({ label: 'Approve (simulated)', icon: 'check', variant: 'primary', size: 'lg', attrs: 'id="mfa-ok"' })}</div>
    ${simNote('The approval happens here instead of on a phone. The real MFA mechanism is pending UTSW confirmation.')}`);
  $('#mfa-cancel').onclick = () => { Session.pending = null; location.hash = 'login'; };
  $('#mfa-ok').onclick = async e => {
    setBusy(e.currentTarget, true, 'Signing in');
    await wait(400);
    Session.complete();
    const to = Router.returnTo && !PUBLIC_PAGES[Router.returnTo] ? Router.returnTo : DEFAULT_ROUTE;
    Router.returnTo = null;
    location.hash = to;
  };
};

const exitPage = (title, text, icon) => () => {
  document.title = `${title} – MyCare Admin (prototype)`;
  authLayout(`<div class="exit-ic">${ic(icon, 32)}</div><h1 id="page-h" tabindex="-1">${esc(title)}</h1><p class="auth-lede">${text}</p>
    <a class="btn btn-primary btn-lg" href="#login"><span class="lbl">Sign in again</span></a>`);
};
PUBLIC_PAGES['signed-out'] = exitPage('You’re signed out', 'You signed out of MyCare Admin. Unsaved changes were not kept.', 'logout');
PUBLIC_PAGES.expired = () => exitPage('Your session ended', `For security, MyCare Admin signs you out after ${(DB.db.settings && DB.db.settings.sessionTimeout) || 30} minutes without activity. Sign in again to continue. Unsaved changes were not kept.`, 'timer_off')();

function deniedView(route) {
  const role = Session.role();
  const what = route ? `${route.section.label}${route.section.items.length > 1 ? ` – ${route.item.label}` : ''}` : 'this page';
  return `<div class="page sys-page">${emptyState({ icon: 'lock', level: 1, title: 'You don’t have access to this page',
    text: `Your role, ${esc(ROLES[role].label)}, can’t open ${esc(what)}. Access follows the proposed permission matrix, which is pending UTSW confirmation. Ask a Super Admin if you need access.`,
    action: `<a class="btn btn-primary" href="#${DEFAULT_ROUTE}"><span class="lbl">Go to the dashboard</span></a>` }).replace('<h1>', '<h1 id="page-h" tabindex="-1">')}</div>`;
}
function notFoundView(name) {
  return `<div class="page sys-page">${emptyState({ icon: 'search_off', level: 1, title: 'Page not found',
    text: `There is no page at “#${esc(name)}”. Check the link, or use the navigation.`,
    action: `<a class="btn btn-primary" href="#${DEFAULT_ROUTE}"><span class="lbl">Go to the dashboard</span></a>` }).replace('<h1>', '<h1 id="page-h" tabindex="-1">')}</div>`;
}

/* ===== src/pages/home-layout.js ===== */
/* ---------- Home Screen → Layout ----------
   Order (drag, keyboard or the move menu) and visibility of the home modules for guests and signed-in patients, a live preview
   built from the Guest Flow 2 modules, and the shared Draft → Demo → Production lifecycle. Alerts and the Find Care hero are
   pinned above the ordered modules, as in the design's CMS module layout. */
/* EXTRA_GLYPHS: save rate_review science public vertical_align_top vertical_align_bottom arrow_upward arrow_downward */
const MOVES = [['top', 'Move to top', 'vertical_align_top'], ['up', 'Move up', 'arrow_upward'], ['down', 'Move down', 'arrow_downward'], ['bottom', 'Move to bottom', 'vertical_align_bottom']];
const AUDIENCES = [['guest', 'Guest'], ['authenticated', 'Authenticated']];
const modLabel = id => (HOME_MODULES[id] || {}).label || id;
function describeLayout(from, to) {
  if (!from) return ['New layout'];
  const out = [], pos = list => Object.fromEntries(list.map((m, i) => [m.id, i + 1]));
  const pf = pos(from.modules), pt = pos(to.modules);
  to.modules.forEach(m => {
    const was = from.modules.find(x => x.id === m.id);
    if (!was) { out.push(`${modLabel(m.id)} is added at position ${pt[m.id]}${m.on ? '' : ', hidden'}`); return; }
    if (pf[m.id] !== pt[m.id]) out.push(`${modLabel(m.id)} moves from position ${pf[m.id]} to ${pt[m.id]}`);
    if (was.on !== m.on) out.push(`${modLabel(m.id)} is ${m.on ? 'shown' : 'hidden'}`);
  });
  from.modules.forEach(m => { if (!pt[m.id]) out.push(`${modLabel(m.id)} is removed`); });
  return out;
}

BUILT_PAGES['home-layout'] = (() => {
  let st = { aud: 'guest', showAlert: true }, main, pv;
  const may = a => canAct(Session.role(), 'homeLayout', a);
  const base = () => latestData(st.rec);
  const dirty = () => !!st.rec && !same(st.working, base());

  function render(host) {
    main = host;
    main.innerHTML = `<div class="page hl">
      ${pageHead({ crumbs: [['Home Screen', null]], title: 'Home screen layout',
        lede: 'Choose which modules patients see on the home screen, and in what order.' })}
      <section class="card hub-pub" aria-labelledby="hub-pub-h" id="hub-pub"></section>
      <div class="tabs" role="tablist" aria-label="Audience">${AUDIENCES.map(([k, l]) =>
        `<button type="button" role="tab" id="aud-${k}" aria-controls="aud-panel" aria-selected="${k === st.aud}" tabindex="${k === st.aud ? 0 : -1}" data-aud="${k}">${esc(l)}</button>`).join('')}</div>
      <div id="aud-panel" role="tabpanel" aria-labelledby="aud-${st.aud}"></div>
    </div>`;
    featureBar(['homeLayout'], 'Layout');
    const tabs = $$('[role="tab"]', main);
    const pick = async (t, focus) => {
      if (t.dataset.aud === st.aud) return;
      if (dirty()) {
        const r = await confirmDialog({ title: 'Discard unsaved changes?', body: `<p>You have unsaved changes to the ${st.aud} layout. Switching audiences discards them.</p>`, confirmLabel: 'Discard and switch', variant: 'danger', cancelLabel: 'Keep editing' });
        if (!r.ok) return;
      }
      tabs.forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; });
      if (focus) t.focus();
      st.aud = t.dataset.aud;
      $('#aud-panel').setAttribute('aria-labelledby', t.id);
      load();
    };
    tabs.forEach((t, i) => {
      t.onclick = () => pick(t);
      t.onkeydown = e => { const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (d) { e.preventDefault(); pick(tabs[(i + d + tabs.length) % tabs.length], true); } };
    });
    load();
  }

  async function load() {
    const panel = $('#aud-panel');
    panel.innerHTML = loadingState('Loading the layout');
    if (pv) { pv.destroy(); pv = null; }
    try { st.rec = await ConfigService.get(`home-layout-${st.aud}`); }
    catch (err) { panel.innerHTML = errorState(err.message); $('[data-retry]', panel).onclick = load; return; }
    st.working = clone(base());
    panel.innerHTML = `
      <div class="hl-grid">
        <div class="hl-main">
          <div class="hl-edit" id="editor"></div>
        </div>
        <aside class="hl-preview" id="hl-pv"></aside>
      </div>
      ${historyCard()}`;
    const hist = st.hist = mountHistory({ getRec: () => st.rec, describe: describeLayout, onSaved: rec => { st.rec = rec; st.working = clone(base()); update(); hist.update(rec.events); renderFeatureBar(); } });
    pv = mountPreviewCard($('#hl-pv'), {
      title: `Mobile preview of the ${st.aud} home screen`,
      sources: () => recSources(st.rec, dirty(), false),
      extras: checkbox({ id: 'pv-alert', label: 'Show emergency alerts', checked: st.showAlert }),
      onExtras: (h, send) => { $('#pv-alert', h).onchange = e => { st.showAlert = e.target.checked; send(); }; },
      payload: src => {
        const data = src === 'working' ? st.working : dataAt(st.rec, src);
        const content = appContent({ audience: st.aud, allAlerts: true });
        if (!st.showAlert) content.alerts = [];
        return { screen: 'home', audience: st.aud, layout: clone(data), content, colors: colorsFor('production'),
          label: src === 'working' ? (dirty() ? 'unsaved edits, not live' : st.rec.draft ? 'saved draft, not live' : `production version ${st.rec.production}`) : `${src} version ${src === 'demo' ? st.rec.demo : st.rec.production}` };
      }
    });
    Router.setGuard(async () => {
      if (!dirty()) return true;
      const r = await confirmDialog({ title: 'Leave without saving?', body: '<p>Your changes to the layout aren’t saved. If you leave, they’re lost.</p>', confirmLabel: 'Leave page', variant: 'danger', cancelLabel: 'Stay on this page' });
      return r.ok;
    });
    update();
  }

  function update(focus) { renderEditor(focus); pv.update(); }

  /* Save draft and Discard live on the modules card; deploy and publish are in the page's Publishing bar */
  async function saveLayout(b) {
    setBusy(b, true, 'Saving draft');
    try {
      const rec = await ConfigService.saveDraft(st.rec.id, clone(st.working), '');
      st.rec = rec; st.working = clone(base()); update(); st.hist.update(rec.events); renderFeatureBar();
      toast('Draft saved. Deploy or publish it from the Publishing bar.', { kind: 'success' }); announce('Draft saved');
      $('#ed-h').focus();
    } catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
  }
  async function discardLayout() {
    const c = await confirmDialog({ title: 'Discard unsaved changes?', body: `<p>The layout goes back to ${st.rec.draft ? 'your saved draft' : `production v${st.rec.production}`}. These changes are lost:</p>${changeList(describeLayout(base(), st.working))}`, confirmLabel: 'Discard changes', variant: 'danger', cancelLabel: 'Keep editing' });
    if (!c.ok) return;
    st.working = clone(base()); update(); $('#ed-h').focus(); announce('Changes discarded');
  }

  /* The Campaign banner row names the live campaign; ended campaigns hide themselves */
  function moduleDesc(id) {
    const meta = HOME_MODULES[id];
    if (id !== 'campaign') return meta.desc;
    const fits = d => !d.audience || d.audience === 'seg-all' || (st.aud === 'guest' ? d.audience !== 'seg-signedin' : d.audience !== 'seg-guests');
    const live = ConfigService.peekAll('campaign').map(r => dataAt(r, 'production')).filter(d => d && d.enabled !== false && fits(d) && windowStatus(d) === 'active');
    return live.length ? `Live: ${live[0].title} · until ${fmtLocal(live[0].end, false)}. Ended campaigns hide automatically.` : 'No campaign is live, so the module hides itself. Ended campaigns hide automatically.';
  }

  function renderEditor(focus) {
    const ro = !may('saveDraft');
    const n = st.working.modules.length;
    const row = (m, i) => {
      const meta = HOME_MODULES[m.id];
      return `<li class="mod-row${m.on ? '' : ' is-off'}${ro ? ' ro' : ''}" data-id="${m.id}">
        ${ro ? '' : `<button type="button" class="drag-h" data-act="drag" aria-haspopup="menu" aria-expanded="false" aria-label="Reorder ${esc(meta.label)}, position ${i + 1} of ${n}" aria-describedby="drag-help" title="Drag to reorder">${ic('drag_indicator', 20)}</button>`}
        <span class="mod-pos" aria-hidden="true">${i + 1}</span>
        <span class="mod-ic">${ic(meta.icon, 20)}</span>
        <span class="mod-txt"><span class="mod-t" id="mt-${m.id}">${esc(meta.label)}<span class="vh">, position ${i + 1} of ${n}</span></span><span class="mod-d">${esc(moduleDesc(m.id))}${meta.link ? ` <a class="text-link" href="#${meta.link}">Manage</a>` : ''}</span></span>
        ${m.on ? '' : badge('hidden')}
        ${ro ? '' : `<span class="mod-ctl">
          ${switchBtn({ id: `vis-${m.id}`, checked: m.on, label: `Show ${meta.label} on the home screen`, attrs: 'data-act="vis"' })}
        </span>`}
      </li>`;
    };
    $('#editor').innerHTML = card({ title: `${st.aud === 'guest' ? 'Guest' : 'Authenticated'} home modules`, titleId: 'ed-h', actions: ro ? badge('fixed', 'View only') : `<span id="lc-badges">${dirty() ? badge('unsaved') : ''}</span>${dirty() ? btn({ label: 'Discard changes', variant: 'text', size: 'sm', attrs: 'data-hl="discard"' }) : ''}${btn({ label: 'Save draft', icon: 'save', variant: 'primary', size: 'sm', attrs: `data-hl="save" ${dirty() ? '' : 'disabled'}` })}`, body: `
      <h3 class="sub-h" id="pin-h">Pinned to the top</h3>
      <ul class="pin-list" aria-labelledby="pin-h">${HOME_FIXED.map(f => `<li class="pin-row" data-pin="${f.id}"><span class="mod-pos" aria-hidden="true">–</span><span class="mod-ic">${ic(f.icon, 20)}</span>
        <span class="mod-txt"><span class="mod-t">${esc(f.label)}</span><span class="mod-d">${esc(f.desc)}${f.link ? ` <a class="text-link" href="#${f.link}">Manage</a>` : ''}</span></span>${badge('fixed', 'Pinned')}</li>`).join('')}</ul>
      <h3 class="sub-h" id="ord-h" tabindex="-1">Modules, in order</h3>
      <p class="hint-line" id="drag-help">${ro ? 'Hidden modules keep their place but patients don’t see them.' : 'Drag a handle to reorder, or focus it and use the arrow keys. Hidden modules keep their place but patients don’t see them.'}</p>
      ${n ? `<ol class="mod-list" aria-labelledby="ord-h">${st.working.modules.map(row).join('')}</ol>
        <p class="mod-sum">${ic('visibility', 16)}<span>${st.working.modules.filter(m => m.on).length} of ${n} modules shown to ${st.aud === 'guest' ? 'guests' : 'signed-in patients'}</span></p>`
        : emptyState({ icon: 'view_agenda', title: 'No modules on this layout', text: '', level: 4 })}` });
    $('#editor').onclick = editorClick;
    const list = $('.mod-list', main);
    if (list && !ro) wireDrag(list);
    if (focus) {
      const el = focus.id && $(`[data-id="${focus.id}"] [data-act="${focus.act}"]`, main);
      (el || $('#ord-h')).focus();
    }
  }

  /* Move a module to a new index, then re-render with focus back on its handle */
  function moveTo(id, j, how = 'moved') {
    const list = st.working.modules, i = list.findIndex(m => m.id === id);
    j = Math.max(0, Math.min(list.length - 1, j));
    if (i < 0 || i === j) return false;
    const [m] = list.splice(i, 1); list.splice(j, 0, m);
    announce(`${modLabel(id)} ${how} to position ${j + 1} of ${list.length}`);
    update({ id, act: 'drag' });
    return true;
  }

  /* ---------- Move menu: the single-pointer and keyboard alternative to dragging (WCAG 2.5.7) ---------- */
  function closeMenu(returnFocus) {
    const m = $('.drag-menu', main); if (!m) return;
    const h = $('.drag-h', m.closest('.mod-row')); m.remove();
    if (h) { h.setAttribute('aria-expanded', 'false'); if (returnFocus) h.focus(); }
    document.removeEventListener('pointerdown', closeMenu.outside, true);
  }
  function openMenu(h) {
    closeMenu();
    const row = h.closest('.mod-row'), id = row.dataset.id, list = st.working.modules, i = list.findIndex(m => m.id === id), n = list.length;
    const off = { top: i === 0, up: i === 0, down: i === n - 1, bottom: i === n - 1 };
    const menu = document.createElement('div');
    menu.className = 'drag-menu'; menu.setAttribute('role', 'menu'); menu.setAttribute('aria-label', `Move ${modLabel(id)}`);
    menu.innerHTML = MOVES.map(([k, l, g]) => `<button type="button" role="menuitem" tabindex="-1" data-mv="${k}" ${off[k] ? 'aria-disabled="true"' : ''}>${ic(g, 20)}<span>${l}</span></button>`).join('');
    row.appendChild(menu); h.setAttribute('aria-expanded', 'true');
    const items = $$('[role="menuitem"]', menu), first = items.find(b => !b.hasAttribute('aria-disabled')) || items[0];
    first.focus();
    menu.addEventListener('keydown', e => {
      const k = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(k + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
      else if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); items[e.key === 'Home' ? 0 : items.length - 1].focus(); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
      else if (e.key === 'Tab') closeMenu(false);
    });
    menu.addEventListener('click', e => {
      const b = e.target.closest('[data-mv]'); if (!b) return;
      e.stopPropagation();
      if (b.hasAttribute('aria-disabled')) return;
      const to = { top: 0, up: i - 1, down: i + 1, bottom: n - 1 }[b.dataset.mv];
      closeMenu(); moveTo(id, to);
    });
    closeMenu.outside = e => { if (!menu.contains(e.target) && e.target.closest('.drag-h') !== h) closeMenu(); };
    document.addEventListener('pointerdown', closeMenu.outside, true);
    /* Focus leaving the menu (Tab, or a click into the preview frame, which the page never sees) closes it too */
    menu.addEventListener('focusout', e => { if (!menu.contains(e.relatedTarget) && e.relatedTarget !== h) setTimeout(() => { if (menu.isConnected && !menu.contains(document.activeElement)) closeMenu(); }, 0); });
    addEventListener('blur', () => closeMenu(), { once: true });
  }

  /* ---------- Pointer drag (mouse, pen and touch on the handle; mouse anywhere on the row) ---------- */
  function wireDrag(list) {
    list.addEventListener('keydown', e => {
      const h = e.target.closest('.drag-h'); if (!h || !['ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) return;
      e.preventDefault();
      const id = h.closest('.mod-row').dataset.id, i = st.working.modules.findIndex(m => m.id === id);
      moveTo(id, { ArrowUp: i - 1, ArrowDown: i + 1, Home: 0, End: st.working.modules.length - 1 }[e.key]);
    });
    list.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('.drag-menu')) return;
      const onHandle = !!e.target.closest('.drag-h');
      if (!onHandle && (e.pointerType !== 'mouse' || e.target.closest('a,button,input,label,[role="switch"]'))) return;
      const row = e.target.closest('.mod-row'); if (!row) return;
      const startY = e.clientY, grab = e.clientY - row.getBoundingClientRect().top;
      let dragging = false, lastY = e.clientY, raf = 0;
      const rows = () => $$('.mod-row', list);
      const place = () => {
        row.style.transform = '';
        const natural = row.getBoundingClientRect().top;
        row.style.transform = `translateY(${lastY - grab - natural}px)`;
      };
      const reorder = () => {
        const r = row.getBoundingClientRect(), mid = r.top + r.height / 2;
        const prev = row.previousElementSibling, next = row.nextElementSibling;
        let target = null, before = true;
        if (prev && mid < prev.getBoundingClientRect().top + prev.getBoundingClientRect().height / 2) target = prev;
        else if (next && mid > next.getBoundingClientRect().top + next.getBoundingClientRect().height / 2) { target = next; before = false; }
        if (!target) return;
        const first = new Map(rows().filter(x => x !== row).map(x => [x, x.getBoundingClientRect().top]));
        before ? list.insertBefore(row, target) : list.insertBefore(row, target.nextElementSibling);
        rows().forEach((x, k) => { $('.mod-pos', x).textContent = k + 1; });
        first.forEach((top, x) => {          /* FLIP: slide the displaced row into its new place */
          const dy = top - x.getBoundingClientRect().top; if (!dy) return;
          x.style.transition = 'none'; x.style.transform = `translateY(${dy}px)`;
          requestAnimationFrame(() => { x.style.transition = ''; x.style.transform = ''; });
        });
        place();
      };
      const edge = () => {                    /* scroll the page while dragging near the top or bottom edge */
        if (!dragging) return;
        const top = 120, bottom = innerHeight - 60;
        const v = lastY < top ? -(top - lastY) / 6 : lastY > bottom ? (lastY - bottom) / 6 : 0;
        if (v) { scrollBy(0, Math.max(-24, Math.min(24, v))); place(); reorder(); }
        raf = requestAnimationFrame(edge);
      };
      const move = ev => {
        lastY = ev.clientY;
        if (!dragging) {
          if (Math.abs(lastY - startY) < 5) return;
          dragging = true; closeMenu();
          row.classList.add('is-dragging'); list.classList.add('is-sorting');
          try { row.setPointerCapture(e.pointerId); } catch (_) {}
          raf = requestAnimationFrame(edge);
        }
        ev.preventDefault(); place(); reorder();
      };
      const end = ev => {
        removeEventListener('pointermove', move); removeEventListener('pointerup', end); removeEventListener('pointercancel', end);
        cancelAnimationFrame(raf);
        if (!dragging) return;
        row.classList.remove('is-dragging'); list.classList.remove('is-sorting'); row.style.transform = '';
        const id = row.dataset.id, j = rows().indexOf(row);
        list.dataset.justDragged = '1'; setTimeout(() => { delete list.dataset.justDragged; }, 0);
        if (ev.type === 'pointercancel' || !moveTo(id, j)) update({ id, act: 'drag' });
      };
      addEventListener('pointermove', move, { passive: false }); addEventListener('pointerup', end); addEventListener('pointercancel', end);
    });
  }

  function editorClick(e) {
    const hl = e.target.closest('[data-hl]');
    if (hl && !hl.disabled) { if (hl.dataset.hl === 'save') saveLayout(hl); else discardLayout(); return; }
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const rowEl = b.closest('[data-id]'), id = rowEl && rowEl.dataset.id, list = st.working.modules, i = list.findIndex(m => m.id === id);
    const label = modLabel(id);
    if (b.dataset.act === 'vis') { list[i].on = !list[i].on; announce(`${label} ${list[i].on ? 'shown' : 'hidden'}`); update({ id, act: 'vis' }); }
    if (b.dataset.act === 'drag') {
      if ($('#editor .mod-list').dataset.justDragged) return;
      b.getAttribute('aria-expanded') === 'true' ? closeMenu(true) : openMenu(b);
    }
  }

  return { render, leave() { closeMenu(); if (pv) { pv.destroy(); pv = null; } } };
})();

/* ---------- Collections: a list page plus an editor (new and :id) for each item type ----------
   Used by Campaigns, Emergency alerts, Quick links, Services and resources and Audience segments. Each item is a

const fields = sections => sections.flatMap(s => s.fields);
function lastChange(r) { const e = r.events[r.events.length - 1]; return e ? e.at : ''; }

function defineCollection(cfg) {

      featureBar([cfg.type], cfg.title);
      dataTable($('#col-table'), {

        columns: [

            return sub ? `<div class="name-cell${cfg.nameIcon ? ' has-ic' : ''}">${link}<span class="name-sub">${esc(sub)}</span></div>` : link; } },
          ...cfg.columns.map(c => ({ ...c, render: r => c.render(latestData(r), r), sortValue: c.sortValue ? r => c.sortValue(latestData(r)) : undefined })),
          { key: 'status', label: 'Publishing', render: envBadges },
          { key: 'updated', label: 'Last change', sortable: true, sortValue: lastChange, render: r => `<span class="nowrap">${esc(fmtDateTime(lastChange(r)))}</span>` }
        ]
      });
    }
  };
  const latestOn = r => { const d = dataAt(r, 'production'); return d && d.enabled !== false; };

  /* ---- Editor ---- */
  const editor = {
    st: null,
    async render(main, ctx) {
      const isNewRoute = ctx.route.pattern.endsWith('-new');
      const st = this.st = { rec: null, working: null, errors: {}, isNew: isNewRoute, items: null, itemErrors: null, active: 0, open: 0 };
      const crumbs = [[cfg.section, null], [cfg.title, cfg.route]];
      main.innerHTML = `<div class="page ${cfg.cls || ''}" id="ed-page">${loadingState(`Loading the ${cfg.noun}`)}</div>`;
      if (!isNewRoute) {
        try { st.rec = await ConfigService.get(ctx.params.id); }
        catch (err) { $('#ed-page').innerHTML = `${pageHead({ crumbs, title: `${cfg.noun[0].toUpperCase()}${cfg.noun.slice(1)} not found` })}${errorState(err.message)}`; $('[data-retry]').onclick = () => this.render(main, ctx); return; }
        st.working = clone(latestData(st.rec));
      } else { st.items = [cfg.defaults()]; st.itemErrors = [{}]; st.working = st.items[0]; }
      const base = () => st.isNew ? cfg.defaults() : latestData(st.rec);
      const blankJson = JSON.stringify(cfg.defaults());
      const dirty = () => st.isNew ? st.items.some(d => JSON.stringify(d) !== blankJson) : !same(st.working, base());
      const one = cfg.noun, cap = one[0].toUpperCase() + one.slice(1);
      const ro = !can(Session.role(), cfg.area, 'draft');
      const title = () => st.isNew && st.items.length > 1 ? `New ${cfg.title.toLowerCase()} (${st.items.length})` : recName(st.working) || (st.isNew ? cfg.newLabel : cfg.title);
      const secs = () => cfg.sections.map(s => ({ ...s, fields: s.fields.map(f => ro ? { ...f, readonly: true } : f) }));
      $('#ed-page').innerHTML = `${pageHead({ crumbs, title: title(), badges: `<span id="ed-badges">${st.isNew ? badge('unsaved', 'New') : envBadges(st.rec)}</span>`, lede: cfg.editorLede || '' })}
        ${cfg.banner ? cfg.banner : ''}
        <section class="card lc lc-slim" aria-labelledby="lc-h"><div class="card-body" id="lc"></div></section>
        <div class="ed-grid${cfg.preview || cfg.side ? '' : ' single'}">
          <section class="card ${cfg.formCls || ''}" aria-labelledby="form-h"><div class="card-head"><h2 id="form-h">${esc(cfg.formTitle || 'Details')}</h2>${ro ? `<div class="card-actions">${badge('fixed', 'View only')}</div>` : ''}</div>
            <form class="card-body form" id="ed-form" novalidate></form></section>
          ${cfg.preview ? '<aside class="ed-side" id="ed-preview"></aside>' : cfg.side ? '<aside class="ed-side"><section class="card"><div class="card-body" id="ed-side"></div></section></aside>' : ''}
        </div>
        ${st.isNew ? '' : historyCard()}`;
      const form = $('#ed-form');
      /* New items: an accordion, one panel per item, Add more at the bottom. The open panel drives the preview.
         Item 1 keeps the f- ids of the single form; item n uses f<n>-. */
      const pre = i => (i === 0 ? 'f' : `f${i}`);
      const accHead = i => { const d = st.items[i], n = Object.keys(st.itemErrors[i]).length;
        return `${ic('expand_more', 20, 'acc-chev')}<span class="acc-t">${esc(cap)} ${i + 1}</span>${d.title || d.name ? `<span class="acc-name">${esc(d.title || d.name)}</span>` : '<span class="acc-name muted">Untitled</span>'}${n ? `<span class="acc-err">${ic('error', 16)}${plural(n, 'problem')}</span>` : ''}`; };
      const drawPanel = i => { const host = $(`#acc-f${i}`); if (host) host.innerHTML = renderForm(secs(), st.items[i], st.itemErrors[i], pre(i)); };
      const drawAcc = () => {
        form.innerHTML = `<div class="acc">${st.items.map((d, i) => `<section class="acc-item${st.open === i ? ' open' : ''}" data-i="${i}">
            <div class="acc-row"><h3 class="acc-h"><button type="button" class="acc-btn" id="acc-b${i}" data-acc="${i}" aria-expanded="${st.open === i}" aria-controls="acc-p${i}">${accHead(i)}</button></h3>
              ${st.items.length > 1 ? btn({ label: `Remove ${one} ${i + 1}`, icon: 'delete', variant: 'text', size: 'sm', iconOnly: true, attrs: `data-acc-rm="${i}"` }) : ''}</div>
            <div class="acc-panel" id="acc-p${i}" role="region" aria-labelledby="acc-b${i}" ${st.open === i ? '' : 'hidden'}><div id="acc-f${i}"></div></div></section>`).join('')}</div>
          <div class="acc-more">${btn({ label: `Add more`, icon: 'add', variant: 'secondary', attrs: `data-acc-add ${st.items.length >= 10 ? 'disabled title="Up to 10 at a time"' : ''}` })}<span class="muted small">${st.items.length > 1 ? `${plural(st.items.length, one)} will be saved as drafts together.` : `Add more to create several ${cfg.title.toLowerCase()} at once.`}</span></div>`;
        st.items.forEach((d, i) => { drawPanel(i); wireForm($(`#acc-f${i}`), allFields, st.items[i], debounce(() => { onItemChange(i); }, 120), () => drawPanel(i)); });
      };
      const onItemChange = i => {
        const errs = st.itemErrors[i];
        if (Object.keys(errs).length) { const fresh = validateData(allFields(), st.items[i], cfg.validate); const before = Object.keys(errs).length; Object.keys(errs).forEach(k => { if (!fresh[k]) delete errs[k]; });
          if (Object.keys(errs).length !== before) { const id = document.activeElement && document.activeElement.id; drawPanel(i); const el = id && document.getElementById(id); if (el) el.focus(); } }
        const b = $(`#acc-b${i}`); if (b) b.innerHTML = accHead(i);
        refresh();
      };
      const openItem = (i, focusField) => {
        st.open = st.open === i && !focusField ? -1 : i;
        if (st.open >= 0) { st.active = i; st.working = st.items[i]; st.errors = st.itemErrors[i]; }
        $$('.acc-item', form).forEach((el, k) => { const on = k === st.open; el.classList.toggle('open', on); $('.acc-btn', el).setAttribute('aria-expanded', on); $('.acc-panel', el).hidden = !on; });
        refresh();
        if (focusField) { const f = $(`#${pre(i)}-${allFields()[0].key}`); f && f.focus(); }
      };
      const drawForm = () => { if (st.isNew) drawAcc(); else form.innerHTML = renderForm(secs(), st.working, st.errors, 'f'); };
      let pvCard = null;
      const refresh = () => {
        $('#ed-badges').innerHTML = st.isNew ? badge('unsaved', 'New') : `${envBadges(st.rec)}${dirty() ? badge('unsaved') : ''}`;
        $('#page-h').textContent = title();
        lc.render();
        if (pvCard) pvCard.update();
        if (cfg.side) $('#ed-side').innerHTML = cfg.side(st.working, st.rec);
      };
      const validate = () => {
        if (st.isNew) {
          st.items.forEach((d, i) => { st.itemErrors[i] = validateData(allFields(), d, cfg.validate); });
          const bad = st.itemErrors.findIndex(x => Object.keys(x).length);
          if (bad < 0) return true;
          st.open = bad; st.active = bad; st.working = st.items[bad]; st.errors = st.itemErrors[bad]; drawForm(); refresh();
          const n = st.itemErrors.filter(x => Object.keys(x).length).length;
          if (st.items.length > 1) toast(`Fix ${plural(n, one)} before saving. Nothing was saved.`, { kind: 'error', ms: 7000 });
          $(`#${pre(bad)}-errsum`).focus(); return false;
        }
        st.errors = validateData(allFields(), st.working, cfg.validate);
        drawForm();
        if (Object.keys(st.errors).length) { $('#f-errsum').focus(); return false; }
        return true;
      };
      form.addEventListener('submit', e => e.preventDefault());
      if (st.isNew) form.addEventListener('click', e => {
        const h = e.target.closest('[data-acc]'), rm = e.target.closest('[data-acc-rm]'), add = e.target.closest('[data-acc-add]');
        if (h) openItem(+h.dataset.acc);
        if (add && !add.disabled) {
          const last = st.items[st.items.length - 1];
          st.items.push(cfg.defaults()); st.itemErrors.push({});
          st.open = st.items.length - 1; st.active = st.open; st.working = st.items[st.open]; st.errors = st.itemErrors[st.open];
          drawForm(); refresh(); const f = $(`#${pre(st.open)}-${allFields()[0].key}`); f && f.focus();
          announce(`${cap} ${st.items.length} added and opened`); void last;
        }
        if (rm) {
          const i = +rm.dataset.accRm; st.items.splice(i, 1); st.itemErrors.splice(i, 1);
          st.open = Math.min(Math.max(0, i - 1), st.items.length - 1); st.active = st.open; st.working = st.items[st.open]; st.errors = st.itemErrors[st.open];
          drawForm(); refresh(); $(`#acc-b${st.open}`).focus(); announce(`${cap} ${i + 1} removed`);
        }
      });
      drawForm();
      if (!st.isNew) wireForm(form, allFields, st.working, debounce(() => {
        if (Object.keys(st.errors).length) { const fresh = validateData(allFields(), st.working, cfg.validate); Object.keys(st.errors).forEach(k => { if (!fresh[k]) { delete st.errors[k]; const el = $(`[data-field="${k}"]`, form); if (el) { el.classList.remove('has-error'); const er = $('.err', el); if (er) er.hidden = true; $$('[aria-invalid]', el).forEach(x => x.removeAttribute('aria-invalid')); } } }); }
        refresh();
      }, 120), drawForm);
      const describe = (a, b) => cfg.describe ? cfg.describe(a, b) : describeData(a, b, allFields());
      const lc = Lifecycle({
        host: () => $('#lc'), area: cfg.area, noun: cfg.noun,
        getRec: () => st.rec, getWorking: () => clone(st.working), isDirty: dirty, isNew: () => st.isNew, describe, validate,
        newSaveLabel: () => st.items && st.items.length > 1 ? `Save ${plural(st.items.length, one)} as drafts` : 'Save as draft',
        createdMsg: () => st.items && st.items.length > 1 ? `${plural(st.items.length, one)} saved as drafts. Deploy or publish them together from the Publishing bar.` : null,
        /* New items: save every accordion item, in order; positions follow the existing ones */
        create: async () => {
          const recs = [];
          for (const d of st.items) { const data = clone(d); if ('order' in data) data.order = ConfigService.peekAll(cfg.type).length + 1; recs.push(await ConfigService.create(cfg.type, data, 'Created in the Admin')); }
          return recs.length === 1 ? recs[0] : { many: recs };
        },
        onSaved: (rec, kind) => {
          if (kind === 'created') { Router.clearGuard(); Router.go(rec.many ? cfg.route : `${cfg.route}-${rec.id}`); return; }
          st.rec = rec; const fresh = clone(latestData(rec)); Object.keys(st.working).forEach(k => delete st.working[k]); Object.assign(st.working, fresh);
          drawForm(); refresh(); if (hist) hist.update(rec.events); $('#lc-h').focus();
        },
        onDiscard: () => { const fresh = clone(base()); Object.keys(st.working).forEach(k => delete st.working[k]); Object.assign(st.working, fresh); st.errors = {}; drawForm(); refresh(); $('#lc-h').focus(); },
        afterDelete: () => { Router.clearGuard(); Router.go(cfg.route); }
      });
      let hist = null;
      if (!st.isNew) hist = mountHistory({ getRec: () => st.rec, describe, onSaved: (rec) => { st.rec = rec; Object.keys(st.working).forEach(k => delete st.working[k]); Object.assign(st.working, clone(latestData(rec))); drawForm(); refresh(); hist.update(rec.events); } });
      if (cfg.preview) {
        $('#ed-preview').id = 'ed-pv';
        pvCard = mountPreviewCard($('#ed-pv'), {
          title: `Mobile preview of the ${cfg.noun}`,
          sources: () => recSources(st.rec, dirty(), st.isNew),
          payload: src => cfg.preview(src === 'working' ? st.working : dataAt(st.rec, src), st.rec ? st.rec.id : '__new__', src)
        });
      }
      this.pv = pvCard;
      refresh();
      Router.setGuard(async () => {
        if (!dirty() || ro) return true;
        const r = await confirmDialog({ title: 'Leave without saving?', body: `<p>Your changes to “${esc(title())}” aren’t saved. If you leave, they’re lost.</p>`, confirmLabel: 'Leave page', variant: 'danger', cancelLabel: 'Stay on this page' });
        return r.ok;
      });
    },
    leave() { if (this.pv) { this.pv.destroy(); this.pv = null; } }
  };
  BUILT_PAGES[`${cfg.route}-new`] = editor;
  BUILT_PAGES[`${cfg.route}-:id`] = editor;
}

/* ---------- Feature publishing bar ----------
   On each feature's page (Layout, Campaigns, Emergency alerts, Quick links, Featured cards, Audience segments),
   a slim bar moves several of that feature's items at once:
   - Deploy drafts to demo        (saved draft → new version on demo)
   - Publish demo to production   (the version on demo → production)
   - Publish drafts directly      (saved draft → new version on demo and production, skipping the demo check)
   Each batch opens a list of the items it can move, all ticked; untick any to leave them out.
   Only what the signed-in role may do is offered; the rest is named in a note. */
/* EXTRA_GLYPHS: edit_note science public rocket_launch bolt view_agenda campaign warning apps library_books groups */
const FB_ICONS = { homeLayout: 'view_agenda', campaign: 'campaign', alert: 'warning', quickLink: 'apps', featuredCard: 'library_books', segment: 'groups' };
let fbCurrent = null;          /* { types, noun } for the bar on the page now */

function featureBar(types, noun) { fbCurrent = { types, noun }; renderFeatureBar(); }
function fbStages(types) {
  const recs = types.flatMap(t => ConfigService.peekAll(t));
  return { drafts: recs.filter(r => r.draft), demo: recs.filter(r => r.demo && r.demo !== r.production), live: recs.filter(r => r.production) };
}
function renderFeatureBar() {
  const host = $('#hub-pub'); if (!host || !fbCurrent) return;
  const role = Session.role(), st = fbStages(fbCurrent.types), noun = fbCurrent.noun;
  const may = (r, a) => canAct(role, CONFIG_TYPES[r.type].area, a);
  const lists = {
    demo: st.drafts.filter(r => may(r, 'deployDemo')),
    prod: st.demo.filter(r => may(r, 'publish')),
    direct: st.drafts.filter(r => may(r, 'publish'))
  };
  const off = k => (lists[k].length ? '' : 'disabled');
  /* Stage counts stay as data for scripts and tests; they aren't shown */
  Object.assign(host.dataset, { draft: st.drafts.length, demo: st.demo.length, prod: st.live.length });
  host.innerHTML = `<div class="hub-bar">
      <h2 id="hub-pub-h" class="hub-bar-h" tabindex="-1">Publishing</h2>
      <div class="hub-acts">
        ${btn({ label: lists.demo.length ? `Deploy ${plural(lists.demo.length, 'draft')} to demo` : 'Deploy to demo', icon: 'science', variant: 'secondary', size: 'sm', attrs: `data-hub="demo" ${off('demo')}` })}
        ${btn({ label: lists.prod.length ? `Publish ${lists.prod.length} to production` : 'Publish to production', icon: 'rocket_launch', variant: 'primary', size: 'sm', attrs: `data-hub="prod" ${off('prod')}` })}
        ${role === 'marketing' ? '' : btn({ label: lists.direct.length ? `Publish ${plural(lists.direct.length, 'draft')} directly` : 'Publish drafts directly', icon: 'bolt', variant: 'secondary', size: 'sm', attrs: `data-hub="direct" ${off('direct')}` })}
      </div>
    </div>
    ${st.drafts.length > lists.demo.length || st.demo.length > lists.prod.length ? `<p class="role-note">${ic('info', 20)}<span>${[
      st.drafts.length > lists.demo.length ? `${plural(st.drafts.length - lists.demo.length, 'draft')} need${st.drafts.length - lists.demo.length === 1 ? 's' : ''} a role that can deploy it` : '',
      st.demo.length > lists.prod.length ? `${plural(st.demo.length - lists.prod.length, 'item')} on demo need${st.demo.length - lists.prod.length === 1 ? 's' : ''} an Admin or Super Admin to publish` : ''].filter(Boolean).join('. ')}.</span></p>` : ''}`;

  host.onclick = async e => {
    const b = e.target.closest('[data-hub]'); if (!b || b.disabled) return;
    if ($('#main .lc .badge-unsaved')) { toast('Save or discard your changes first. Batches use saved drafts only.', { kind: 'error', ms: 7000 }); return; }
    const kind = b.dataset.hub, list = lists[kind];
    const T = {
      demo: { title: 'Deploy drafts to demo', verb: 'Deploy', lede: 'Each saved draft becomes a new version on demo, for checking on test devices. Production doesn’t change.', confirm: 'Deploy to demo', busy: 'Deploying', done: 'to demo' },
      prod: { title: 'Publish demo to production', verb: 'Publish', lede: 'Each item publishes the version that is on demo now. What patients see in the app changes.', confirm: 'Publish to production', busy: 'Publishing', done: 'to production' },
      direct: { title: 'Publish drafts directly to production', verb: 'Publish', lede: 'Each saved draft goes straight to production as a new version, skipping the check on demo. Use it for urgent or trivial changes.', confirm: 'Publish directly', busy: 'Publishing', done: 'directly to production' }
    }[kind];
    const needComment = kind !== 'demo' && DB.db.settings.requirePublishComment;
    /* Ticked items are tracked while the dialog is open */
    const picked = new Set(list.map(r => r.id));
    const onPick = ev => { const cb = ev.target.closest && ev.target.closest('[data-pick]'); if (cb) { cb.checked ? picked.add(cb.dataset.pick) : picked.delete(cb.dataset.pick); } };
    document.addEventListener('change', onPick, true);
    const c = await confirmDialog({
      title: `${T.title}?`, wide: true,
      body: `${kind === 'direct' ? `<div class="warn-box">${ic('bolt', 20)}<p>This skips demo: the drafts aren’t checked on test devices before patients see them.</p></div>` : ''}<p>${T.lede} Untick any you want to leave out.</p>
        <ul class="hub-confirm fb-pick">${list.map(r => `<li><label class="checkbox fb-row" for="pick-${r.id}"><input type="checkbox" id="pick-${r.id}" data-pick="${r.id}" checked>
          ${ic(FB_ICONS[r.type] || 'description', 20)}<span><b>${esc(r.name)}</b> <span class="muted">${kind === 'prod' ? `v${r.demo} on demo` : `draft saved ${esc(fmtDateTime(r.draft.updatedAt))}`}</span></span></label></li>`).join('')}</ul>`,
      confirmLabel: T.confirm, variant: kind === 'direct' ? 'danger' : 'primary',
      comment: { label: 'Comment', required: needComment, hint: needComment ? 'Required by Administrative settings. Added to each item’s history.' : 'Optional. Added to each item’s history.' }
    });
    document.removeEventListener('change', onPick, true);
    if (!c.ok) return;
    const chosen = list.filter(r => picked.has(r.id));
    if (!chosen.length) { toast('Nothing was selected, so nothing changed.'); return; }
    setBusy(b, true, T.busy);
    let done = 0; const failed = [];
    for (const r of chosen) {
      try { await (kind === 'demo' ? ConfigService.deployToDemo(r.id, c.comment) : kind === 'prod' ? ConfigService.publish(r.id, c.comment) : ConfigService.publishDirect(r.id, c.comment)); done++; }
      catch (err) { failed.push(`${r.name}: ${err.message}`); }
    }
    Router.clearGuard();
    toast(`${T.verb === 'Deploy' ? 'Deployed' : 'Published'} ${plural(done, 'item')} ${T.done}.${failed.length ? ` ${failed.length} didn’t: ${failed.join('; ')}` : ''}`, { kind: failed.length ? 'error' : 'success', ms: failed.length ? 9000 : 5000 });
    Router.refresh();
    const h = $('#hub-pub-h'); if (h) h.focus();
  };
}

/* Modal form: resolves the edited data, or null when cancelled */
function formModal({ title, sections, data, validate, confirmLabel = 'Save', note = '' }) {
  return new Promise(resolve => {
    const d = clone(data); let errors = {}, done = false;
    const fs = () => fields(sections);
    openModal({
      title, wide: true,
      body: `${note}<div id="mf"></div>`,
      actions: `${btn({ label: 'Cancel', variant: 'text', attrs: 'data-close' })}${btn({ label: confirmLabel, variant: 'primary', type: 'submit' })}`,
      onOpen(dlg, close) {
        const host = $('#mf', dlg);
        const draw = () => { host.innerHTML = renderForm(sections, d, errors, 'm'); };
        draw();
        wireForm(host, fs, d, () => {}, draw);
        const first = $('input:not([type=hidden]),select,textarea', host); first && first.focus();
        $('form', dlg).addEventListener('submit', e => {
          e.preventDefault();
          errors = validateData(fs(), d, validate);
          if (Object.keys(errors).length) { draw(); $('#m-errsum', dlg).focus(); return; }
          done = true; resolve(d); close();
        });
        dlg.addEventListener('close', () => { if (!done) resolve(null); });
      }
    });
  });
}

/* Editable rows (search tables, locations) on top of dataTable */
function rowsEditor(host, { rows, noun, caption, columns, sections, blank, validate, ro, onChange, searchText, rowTitle, extraActions, onExtraClick }) {
  const t = dataTable(host, {
    id: 'rows', caption, noun, rows, searchPlaceholder: `Search ${caption.toLowerCase()}`,
    searchText, actions: ro ? '' : btn({ label: `Add ${noun}`, icon: 'add', variant: 'primary', attrs: 'data-row-add' }),
    empty: { icon: 'table_rows', title: `No ${noun}s yet`, text: ro ? '' : `Add the first ${noun}.` },
    columns: [...columns, { key: 'acts', label: 'Actions', hideLabel: true, render: r => ro ? '' : `<span class="row-acts">${extraActions ? extraActions(r) : ''}${btn({ label: `Edit ${rowTitle(r)}`, icon: 'edit', variant: 'text', iconOnly: true, attrs: `data-row-edit="${r.id}"` })}${btn({ label: `Delete ${rowTitle(r)}`, icon: 'delete', variant: 'text', iconOnly: true, attrs: `data-row-del="${r.id}"` })}</span>` }]
  });
  host.onclick = async e => {
    if (onExtraClick) onExtraClick(e);
    const add = e.target.closest('[data-row-add]'), ed = e.target.closest('[data-row-edit]'), del = e.target.closest('[data-row-del]');
    if (add) {
      const d = await formModal({ title: `Add ${noun}`, sections, data: blank(), validate: v => validate(v, null), confirmLabel: `Add ${noun}` });
      if (d) { rows.push({ ...d, id: uid('r') }); t.update(rows); onChange(); toast(`${noun[0].toUpperCase()}${noun.slice(1)} added to your working copy. Save the draft to keep it.`); announce(`${noun} added`); }
      add.focus();
    }
    if (ed) {
      const i = rows.findIndex(r => r.id === ed.dataset.rowEdit);
      const d = await formModal({ title: `Edit ${noun}`, sections, data: rows[i], validate: v => validate(v, rows[i].id) });
      if (d) { rows[i] = d; t.update(rows); onChange(); announce(`${noun} updated`); }
      const again = $(`[data-row-edit="${rows[i].id}"]`, host); again && again.focus();
    }
    if (del) {
      const i = rows.findIndex(r => r.id === del.dataset.rowDel), gone = rows[i];
      rows.splice(i, 1); t.update(rows); onChange();
      toast(`Deleted “${rowTitle(gone)}” from your working copy.`, { action: 'Undo', onAction: () => { rows.splice(i, 0, gone); t.update(rows); onChange(); announce('Restored'); } });
      $('[data-row-add]', host) && $('[data-row-add]', host).focus();
    }
  };
  return t;
}

const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function contrast(a, b) {
  if (!/^#[0-9a-f]{6}$/i.test(a) || !/^#[0-9a-f]{6}$/i.test(b)) return 0;

  const x = L(a), y = L(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05);
}

            if (!c.ok) return;

        if (c.ok) run(() => NotificationService.schedule(n.id, c.comment), n.timing === 'now' ? 'Sending' : 'Scheduling', r => r.status === 'sent' ? 'Sent (simulated).' : `Scheduled for ${fmtLocal(r.scheduledAt)}.`);
      }
      if (k === 'cancel') { const c = await confirmDialog({ title: 'Cancel this notification?', body: '<p>It won’t be sent. You can duplicate it later to send a new version.</p>', confirmLabel: 'Cancel notification', variant: 'danger', cancelLabel: 'Keep it', comment: { label: 'Reason', required: true } }); if (c.ok) run(() => NotificationService.cancel(n.id, c.comment), 'Cancelling', 'Notification cancelled.'); }
      if (k === 'dup') run(() => NotificationService.duplicate(n.id), 'Duplicating', 'Duplicated as a new draft.', r => `notifications-${r.id}`);

    };
    Router.setGuard(async () => {
      if (!dirty() || !editable()) return true;

      return r.ok;
    });

  leave() { if (this.pv) { this.pv.destroy(); this.pv = null; } }
};

    draw();

      e.preventDefault();

    });
    Router.setGuard(async () => {
      if (!dirty()) return true;
      const r = await confirmDialog({ title: 'Leave without saving?', body: '<p>Your changes to this user aren’t saved.</p>', confirmLabel: 'Leave page', variant: 'danger', cancelLabel: 'Stay on this page' });
      return r.ok;
    });
  }
};

/* ===== src/pages/wayfinding.js ===== */
/* ---------- Wayfinding: manual Gozio JSON export → upload → validate → demo → production ----------
   Uploading and publishing are separate actions. No direct Gozio connection. The file format checked here is a
   placeholder until UTSW shares a real Gozio export (§8). Files are read in the browser and never leave it. */
const WF_STATUS = { production: ['production', 'Production'], demo: ['demo', 'Demo'], validated: ['draft', 'Validated – not published'], superseded: ['hidden', 'Superseded'], retired: ['hidden', 'Retired'] };
const SAMPLE_GOZIO = () => JSON.stringify({
  schemaVersion: '1.0 (sample)', exportedAt: '2026-10-30T09:00:00-05:00',
  venue: { id: 'utsw-main', name: 'UT Southwestern main campus (sample)' },
  buildings: [
    { id: 'cuh', name: 'Clements University Hospital', floors: [
      { id: 'cuh-1', level: 1, name: 'Level 1', destinations: [{ id: 'cuh-lobby', name: 'Main lobby', category: 'Entrance' }, { id: 'cuh-pharm', name: 'Outpatient pharmacy', category: 'Pharmacy' }, { id: 'cuh-cafe', name: 'Café', category: 'Food' }] },
      { id: 'cuh-2', level: 2, name: 'Level 2', destinations: [{ id: 'cuh-img', name: 'Imaging', category: 'Imaging' }, { id: 'cuh-lab', name: 'Lab draw station', category: 'Lab' }] }] },
    { id: 'zale', name: 'Zale Lipshy Pavilion', floors: [
      { id: 'zale-1', level: 1, name: 'Level 1', destinations: [{ id: 'zale-east', name: 'East entrance', category: 'Entrance' }, { id: 'zale-info', name: 'Information desk', category: 'Information' }] }] },
    { id: 'obb', name: 'Sample Outpatient Building', floors: [
      { id: 'obb-3', level: 3, name: 'Level 3', destinations: [{ id: 'obb-derm', name: 'Dermatology clinic', category: 'Clinic' }, { id: 'obb-ortho', name: 'Orthopaedics clinic', category: 'Clinic' }] },
      { id: 'obb-4', level: 4, name: 'Level 4', destinations: [{ id: 'obb-store', category: 'Other' }] }] }
  ]
}, null, 2);
const SAMPLE_BAD = () => SAMPLE_GOZIO().replace('"level": 2', '"level": "2"').replace('"obb-ortho"', '"obb-derm"').replace('"Food"', '"Snacks"');

BUILT_PAGES.wayfinding = {
  async render(main) {
    const canPub = can(Session.role(), 'wayfinding', 'publish');
    main.innerHTML = `<div class="page">${pageHead({ crumbs: [['Wayfinding', null]], title: 'Wayfinding files', lede: 'Indoor maps come from a JSON file exported by hand from Gozio. Upload and validate a file, check it on demo, then publish it to production.' })}<div id="wf">${loadingState('Loading wayfinding')}</div></div>`;
    let w;
    const st = this.st = { file: null };
    const load = async () => {
      try { w = await WayfindingService.get(); } catch (err) { $('#wf').innerHTML = errorState(err.message); $('[data-retry]').onclick = load; return; }
      draw();
    };
    const vOf = v => w.versions.find(x => x.version === v);
    const pendingVal = () => w.versions.filter(x => x.status === 'validated').slice(-1)[0];
    const draw = () => {
      const prod = vOf(w.production), demo = vOf(w.demo), val = pendingVal();
      const stage = val ? 1 : w.demo !== w.production ? 2 : 3;
      const stepState = i => i < stage ? 'done' : i === stage && stage < 3 ? 'current' : i === 3 && stage === 3 ? 'done' : 'todo';
      $('#wf').innerHTML = `
        <section class="card" aria-labelledby="wf-cur-h"><div class="card-head"><h2 id="wf-cur-h" tabindex="-1">Current version</h2><div class="card-actions">${badge('mock')}</div></div><div class="card-body">
          <p class="lc-status wf-status">${val ? badge('draft', `v${val.version} validated`) : ''}${demo && w.demo !== w.production ? badge('demo', `Demo v${demo.version}`) : ''}${prod ? badge('production', `Production v${prod.version}`) : '<span class="muted">Nothing published</span>'}<span>${val ? 'Ready for demo.' : w.demo !== w.production ? 'Demo is ahead of production.' : 'Demo and production match.'}</span></p>
          <div class="wf-cur">${prod ? `<dl class="facts cols"><dt>Published version</dt><dd>v${prod.version} · ${esc(prod.fileName)}</dd><dt>Last updated</dt><dd>${esc(fmtDateTime((w.history.filter(h => h.version === prod.version && h.environment === 'production').slice(-1)[0] || prod).at))}</dd>
            <dt>Contents</dt><dd>${prod.buildings} buildings · ${prod.floors} floors · ${prod.destinations.toLocaleString('en-US')} destinations</dd><dt>Uploaded by</dt><dd>${esc(UserService.name(prod.by))}${prod.comment ? ` – “${esc(prod.comment)}”` : ''}</dd></dl>` : ''}</div>
          ${canPub ? `<div class="lc-actions">
            ${val ? btn({ label: `Publish v${val.version} to demo`, icon: 'science', variant: 'primary', attrs: `data-w="demo" data-v="${val.version}"` }) : ''}
            ${w.demo !== w.production ? btn({ label: `Publish demo v${w.demo} to production`, icon: 'public', variant: val ? 'secondary' : 'primary', attrs: `data-w="prod" data-v="${w.demo}"` }) : ''}
          </div>` : `<p class="role-note">${ic('info', 20)}<span>Your role can view wayfinding. Admins and Super Admins upload and publish.</span></p>`}
        </div></section>
        ${canPub ? `<section class="card" aria-labelledby="wf-up-h"><div class="card-head"><h2 id="wf-up-h" tabindex="-1">Upload a file</h2></div><div class="card-body">
          <div class="drop" id="wf-drop">
            ${ic('upload_file', 32)}
            <p class="drop-t">Drag a Gozio JSON export here, or</p>
            <label class="btn btn-primary" for="wf-file">${ic('folder_open', 20)}<span class="lbl">Choose a file</span></label>
            <input type="file" id="wf-file" accept=".json,application/json" class="vh">
            <p class="hint">JSON only, up to 10 MB. The file is checked in your browser and isn’t sent anywhere.</p>
            <p class="drop-or">No export to hand? ${btn({ label: 'Use a valid sample file', variant: 'text', attrs: 'data-sample="ok"' })} ${btn({ label: 'Use a sample with errors', variant: 'text', attrs: 'data-sample="bad"' })}</p>
          </div>
          <div id="wf-progress"></div><div id="wf-result" tabindex="-1"></div>
        </div></section>` : ''}
        <section class="card" aria-labelledby="wf-v-h"><div class="card-head"><h2 id="wf-v-h" tabindex="-1">Published versions</h2><div class="card-actions">${badge('pending', 'Rollback supported – assumed, pending confirmation')}</div></div><div class="card-body" id="wf-versions"></div></section>
        <section class="card" aria-labelledby="wf-h-h"><div class="card-head"><h2 id="wf-h-h">Publication history</h2></div><div class="card-body" id="wf-hist"></div></section>`;
      dataTable($('#wf-versions'), {
        id: 'wfv', caption: 'Wayfinding versions', noun: 'version', rows: w.versions, defaultSort: { key: 'version', dir: 'desc' }, searchText: v => `${v.fileName} ${v.comment}`,
        columns: [
          { key: 'version', label: 'Version', sortable: true, render: v => `v${v.version}`, cls: 'num' },
          { key: 'fileName', label: 'File', render: v => `<span class="mono">${esc(v.fileName)}</span><br><span class="muted">${v.sizeKb.toLocaleString('en-US')} KB</span>` },
          { key: 'contents', label: 'Contents', render: v => `${v.buildings} buildings · ${v.floors} floors · ${v.destinations.toLocaleString('en-US')} destinations${v.warnings ? `<br>${badge('pending', `${v.warnings} warnings`)}` : ''}` },
          { key: 'status', label: 'Status', render: v => badge(...(WF_STATUS[v.status] || ['hidden', v.status])) },
          { key: 'at', label: 'Uploaded', sortable: true, render: v => `<span class="nowrap">${esc(fmtDateTime(v.at))}</span><br><span class="muted">${esc(UserService.name(v.by))}</span>` },
          { key: 'acts', label: 'Actions', hideLabel: true, render: v => canPub && v.version !== w.production && ['retired', 'demo'].includes(v.status) ? btn({ label: `Roll back to v${v.version}`, icon: 'history', variant: 'text', attrs: `data-w="rollback" data-v="${v.version}"` }) : '' }]
      });
      dataTable($('#wf-hist'), {
        id: 'wfh', caption: 'Publication history', noun: 'event', rows: w.history, defaultSort: { key: 'at', dir: 'desc' }, searchText: h => `${h.action} ${h.comment} ${UserService.name(h.by)}`,
        filters: [{ key: 'env', label: 'Environment', options: [['draft', 'Upload'], ['demo', 'Demo'], ['production', 'Production']], match: (h, v) => h.environment === v }],
        columns: [
          { key: 'at', label: 'When', sortable: true, render: h => `<span class="nowrap">${esc(fmtDateTime(h.at))}</span>` },
          { key: 'action', label: 'Event', render: h => esc(h.action) },
          { key: 'version', label: 'Version', render: h => `v${h.version}`, cls: 'num' },
          { key: 'environment', label: 'Environment', render: h => h.environment === 'draft' ? badge('draft', 'Upload') : badge(h.environment) },
          { key: 'by', label: 'By', render: h => esc(UserService.name(h.by)) },
          { key: 'comment', label: 'Comment', render: h => h.comment ? esc(h.comment) : '<span class="muted">None</span>', cls: 'wrap' }]
      });
      if (canPub) wireUpload();
    };
    const publish = async (b, env, v) => {
      const ver = vOf(v);
      const c = await confirmDialog({ title: env === 'demo' ? `Publish v${v} to demo?` : `Publish v${v} to production?`, body: env === 'demo'
        ? `<p>Demo devices get ${esc(ver.fileName)} (${ver.destinations.toLocaleString('en-US')} destinations). Production stays on v${w.production}.</p>`
        : `<div class="warn-box">${ic('public', 20)}<p>Patients get these indoor maps in the app. Walk a few routes on demo first. Publishing is simulated in the prototype.</p></div>`,
        confirmLabel: env === 'demo' ? 'Publish to demo' : 'Publish to production', comment: { label: 'Comment', hint: env === 'demo' ? 'Optional' : 'Optional, for example which routes you checked' } });
      if (!c.ok) return;
      setBusy(b, true, 'Publishing');
      try { w = await WayfindingService.publish(v, env, c.comment); toast(`v${v} is on ${env}.`, { kind: 'success' }); draw(); $('#wf-cur-h').focus(); }
      catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
    };
    const wireUpload = () => {
      const drop = $('#wf-drop'), input = $('#wf-file');
      const take = (name, size, text) => process(name, size, text);
      input.onchange = () => { const f = input.files[0]; if (!f) return; if (f.size > 10 * 1024 * 1024) { showResult({ ok: false, errors: [`${f.name} is ${(f.size / 1048576).toFixed(1)} MB. The limit is 10 MB.`], warnings: [] }, f.name, f.size); return; } const r = new FileReader(); r.onload = () => take(f.name, f.size, r.result); r.readAsText(f); };
      drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
      drop.ondragleave = () => drop.classList.remove('over');
      drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (!f) return; if (!/\.json$/i.test(f.name)) { showResult({ ok: false, errors: [`${f.name} isn’t a JSON file. Export the wayfinding data from Gozio as JSON.`], warnings: [] }, f.name, f.size); return; } const r = new FileReader(); r.onload = () => take(f.name, f.size, r.result); r.readAsText(f); };
      drop.onclick = e => { const s = e.target.closest('[data-sample]'); if (!s) return; const text = s.dataset.sample === 'ok' ? SAMPLE_GOZIO() : SAMPLE_BAD(); take(s.dataset.sample === 'ok' ? 'gozio-export-sample.json' : 'gozio-export-with-errors.json', text.length, text); };
    };
    const process = async (name, size, text) => {
      const prog = $('#wf-progress'); $('#wf-result').innerHTML = '';
      prog.innerHTML = `<div class="upl"><p><span class="mono">${esc(name)}</span> · ${(size / 1024).toFixed(1)} KB</p><div class="bar" role="progressbar" aria-label="Uploading ${esc(name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div><p class="hint" id="wf-pt">Uploading…</p></div>`;
      const bar = $('.bar', prog);
      for (let p = 0; p <= 100; p += 20) { bar.setAttribute('aria-valuenow', p); $('span', bar).style.width = `${p}%`; await wait(140); }
      $('#wf-pt').textContent = 'Checking the file…';
      try { const res = await WayfindingService.validate(text); prog.innerHTML = ''; showResult(res, name, size); }
      catch (err) { prog.innerHTML = ''; showResult({ ok: false, errors: [err.message], warnings: [] }, name, size); }
    };
    const showResult = (res, name, size) => {
      st.file = res.ok ? { name, size, res } : null;
      const out = $('#wf-result');
      out.innerHTML = res.ok
        ? `<div class="val ok"><h3>${ic('check_circle', 24, 'f1')} ${esc(name)} passed validation</h3>
            <p>${res.stats.buildings} buildings · ${res.stats.floors} floors · ${res.stats.destinations} destinations${res.stats.venue ? ` · ${esc(res.stats.venue)}` : ''}</p>
            ${res.warnings.length ? `<details open><summary>${plural(res.warnings.length, 'warning')} – you can still continue</summary><ul>${res.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
            <div class="field"><label for="wf-comment">Comment for the history</label><input class="input" id="wf-comment" type="text" maxlength="120" placeholder="For example, what changed in this export"></div>
            <div class="lc-actions">${btn({ label: 'Discard file', variant: 'text', attrs: 'data-up="discard"' })}${btn({ label: 'Save as a validated version', icon: 'save', variant: 'primary', attrs: 'data-up="save"' })}</div>
            <p class="muted">Saving doesn’t publish anything. Publish to demo is a separate step.</p></div>`
        : `<div class="val bad"><h3>${ic('error', 24, 'f1')} ${esc(name)} didn’t pass validation</h3><p>Fix these in Gozio, export again and upload the new file. Nothing was saved.</p>
            <ul class="val-errs">${res.errors.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${res.moreErrors ? `<p>And ${res.moreErrors} more.</p>` : ''}
            ${res.warnings && res.warnings.length ? `<details><summary>${plural(res.warnings.length, 'warning')}</summary><ul>${res.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}</div>`;
      out.focus();
      announce(res.ok ? 'File passed validation' : `File failed validation with ${plural(res.errors.length, 'error')}`);
      out.onclick = async e => {
        const b = e.target.closest('[data-up]'); if (!b) return;
        if (b.dataset.up === 'discard') { out.innerHTML = ''; st.file = null; $('#wf-file').value = ''; $('[for="wf-file"]').focus(); return; }
        setBusy(b, true, 'Saving');
        try { w = await WayfindingService.upload(name, Math.max(1, Math.round(size / 1024)), { ...res.stats, warnings: res.warnings.length }, $('#wf-comment').value.trim()); toast('Saved as a validated version. Publish it to demo when you’re ready.', { kind: 'success' }); draw(); $('#wf-cur-h').focus(); }
        catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
      };
    };
    $('#wf').addEventListener('click', async e => {
      const b = e.target.closest('[data-w]'); if (!b) return;
      const v = +b.dataset.v;
      if (b.dataset.w === 'demo') publish(b, 'demo', v);
      if (b.dataset.w === 'prod') publish(b, 'production', v);
      if (b.dataset.w === 'rollback') {
        const c = await confirmDialog({ title: `Roll back to v${v}?`, body: `<p>Demo and production go back to ${esc(vOf(v).fileName)}. v${w.production} stays in the history.</p>`, confirmLabel: `Roll back to v${v}`, variant: 'danger', comment: { label: 'Reason for the rollback', required: true } });
        if (!c.ok) return;
        setBusy(b, true, 'Rolling back');
        try { w = await WayfindingService.rollback(v, c.comment); toast(`Rolled back. Production is v${v}.`, { kind: 'success' }); draw(); $('#wf-v-h').focus(); }
        catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
      }
    });
    load();
  }
};

/* ---------- Dashboard ----------
   Headline numbers, then what patients see now (a live phone and the facts behind it) beside what's coming up
   and recent activity. Metrics are sample data; the rest reads the mock services.
   Numbers count up and cards ease in – both skipped under reduced motion. */
/* EXTRA_GLYPHS: trending_flat event_available bolt favorite */
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const localDay = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const longDate = s => { const dt = localDay(s); return `${WEEKDAYS[dt.getUTCDay()]}, ${AP_MONTHS[dt.getUTCMonth()]} ${dt.getUTCDate()}`; };
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return `${plural(mins, 'minute')} ago`;
  if (mins < 60 * 24) return `${plural(Math.round(mins / 60), 'hour')} ago`;
  if (mins < 60 * 48) return 'Yesterday';
  if (mins < 60 * 24 * 7) return `${Math.round(mins / 1440)} days ago`;
  return fmtDate(iso).replace(/, \d{4}$/, '');
}
/* Change versus the previous period: an arrow and a word as well as color */
function delta(m, onBlue = false) {
  const pct = m.change * 100;
  const cls = onBlue ? 'delta on-blue' : 'delta';
  if (Math.abs(pct) < .05) return `<span class="${cls} flat">${ic('trending_flat', 16)}No change</span>`;
  const up = pct > 0, good = m.lowerBetter ? !up : up;
  return `<span class="${cls} ${good ? 'good' : 'bad'}">${ic(up ? 'trending_up' : 'trending_down', 16)}${up ? '+' : '−'}${Math.abs(pct).toFixed(1)}%<span class="vh">, ${good ? 'better' : 'worse'} than the previous 30 days</span></span>`;
}
/* Audit actions read as sentences after the person's name */
const VERBS = { 'Draft saved': 'saved a draft of', 'Review requested': 'requested a review of', 'Created as draft': 'created', 'Draft discarded': 'discarded the draft of', 'Deleted draft': 'deleted', 'Changes requested': 'requested changes to', 'User invited': 'invited', 'Role changed': 'changed the role of', 'User updated': 'updated', 'Profile updated': 'updated their profile:', 'User deactivated': 'deactivated', 'User reactivated': 'reactivated', 'User deleted': 'deleted the account of', 'Invitation resent': 'resent the invitation to', 'Notification created': 'created the notification', 'Notification edited': 'edited the notification', 'Notification scheduled': 'scheduled', 'Notification cancelled': 'cancelled', 'Notification duplicated': 'duplicated', 'Notification deleted': 'deleted the notification', 'Wayfinding file uploaded': 'uploaded the wayfinding file', 'Administrative settings changed': 'changed', 'Integration check run (simulated)': 'ran a check on' };
const activityVerb = a => VERBS[a] || a.charAt(0).toLowerCase() + a.slice(1);
/* Each person keeps one avatar style */
const AVATAR_TONES = ['tone-a', 'tone-b', 'tone-c'];
const avatarTone = id => AVATAR_TONES[[...String(id)].reduce((s, c) => s + c.charCodeAt(0), 0) % AVATAR_TONES.length];

/* Count up to each [data-count] value */
function countUp(root) {
  $$('[data-count]', root).forEach(el => {
    const end = +el.dataset.count, unit = el.dataset.unit;
    if (reducedMotion()) { el.textContent = fmtNum(end, unit); return; }
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtNum(unit === 'count' ? Math.round(end * e) : end * e, unit);
      if (k < 1 && el.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

const TYPE_LABEL = t => (CONFIG_TYPES[t] || { label: { user: 'User', notification: 'Notification', wayfinding: 'Wayfinding', search: 'Search', settings: 'Settings', platform: 'Platform' }[t] || t }).label;
function diffTable(before, after) {
  const flat = (o, p = '') => !o || typeof o !== 'object' ? { [p || 'value']: o } : Object.entries(o).reduce((a, [k, v]) => Object.assign(a, v && typeof v === 'object' && !Array.isArray(v) ? flat(v, p ? `${p}.${k}` : k) : { [p ? `${p}.${k}` : k]: v }), {});
  const A = flat(before || {}), B = flat(after || {});
  const keys = [...new Set([...Object.keys(A), ...Object.keys(B)])].filter(k => !same(A[k], B[k]));
  const show = v => v == null ? '<span class="muted">–</span>' : esc(Array.isArray(v) ? (v.length && typeof v[0] === 'object' ? `${v.length} items` : v.join(', ')) : String(v));
  if (!before && !after) return '<p class="muted">No before-and-after detail is recorded for this action.</p>';
  if (!keys.length) return '<p class="muted">No field-level differences.</p>';
  return `<div class="tbl-wrap" tabindex="0" role="region" aria-label="Before and after"><table class="tbl diff"><caption class="vh">Before and after values</caption><thead><tr><th scope="col">Field</th><th scope="col">Before</th><th scope="col">After</th></tr></thead>
    <tbody>${keys.slice(0, 40).map(k => `<tr><th scope="row">${esc(k)}</th><td class="wrap">${show(A[k])}</td><td class="wrap">${show(B[k])}</td></tr>`).join('')}</tbody></table></div>${keys.length > 40 ? `<p class="muted">And ${keys.length - 40} more fields.</p>` : ''}`;
}
