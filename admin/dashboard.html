urn { overlay: onboarding() + eula };\n    if (e.loginPromptVisible && e.loginPromptType === 'choice') return { overlay: welcome() + eula };\n    return { home: true, overlay: eula };\n  }\n  function push() {\n    const p = C.push;\n    if (p.delivery === 'inbox') return { title: 'Inbox', view: `<div class=\"res-body\"><div class=\"card list\">${row({ g: 'inbox', title: p.title || 'Notification title', sub: `${p.body || ''}`.slice(0, 90), end: '<span class=\"new-pill\">New</span>' })}${row({ g: 'inbox', title: 'Saturday hours at Lakeview Primary Care', sub: 'Open 8 a.m. to noon starting Oct. 17.' })}</div></div>` };\n    return { overlay: `<div class=\"lock\"><p class=\"lock-time\">9:41</p><p class=\"lock-date\">${esc(p.when || 'Thursday, Oct. 30')}</p>\n      <div class=\"push\"><div class=\"push-top\"><img src=\"${APP_ICON}\" alt=\"\"><span>UTSW MyCare</span><span class=\"when\">now</span></div>\n        <p class=\"push-t\">${esc(p.title || 'Notification title')}</p><p class=\"push-b\">${esc(p.body || '')}</p>${p.art ? `<div class=\"push-img\">${art(p.art)}</div>` : ''}</div>\n      <p class=\"push-note\">${p.delivery === 'push+inbox' ? 'Also saved in the app\u2019s Inbox' : 'Push only'}</p></div>`, dark: true };\n  }\n  function location() {\n    const l = C.location;\n    return { title: 'Locations', tab: -1, view: `<div class=\"res-body\"><article class=\"card loc-card\"><div class=\"loc-map\" aria-hidden=\"true\"><i></i></div><div class=\"loc-body\"><h2>${esc(l.name)}</h2>\n      <p class=\"loc-row\">${ico('place', 20)}<span>${esc(l.type)}</span></p>\n      ${l.message ? `<p class=\"loc-tip\">${ico('info', 20)}<span>${esc(l.message)}</span></p>` : ''}\n      ${l.parking ? `<p class=\"loc-row\">${ico('parking', 20)}<span>${esc(l.parking)}</span></p>` : ''}\n      ${l.indoor ? `<button class=\"btn btn-primary\" type=\"button\">${ico('indoor', 20)}<span>Indoor directions</span></button>` : ''}</div></article></div>` };\n  }\n\n  /* ---------- Chrome ---------- */\n  const TABS = [['Home', 'home'], ['Find Care', 'findCare'], ['Search', 'search'], ['Wayfinding', 'wayfinding'], ['Favorites', 'favorites']];\n  const phone = document.getElementById('phone');\n  function appbar(title) {\n    const menuBtn = `<button class=\"icon-btn ab-menu\" type=\"button\" aria-label=\"Menu, 2 new in Inbox\">${ico('menu')}<i class=\"ab-dot\" aria-hidden=\"true\"></i></button>`;\n    const bar = document.getElementById('appbar');\n    bar.className = `appbar${title ? '' : ' home'}`;\n    bar.innerHTML = title ? `<h1 class=\"ttl\">${esc(title)}</h1>${menuBtn}`\n      : `<img class=\"logo\" alt=\"UTSW MyCare\" src=\"${LOGO}\"><span class=\"sp\"></span>${guest() ? `<button class=\"ab-sign\" type=\"button\">${ico('signIn', 20)}<span>Sign in</span></button>` : ''}${menuBtn}`;\n  }\n  function tabs(active) {\n    document.getElementById('tabbar').innerHTML = TABS.map(([l, g], i) => `<button class=\"tab\" type=\"button\"${i === active ? ' aria-current=\"page\"' : ''}><span class=\"pill\">${ico(g)}</span><span>${l}</span></button>`).join('');\n  }\n  /* Global colors: only the approved set maps onto app tokens */\n  function applyColors(c) {\n    const st = phone.style;\n    ['--c-blue', '--c-mid-blue', '--c-muted-blue', '--c-bg'].forEach(k => st.removeProperty(k));\n    if (!c) return;\n    st.setProperty('--c-blue', c.primary); st.setProperty('--c-mid-blue', c.secondary); st.setProperty('--c-muted-blue', c.tertiary); st.setProperty('--c-bg', c.background);\n  }\n\n  function render(msg) {\n    C = msg.content; MSG = msg;\n    applyColors(msg.colors);\n    const screen = msg.screen || 'home';\n    const view = document.getElementById('view'), overlay = document.getElementById('overlay');\n    let out = { home: true };\n    if (screen === 'drawer') out = { home: true, overlay: menu() };\n    else if (screen === 'entry') out = entry();\n    else if (screen === 'push') out = push();\n    else if (screen === 'location') out = location();\n    phone.classList.toggle('st-dark', !!out.dark);\n    appbar(out.home ? '' : out.title || '');\n    view.innerHTML = out.home ? home() : out.view || '';\n    overlay.innerHTML = out.overlay || '';\n    tabs(out.home ? 0 : out.tab != null ? out.tab : -1);\n    view.scrollTop = 0;\n    if (out.home && msg.focus) { const el = view.querySelector(`[data-m=\"${msg.focus}\"]`); if (el) view.scrollTop = Math.max(0, el.offsetTop - 96); }\n    view.setAttribute('aria-label', `Mobile preview: ${msg.label}. Scroll with the arrow keys.`);\n    nbsp(phone);\n    phone.querySelectorAll('button').forEach(b => { b.tabIndex = -1; });\n  }\n\n  window.addEventListener('message', e => {\n    if (e.source !== window.parent || !e.data || e.data.type !== 'mycare-preview') return;\n    render(e.data);\n    window.parent.postMessage({ type: 'mycare-preview-rendered' }, '*');\n  });\n  const markIcons = () => document.documentElement.classList.add('ms-ready');\n  if (document.fonts && document.fonts.load) {\n    document.fonts.load('24px \"Material Symbols Rounded\"', 'home').then(f => { if (f.length) markIcons(); }).catch(() => {});\n    setTimeout(markIcons, 3000);\n  } else markIcons();\n  window.parent.postMessage({ type: 'mycare-preview-ready' }, '*');\n})();\n";

/* ---------- Utilities: DOM, escaping, icons, dates, device storage, live announcements ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = v => JSON.parse(JSON.stringify(v));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
let idSeq = 0;
const uid = p => `${p}-${Date.now().toString(36)}${(idSeq++).toString(36)}`;

/* Material Symbols Rounded only. build.py collects every glyph named as ic('…') or icon: '…' into the font subset. */
const ic = (name, size = 24, extra = '') => `<span class="ms${size === 24 ? '' : ' s' + size}${extra ? ' ' + extra : ''}" aria-hidden="true">${name}</span>`;

/* AP style dates and times in Central Time (Dallas): Oct. 30, 2026, 9:41 a.m. CT */
const AP_MONTHS = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
const TZ = 'America/Chicago';
function tzParts(iso) {
  const d = new Date(iso);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true })
    .formatToParts(d).map(x => [x.type, x.value]));
  return { y: p.year, m: +p.month - 1, d: p.day, h: +p.hour, min: p.minute, pm: /p/i.test(p.dayPeriod) };
}
function apTime(p) {
  if (p.min === '00' && p.h === 12) return p.pm ? 'noon' : 'midnight';
  return `${p.h}${p.min === '00' ? '' : ':' + p.min} ${p.pm ? 'p.m.' : 'a.m.'}`;
}
const fmtDate = iso => { const p = tzParts(iso); return `${AP_MONTHS[p.m]} ${p.d}, ${p.y}`; };
const fmtDateTime = iso => { const p = tzParts(iso); return `${AP_MONTHS[p.m]} ${p.d}, ${p.y}, ${apTime(p)} CT`; };

/* Device storage: always wrapped, the page works without it (private windows, previews) */
const STORE_KEY = 'utsw-admin-mock-v1';
const store = {
  read() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || null; } catch (e) { return null; } },
  write(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep working in memory */ } },
  clear() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } }
};

/* Screen reader announcements (polite) */
function announce(msg) {
  const el = $('#sr-live'); if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 30);
}
const pluralize = w => /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : /(s|x|ch|sh)$/.test(w) ? w + 'es' : w + 's';
const plural = (n, one, many = pluralize(one)) => `${n} ${n === 1 ? one : many}`;

/* Local Central Time date-times stored as 'YYYY-MM-DDTHH:MM' (what a datetime-local field gives) */
function nowLocal() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
function fmtLocal(s, withYear = true) {
  if (!s) return '–';
  const [d, tm = '00:00'] = s.split('T'), [y, m, day] = d.split('-').map(Number), [h, min] = tm.split(':').map(Number);
  const p = { h: h % 12 || 12, min: String(min).padStart(2, '0'), pm: h >= 12 };
  return `${AP_MONTHS[m - 1]} ${day}${withYear ? `, ${y}` : ''}, ${h === 12 && !min ? 'noon' : h === 0 && !min ? 'midnight' : apTime(p)}`;
}
const fmtDay = s => { const [y, m, d] = s.split('-').map(Number); return `${AP_MONTHS[m - 1]} ${d}`; };
/* Scheduled content status from its window */
function windowStatus(d) {
  if (d.enabled === false) return 'off';
  const n = nowLocal();
  if (d.start && n < d.start) return 'upcoming';
  if (d.end && n > d.end) return 'ended';
  return 'active';
}
const fmtNum = (v, unit) => unit === 'count' ? Math.round(v).toLocaleString('en-US') : unit === '%' ? `${v.toFixed(1)}%` : unit === 's' ? `${v.toFixed(2)} s` : unit === 'ms' ? `${Math.round(v)} ms` : String(v);
const debounce = (fn, ms = 150) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const ACTION_NEEDS = { saveDraft: 'draft', requestReview: 'draft', deployDemo: 'demo', requestChanges: 'publish', publish: 'publish', rollback: 'publish' };

/* ==========================================================================================
   MOCK SERVICE LAYER. Async interfaces with simulated latency and optional simulated errors.
   No network requests are made; there are no endpoints or credentials anywhere in this app.
   A real backend replaces the bodies of these functions; screens only call the interfaces.
   ========================================================================================== */
const MockSettings = { latency: [160, 380], simulateErrors: false };
class ServiceError extends Error {}
const wait = ms => new Promise(r => setTimeout(r, ms));
const SCHEMA = 7;
let DB = null;
function loadDb() {
  const saved = store.read();
  DB = saved && saved.db && saved.db.schema === SCHEMA ? saved : { db: seedDb(), session: saved && saved.session && saved.db && saved.db.schema === SCHEMA ? saved.session : null, prefs: (saved && saved.prefs) || {} };
  MockSettings.simulateErrors = !!DB.prefs.simulateErrors;
}
const saveDb = () => store.write(DB);
function resetMockData() {
  DB = { db: seedDb(), session: DB.session, prefs: {} };
  MockSettings.simulateErrors = false;
  saveDb();
}
async function mockCall(name, fn) {
  const [a, b] = MockSettings.latency;
  await wait(a + Math.random() * (b - a));
  if (MockSettings.simulateErrors) throw new ServiceError(`The mock ${name} service returned a simulated error. Turn off “Simulate service errors” in the user menu, then try again.`);
  const out = fn();
  saveDb();
  return clone(out);
}
const actor = () => DB.session && DB.session.userId;
const nowIso = () => new Date().toISOString();
function needs(area, level) {
  const role = DB.session && DB.session.role;
  if (!role || !can(role, area, level)) throw new ServiceError('Your role does not allow this action.');
}
function audit(action, target, { targetId = null, targetType = null, environment = null, version = null, comment = '', before = null, after = null } = {}) {
  DB.db.audit.push({ id: uid('au'), at: nowIso(), by: actor(), action, target, targetId, targetType, environment, version, comment, before: before && clone(before), after: after && clone(after) });
}

/* What each environment holds */
const dataAt = (r, env) => env === 'draft' ? r.draft && r.draft.data : env === 'demo' ? r.demo && r.versions[r.demo].data : r.production && r.versions[r.production].data;
const latestData = r => dataAt(r, 'draft') || dataAt(r, 'demo') || dataAt(r, 'production');

function rec(id) { const r = DB.db.records[id]; if (!r) throw new ServiceError('That item no longer exists. It may have been deleted.'); return r; }
function guard(r, action) {
  const role = DB.session && DB.session.role;

}
function logEvent(r, action, environment, version, comment, before, after) {
  const e = { id: uid('ev'), action, environment, version, by: actor(), at: nowIso(), comment: comment || '' };

const ConfigService = {
  get: id => mockCall('configuration', () => rec(id)),

  peek: id => DB.db.records[id] ? clone(DB.db.records[id]) : null, /* synchronous read for previews and pickers */
  peekAll: type => clone(Object.values(DB.db.records).filter(r => r.type === type)),
  create: (type, data, comment) => mockCall('configuration', () => {
    const area = CONFIG_TYPES[type].area; needs(area, 'draft');
    const id = `${type.replace(/[A-Z]/g, c => '-' + c.toLowerCase())}-${Date.now().toString(36)}`;
    const r = { id, type, name: recName(data) || CONFIG_TYPES[type].label, versions: {}, production: null, demo: null, draft: null, review: null, nextVersion: 1, events: [] };
    r.draft = { data: clone(data), updatedBy: actor(), updatedAt: nowIso(), comment: comment || '', baseVersion: null };

    if (recName(data)) r.name = recName(data);

/* ---------- Notifications: draft → scheduled or sent; cancel while scheduled ---------- */
const NOTE_STATUS = { draft: 'Draft', scheduled: 'Scheduled', sent: 'Sent', cancelled: 'Cancelled' };
/* Each save of a notification keeps a version (its message and delivery fields) */
const NOTE_KEYS = ['title', 'description', 'image', 'imageAlt', 'videoUrl', 'destination', 'sendTo', 'timing', 'scheduledAt'];
const noteSnap = n => Object.fromEntries(NOTE_KEYS.map(k => [k, clone(n[k])]));
const noteVersions = n => { if (!n.versions) n.versions = [{ version: 1, data: noteSnap(n), at: n.createdAt, by: n.createdBy, comment: 'Created' }]; return n.versions; };
const NotificationService = {
  list: () => mockCall('notifications', () => { DB.db.notifications.forEach(noteVersions); return DB.db.notifications; }),
  get: id => mockCall('notifications', () => { const n = DB.db.notifications.find(x => x.id === id); if (!n) throw new ServiceError('That notification no longer exists.'); noteVersions(n); return n; }),
  restore: (id, version) => mockCall('notifications', () => {
    needs('notifications', 'draft');
    const n = DB.db.notifications.find(x => x.id === id), ver = noteVersions(n).find(v => v.version === version);
    if (!ver) throw new ServiceError(`Version ${version} doesn’t exist.`);
    if (n.status === 'draft') {
      Object.assign(n, clone(ver.data), { updatedAt: nowIso() });
      n.versions.push({ version: n.versions.length + 1, data: noteSnap(n), at: nowIso(), by: actor(), comment: `Restored v${version}` });
      audit('Notification restored', n.title, { targetId: id, targetType: 'notification', comment: `Version ${version}` });
      return n;
    }
    /* Sent, scheduled or cancelled: the old version comes back as a new draft */
    const c = { ...clone(n), ...clone(ver.data), id: uid('n'), title: `${ver.data.title} (copy)`, status: 'draft', createdBy: actor(), createdAt: nowIso(), updatedAt: nowIso(), sentAt: null, stats: null };
    c.versions = [{ version: 1, data: noteSnap(c), at: nowIso(), by: actor(), comment: `From v${version} of “${n.title}”` }];
    DB.db.notifications.unshift(c);
    audit('Notification duplicated', c.title, { targetId: c.id, targetType: 'notification', comment: `From version ${version}` });
    return c;
  }),
  save: (id, data) => mockCall('notifications', () => {
    needs('notifications', 'draft');
    if (!id) {
      const n = { ...clone(data), id: uid('n'), status: 'draft', createdBy: actor(), createdAt: nowIso(), updatedAt: nowIso(), sentAt: null, stats: null };
      n.versions = [{ version: 1, data: noteSnap(n), at: nowIso(), by: actor(), comment: 'Created' }];
      DB.db.notifications.unshift(n);
      audit('Notification created', n.title, { targetId: n.id, targetType: 'notification', after: data });
      return n;
    }
    const n = DB.db.notifications.find(x => x.id === id);
    if (n.status !== 'draft') throw new ServiceError(`${NOTE_STATUS[n.status]} notifications can’t be edited. Duplicate it instead.`);
    const before = clone(n);
    Object.assign(n, clone(data), { status: 'draft', updatedAt: nowIso() });
    noteVersions(n).push({ version: n.versions.length + 1, data: noteSnap(n), at: nowIso(), by: actor(), comment: 'Edited' });
    audit('Notification edited', n.title, { targetId: id, targetType: 'notification', before, after: data });
    return n;
  }),
  schedule: (id, comment) => mockCall('notifications', () => {
    needs('notifications', 'publish');
    const n = DB.db.notifications.find(x => x.id === id);
    if (n.status !== 'draft') throw new ServiceError('Only drafts can be scheduled or sent.');
    if (n.timing === 'now') { n.status = 'sent'; n.sentAt = nowIso(); n.stats = { delivered: 0, opened: 0, actions: 0 }; }
    else n.status = 'scheduled';
    n.updatedAt = nowIso();
    audit(n.status === 'sent' ? 'Notification sent (simulated)' : 'Notification scheduled', n.title, { targetId: id, targetType: 'notification', comment });
    return n;
  }),
  cancel: (id, comment) => mockCall('notifications', () => {
    needs('notifications', 'publish');
    const n = DB.db.notifications.find(x => x.id === id);
    if (n.status !== 'scheduled') throw new ServiceError('Only scheduled notifications can be cancelled.');
    n.status = 'cancelled'; n.updatedAt = nowIso();
    audit('Notification cancelled', n.title, { targetId: id, targetType: 'notification', comment });
    return n;
  }),
  duplicate: id => mockCall('notifications', () => {
    needs('notifications', 'draft');
    const src = DB.db.notifications.find(x => x.id === id);
    const n = { ...clone(src), id: uid('n'), title: `${src.title} (copy)`, status: 'draft', createdBy: actor(), createdAt: nowIso(), updatedAt: nowIso(), sentAt: null, stats: null };
    n.versions = [{ version: 1, data: noteSnap(n), at: nowIso(), by: actor(), comment: `Duplicated from “${src.title}”` }];
    DB.db.notifications.unshift(n);
    audit('Notification duplicated', n.title, { targetId: n.id, targetType: 'notification' });
    return n;
  }),
  remove: id => mockCall('notifications', () => {
    needs('notifications', 'draft');

    if (n.status !== 'draft' && n.status !== 'cancelled') throw new ServiceError('Only drafts and cancelled notifications can be deleted.');

    audit('Notification deleted', n.title, { targetId: id, targetType: 'notification', before: n });
    return { id };
  })
};

/* ---------- Wayfinding: manual Gozio JSON. The schema checked here is a placeholder until UTSW shares a real export. ---------- */
const WAY_CATEGORIES = ['Clinic', 'Imaging', 'Lab', 'Pharmacy', 'Restroom', 'Elevator', 'Entrance', 'Parking', 'Food', 'Information', 'Other'];
function validateGozio(text) {
  const errors = [], warnings = [];
  let doc;
  try { doc = JSON.parse(text); }
  catch (e) {
    const m = /position (\d+)/.exec(e.message); let where = '';
    if (m) { const pos = +m[1], before = text.slice(0, pos); where = ` at line ${before.split('\n').length}, column ${pos - before.lastIndexOf('\n')}`; }
    return { ok: false, errors: [`The file isn’t valid JSON${where}. Export the file again from Gozio and upload the new copy.`], warnings, stats: null };
  }
  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) return { ok: false, errors: ['The file must contain one JSON object with venue and buildings.'], warnings, stats: null };
  if (!doc.schemaVersion) errors.push('Missing “schemaVersion”.');
  if (!doc.venue || !doc.venue.id || !doc.venue.name) errors.push('Missing “venue” with an id and a name.');
  if (!Array.isArray(doc.buildings) || !doc.buildings.length) errors.push('“buildings” must be a list with at least one building.');
  let floors = 0, dests = 0; const ids = new Set();
  (Array.isArray(doc.buildings) ? doc.buildings : []).forEach((b, bi) => {
    const bn = b && b.name ? `“${b.name}”` : `Building ${bi + 1}`;
    if (!b || !b.id || !b.name) errors.push(`${bn} needs an id and a name.`);
    if (!Array.isArray(b && b.floors) || !b.floors.length) { errors.push(`${bn} has no floors.`); return; }
    b.floors.forEach((f, fi) => {
      floors++;
      const fn = `${bn}, floor ${f && f.name ? `“${f.name}”` : fi + 1}`;
      if (typeof (f && f.level) !== 'number') errors.push(`${fn} needs a numeric “level”.`);
      if (!Array.isArray(f && f.destinations) || !f.destinations.length) { warnings.push(`${fn} has no destinations.`); return; }
      f.destinations.forEach((d, di) => {
        dests++;
        if (!d || !d.id) errors.push(`${fn}, destination ${di + 1} has no id.`);
        else if (ids.has(d.id)) errors.push(`Destination id “${d.id}” is used more than once.`);
        else ids.add(d.id);
        if (d && !d.name) warnings.push(`${fn}: destination “${d.id}” has no name, so patients can’t search for it.`);
        if (d && d.category && !WAY_CATEGORIES.includes(d.category)) errors.push(`${fn}: “${d.category}” isn’t a known category for “${d.id}”.`);
      });
    });
  });
  return { ok: !errors.length, errors: errors.slice(0, 50), moreErrors: Math.max(0, errors.length - 50), warnings, stats: { buildings: (doc.buildings || []).length, floors, destinations: dests, venue: doc.venue && doc.venue.name } };
}

/* ---------- Analytics: deterministic mock series (clearly labeled in the UI) ---------- */
function prng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
const ANALYTICS_END = '2026-10-30';
function series(key, days, base, spread, trend = 0, weekly = 0) {
  const r = prng(key), out = [], end = new Date(ANALYTICS_END + 'T12:00:00Z');
  for (let i = 179; i >= 0; i--) {
    const d = new Date(end.getTime() - i * 864e5), dow = d.getUTCDay();
    const v = base + trend * (179 - i) + (r() - .5) * spread + (dow === 0 || dow === 6 ? -weekly : weekly / 3);
    out.push({ x: d.toISOString().slice(0, 10), y: v });
  }
  return out.slice(-days);
}

    return DB.db.settings;
  })
};

/* ===== src/app/session.js ===== */
/* ---------- Simulated SSO session ----------
   SIMULATED: no identity provider is connected. The real flow (SAML or OIDC, MFA, timeout) is pending UTSW (HANDOVER §8).
   There is never a username and password form. */
/* Idle timeout from Administrative settings (30 minutes by default – placeholder until UTSW confirms it) */
const SESSION_IDLE_MS = () => ((DB.db.settings && DB.db.settings.sessionTimeout) || 30) * 60 * 1000;
const Session = {
  current: () => DB.session,
  /* Step 1: the person picks a sample account on the simulated identity-provider screen */
  pending: null,
  begin(userId) { this.pending = userId; },
  /* Step 2: simulated MFA approval starts the session */
  complete() {
    const u = UserService.byId(this.pending); if (!u) return false;
    DB.session = { userId: u.id, role: u.role, startedAt: Date.now(), lastActive: Date.now() };
    this.pending = null; saveDb(); return true;
  },
  touch() { if (DB.session) { DB.session.lastActive = Date.now(); } },
  expired() { return !!DB.session && Date.now() - DB.session.lastActive > SESSION_IDLE_MS(); },
  /* Prototype only: lets reviewers see each role without three sign-ins */
  switchRole(role) { if (DB.session && ROLES[role]) { DB.session.role = role; saveDb(); } },
  end() { DB.session = null; saveDb(); },
  role: () => DB.session && DB.session.role,
  user: () => DB.session && UserService.byId(DB.session.userId)
};

/* ==========================================================================================

/* ---------- Button ---------- variants: primary, secondary, tonal, text, danger; size: md (44) or lg (48) */
function btn({ label, icon, variant = 'secondary', size = 'md', attrs = '', iconOnly = false, type = 'button' }) {
  const cls = `btn btn-${variant}${size === 'lg' ? ' btn-lg' : size === 'sm' ? ' btn-sm' : ''}${iconOnly ? ' btn-icon' : ''}`;
  return `<button type="${type}" class="${cls}" ${iconOnly ? `aria-label="${esc(label)}" title="${esc(label)}"` : ''} ${attrs}>${icon ? ic(icon, 20) : ''}${iconOnly ? '' : `<span class="lbl">${esc(label)}</span>`}<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></button>`;
}
/* Busy state while a mock service call runs */
function setBusy(button, busy, busyLabel) {
  if (!button) return;
  button.classList.toggle('loading', busy);
  button.setAttribute('aria-busy', busy);
  if (busy) { button.dataset.label = button.getAttribute('aria-label') || ''; button.setAttribute('aria-label', busyLabel || 'Working'); }
  else if (button.dataset.label) button.setAttribute('aria-label', button.dataset.label); else button.removeAttribute('aria-label');
}

/* ---------- Status badge: always an icon and a word, never color alone ---------- */
const BADGES = {
  draft: ['edit_note', 'Draft'], demo: ['science', 'Demo'], production: ['public', 'Production'],
  unsaved: ['pending', 'Unsaved changes'], review: ['rate_review', 'Review requested'], changes: ['undo', 'Changes requested'],
  mock: ['database', 'Mock data'], simulated: ['sync_alt', 'Simulated'], planned: ['schedule', 'Planned'],
  visible: ['visibility', 'Visible'], hidden: ['visibility_off', 'Hidden'], fixed: ['lock', 'Fixed'],
  pending: ['help', 'Pending confirmation'], error: ['error', 'Error'], live: ['check_circle', 'Live']
};
function badge(kind, text) {
  const [icon, word] = BADGES[kind] || ['info', kind];
  return `<span class="badge badge-${kind}">${ic(icon, 16)}<span>${esc(text || word)}</span></span>`;
}

/* ---------- Form field: label, hint and error tied by aria-describedby ---------- */
function field({ id, label, type = 'text', value = '', hint = '', error = '', required = false, textarea = false, rows = 3, attrs = '', options = null }) {
  const desc = [hint && `${id}-hint`, error && `${id}-err`].filter(Boolean).join(' ');
  const common = `id="${id}" name="${id}" ${required ? 'required aria-required="true"' : ''} ${error ? 'aria-invalid="true"' : ''} ${desc ? `aria-describedby="${desc}"` : ''} ${attrs}`;
  let control;
  if (textarea) control = `<textarea class="input" rows="${rows}" ${common}>${esc(value)}</textarea>`;
  else if (options) control = `<select class="input" ${common}>${options.map(([v, l]) => `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else control = `<input class="input" type="${type}" value="${esc(value)}" ${common}>`;
  return `<div class="field${error ? ' has-error' : ''}">
    <label for="${id}">${esc(label)}${required ? ' <span class="req">(required)</span>' : ''}</label>
    ${hint ? `<p class="hint" id="${id}-hint">${esc(hint)}</p>` : ''}
    ${control}
    <p class="err" id="${id}-err" ${error ? '' : 'hidden'}>${ic('error', 16)}<span>${esc(error)}</span></p>
  </div>`;
}
function setFieldError(input, msg) {
  const f = input.closest('.field'), err = f.querySelector('.err');
  f.classList.toggle('has-error', !!msg);
  err.hidden = !msg; err.querySelector('span').textContent = msg || '';
  if (msg) {
    input.setAttribute('aria-invalid', 'true');
    const ids = new Set((input.getAttribute('aria-describedby') || '').split(' ').filter(Boolean)); ids.add(err.id);
    input.setAttribute('aria-describedby', [...ids].join(' '));
  } else input.removeAttribute('aria-invalid');
}

/* ---------- Switch (role="switch") and checkbox ---------- */
const switchBtn = ({ id, checked, label, labelledby, attrs = '' }) =>
  `<button type="button" class="switch" role="switch" id="${id}" aria-checked="${!!checked}" ${labelledby ? `aria-labelledby="${labelledby}"` : `aria-label="${esc(label)}"`} ${attrs}><span class="track" aria-hidden="true"></span></button>`;
const checkbox = ({ id, label, checked, attrs = '' }) =>
  `<label class="check" for="${id}"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${attrs}><span class="box" aria-hidden="true">${ic('check', 16)}</span><span>${esc(label)}</span></label>`;

/* ---------- Segmented control (radio group) ---------- */
function segmented({ id, label, options, value }) {
  return `<div class="seg" role="radiogroup" aria-label="${esc(label)}" id="${id}">${options.map(([v, l]) =>
    `<button type="button" role="radio" data-value="${esc(v)}" aria-checked="${v === value}" tabindex="${v === value ? 0 : -1}">${esc(l)}</button>`).join('')}</div>`;
}
/* Arrow keys move the selection, as radios do */
function wireSegmented(root, onChange) {
  const opts = $$('[role="radio"]', root);
  const pick = (b, focus) => {
    opts.forEach(o => { const on = o === b; o.setAttribute('aria-checked', on); o.tabIndex = on ? 0 : -1; });
    if (focus) b.focus(); onChange(b.dataset.value);

      if (d) { e.preventDefault(); pick(opts[(i + d + opts.length) % opts.length], true); }

/* ---------- Card ---------- */

/* ---------- Stepper: ordered steps with a state word each ---------- */
function stepper(steps, label) {

/* ---------- Table with search, a filter panel, sortable headers and pagination (8 rows a page) ----------

      ${filters.length ? `<div class="tbl-fwrap">

  };

      const aria = c.sortable ? `aria-sort="${sorted ? (st.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}"` : '';

      pager.innerHTML = `<span class="pg-info">${st.page * size + 1}–${st.page * size + rows.length} of ${all.length}</span>
        <span class="pg-btns">${btn({ label: 'Previous page', icon: 'chevron_left', variant: 'text', iconOnly: true, attrs: `data-page="prev" ${st.page === 0 ? 'disabled' : ''}` })}

    const filtered = st.q || Object.values(st.filters).some(v => v && v.length);

  function chips() {

  const panel = () => $(`#${id}-fp`, host);
  function openPanel() {
    const fp = panel(); if (!fp) return;
    filters.forEach(f => { const s = $(`#${id}-f-${f.key}`, host); [...s.options].forEach(o => { o.selected = (st.filters[f.key] || []).includes(o.value); }); ddSync(s); });
    fp.hidden = false; $(`#${id}-fbtn`, host).setAttribute('aria-expanded', 'true');
    ($('.dd-btn', fp) || $('select', fp)).focus();
    document.addEventListener('pointerdown', openPanel.outside = e => { if (!host.isConnected) return document.removeEventListener('pointerdown', openPanel.outside, true); if (e.target.closest('.dd-list')) return; if (!e.target.closest('.tbl-fwrap') || !host.contains(e.target)) closePanel(false); }, true);
  }
  function closePanel(focusBtn) {
    const fp = panel(); if (!fp || fp.hidden) return;
    if (ddOpen && fp.contains(ddOpen.sel)) ddClose();
    fp.hidden = true; $(`#${id}-fbtn`, host).setAttribute('aria-expanded', 'false');
    document.removeEventListener('pointerdown', openPanel.outside, true);
    if (focusBtn) $(`#${id}-fbtn`, host).focus();

    st.filters = next; st.page = 0; body();
    const n = Object.values(next).reduce((a, v) => a + (v ? v.length : 0), 0), count = $(`#${id}-count`, host).textContent;
    announce(`${n ? plural(n, 'filter') + ' applied' : 'Filters cleared'}. ${count}.`);
  }

    if (e.key === 'Escape' && panel() && !panel().hidden) { e.preventDefault(); e.stopPropagation(); closePanel(true); }

    if (e.target.closest(`#${id}-fbtn`)) { panel().hidden ? openPanel() : closePanel(true); return; }
    const fp = e.target.closest('[data-fp]');
    if (fp) {
      if (fp.dataset.fp === 'clear') { $$('[data-filter]', host).forEach(s => { [...s.options].forEach(o => { o.selected = false; }); ddSync(s); }); applyFilters({}); }
      else applyFilters(Object.fromEntries($$('[data-filter]', host).map(s => [s.dataset.filter, [...s.selectedOptions].map(o => o.value)]).filter(([, v]) => v.length)));

      applyFilters(next);
      const left = $$('[data-chip]', host); (left[Math.min(i, left.length - 1)] || $(`#${id}-fbtn`, host)).focus(); return;
    }
    const pg = e.target.closest('[data-page]');
    if (pg && !pg.disabled) {
      const v = pg.dataset.page;
      st.page = v === 'prev' ? st.page - 1 : v === 'next' ? st.page + 1 : +v; body();
      const again = $(`[data-page="${v}"]`, host) || $(`[data-page="${st.page}"]`, host);
      (again && !again.disabled ? again : $(`[data-page="${st.page}"]`, host)).focus();
      announce(`Page ${st.page + 1}`); return;
    }
    const s = e.target.closest('[data-sort]');
    if (s) {
      const k = s.dataset.sort;
      st.sort = { key: k, dir: st.sort && st.sort.key === k && st.sort.dir === 'asc' ? 'desc' : 'asc' };
      head(); body(); $(`[data-sort="${k}"]`, thead).focus();
      announce(`Sorted by ${s.textContent.trim()}, ${st.sort.dir === 'asc' ? 'ascending' : 'descending'}`);
    }
    if (e.target.closest('[data-clear]')) {
      st.q = ''; st.filters = {}; st.page = 0; $(`#${id}-q`, host).value = ''; $$('[data-filter]', host).forEach(s => { [...s.options].forEach(o => { o.selected = false; }); ddSync(s); });
      body(); $(`#${id}-q`, host).focus();
    }
  });
  if (cfg.initialFilters) Object.entries(cfg.initialFilters).forEach(([k, v]) => { st.filters[k] = [].concat(v); });
  head(); body();
  return { update(rows) { st.rows = rows; body(); } };
}

/* ---------- Modal and confirm dialog (native <dialog>: inert background, Escape closes) ---------- */
function openModal({ title, body, actions, onOpen, wide = false }) {
  const from = document.activeElement;
  const d = document.createElement('dialog');
  d.className = `modal${wide ? ' wide' : ''}`;
  d.setAttribute('aria-labelledby', 'modal-h');
  d.innerHTML = `<form method="dialog" class="modal-form" novalidate>
    <div class="modal-head"><h2 id="modal-h" tabindex="-1">${esc(title)}</h2>${btn({ label: 'Close', icon: 'close', variant: 'text', iconOnly: true, attrs: 'data-close' })}</div>
    <div class="modal-body">${body}</div>
    <div class="modal-actions">${actions}</div>
  </form>`;
  document.body.appendChild(d);
  const close = () => { if (d.open) d.close(); };
  d.addEventListener('close', () => { d.remove(); if (from && from.isConnected) from.focus(); });
  d.addEventListener('click', e => { if (e.target.closest('[data-close]')) { e.preventDefault(); close(); } });
  d.showModal();
  (d.querySelector('[autofocus]') || d.querySelector('#modal-h')).focus();
  if (onOpen) onOpen(d, close);
  return { el: d, close };
}
/* Resolves { ok, comment }. A required comment is validated before confirming. */

    const commentField = comment ? field({ id: 'cf-comment', label: comment.label, hint: comment.hint || '', required: !!comment.required, textarea: true, rows: 3, value: comment.value || '' }) : '';
    const m = openModal({
      title, wide,
      body: `${body}${commentField}`,
      actions: `${btn({ label: cancelLabel, variant: 'text', attrs: 'data-close' })}${btn({ label: confirmLabel, variant, type: 'submit', attrs: 'data-confirm' })}`,
      onOpen(d, close) {
        d.querySelector('form').addEventListener('submit', e => {

/* ---------- Toast: polite live region, optional action (Undo), 5 seconds ---------- */

function lineChart(host, { points, unit, label, height = 220, zeroBase = false }) {

  host.innerHTML = `<div class="chart-plot" tabindex="0" role="img" aria-label="${esc(label)}: ${points.length} days, from ${fmtNum(points[0].y, unit)} on ${fmtDay(points[0].x)} to ${fmtNum(points[points.length - 1].y, unit)} on ${fmtDay(points[points.length - 1].x)}. Use the left and right arrow keys to read each day."></div>
    <div class="chart-tip" hidden></div>
    <details class="chart-table"><summary>Show data table</summary><div class="tbl-wrap" tabindex="0" role="region" aria-label="${esc(label)} data"><table class="tbl"><caption class="vh">${esc(label)}</caption><thead><tr><th scope="col">Date</th><th scope="col" class="num">${esc(label)}</th></tr></thead>
      <tbody>${points.map(p => `<tr><th scope="row">${fmtDay(p.x)}</th><td class="num">${fmtNum(p.y, unit)}</td></tr>`).join('')}</tbody></table></div></details>`;

    const ys = points.map(p => p.y);

    const xt = [...new Set([0, Math.round((points.length - 1) / 3), Math.round(2 * (points.length - 1) / 3), points.length - 1])];
    const last = points[points.length - 1];

      ${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" class="c-grid"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end" class="c-axis">${tickFmt(t, unit)}</text>`).join('')}

   PREVIEW_CSS, PREVIEW_JS and PREVIEW_HTML are inlined by build.py from src/preview/. */
function previewDoc() {
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap">
<link rel="stylesheet" href="${ICON_FONT_URL}">
<style>${PREVIEW_CSS}</style></head><body>${PREVIEW_HTML}<script>${PREVIEW_JS}<\/script></body></html>`;

/* Mounts a phone frame in host; returns { render(payload) } */
function mountPreview(host, { title }) {
  host.innerHTML = `<div class="pv-device"><div class="pv-screen"><iframe class="pv-frame" sandbox="allow-scripts" title="${esc(title)}"></iframe></div></div>`;
  const frame = $('iframe', host);

    /* Scale the whole phone (never below a readable size); the editor card grows if it is still shorter */
    const avail = left.offsetHeight - chrome;
    const s = Math.max(Math.min(max, .5), Math.min(max, avail / 844));
    /* Editors (with accordions that open and close) keep a steady phone; only the layout page scales it */
    if (scales && s < max - .002) phone.style.setProperty('--s', s.toFixed(3));

    const short = aside.offsetHeight - left.offsetHeight;
    if (short > 1 && tail) tail.style.minHeight = `${tail.offsetHeight + short}px`;
  };

  ro.observe(left); const ctl = $('.pv-ctl', aside); if (ctl) ro.observe(ctl);

}
/* Standard source options for a record being edited */
function recSources(rec, dirty, isNew) {

    isNew || dirty ? badge('unsaved', 'Unsaved edits – not live') : rec && rec.draft ? badge('draft', 'Saved draft – not live') : badge('production', `Same as production v${rec.production}`)]];
  if (rec && rec.demo && (dirty || rec.draft || rec.demo !== rec.production)) out.push(['demo', 'Demo', badge('demo', `Demo v${rec.demo} – demo environment only`)]);
  if (rec && rec.production && (dirty || rec.draft || rec.demo !== rec.production)) out.push(['production', 'Production', badge('production', `Production v${rec.production} – what patients see`)]);
  return out;
}

/* ===== src/ui/lifecycle.js ===== */
/* EXTRA_GLYPHS: bolt */
/* ---------- Publishing workflow panel (Draft → Demo → Production), shared by every config editor ----------
   opts: { host, area, noun, getRec, getWorking, isDirty, isNew, describe(from, to), validate(), onSaved(rec, kind), onDiscard(), afterDelete() } */
const changeList = items => items.length
  ? `<ul class="changes">${items.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`
  : '<p class="muted">No differences.</p>';

function Lifecycle(opts) {
  const role = () => Session.role();
  const may = a => canAct(role(), opts.area, a);
  const demoAhead = r => !!r && !!r.demo && r.demo !== r.production;
  const lastEvent = (r, env, version) => [...r.events].reverse().find(e => e.environment === env && (version == null || e.version === version));
  const when = e => e ? `${fmtDateTime(e.at)} by ${esc(UserService.name(e.by))}` : '';
  let reason = {};

  function render() {
    const r = opts.getRec(), d = opts.isDirty(), isNew = opts.isNew && opts.isNew();
    const host = opts.host();
    if (!host) return;
    const stage = d || isNew || (r && r.draft) ? 0 : demoAhead(r) ? 1 : 2;
    const stateOf = i => i < stage ? 'done' : i === stage ? (stage === 2 ? 'done' : 'current') : 'todo';
    const steps = [
      { title: 'Draft', state: stateOf(0), detail: isNew ? `${badge('unsaved', 'New – not saved')}` : d ? `${badge('unsaved')} Not saved yet` : r.draft
        ? `${r.draft.changesRequested ? badge('changes') : r.review ? badge('review') : badge('draft', 'Saved')} ${when(lastEvent(r, 'draft'))}` : 'No open draft' },
      { title: 'Demo', state: stateOf(1), detail: r && r.demo ? `${badge('demo', `v${r.demo}`)} ${when(lastEvent(r, 'demo', r.demo))}` : 'Nothing on demo' },
      { title: 'Production', state: stateOf(2), detail: r && r.production ? `${badge('production', `v${r.production}`)} ${when(lastEvent(r, 'production', r.production))}` : 'Not published' }
    ];
    reason = {};
    const acts = [];
    const add = (key, label, variant, ok, why, icon) => {
      acts.push(btn({ label, icon, variant, size: 'sm', attrs: `data-lc="${key}" ${ok ? '' : `aria-disabled="true" aria-describedby="why-${key}"`}` }));
      if (!ok) reason[key] = why;
    };
    const hasDraft = r && r.draft, draftOnly = !!opts.draftOnly;
    const next = d || isNew ? 'save' : hasDraft ? (may('deployDemo') ? 'deploy' : 'review') : demoAhead(r) ? 'publish' : null;
    const v = k => (k === next ? 'primary' : 'secondary');
    if (!isNew && d) acts.push(btn({ label: 'Discard changes', variant: 'text', size: 'sm', attrs: 'data-lc="discard"' }));
    else if (hasDraft && may('saveDraft')) acts.push(btn({ label: 'Discard draft', variant: 'text', size: 'sm', attrs: 'data-lc="discardDraft"' }));
    if (r && !r.production && !r.demo && may('saveDraft')) acts.push(btn({ label: 'Delete', icon: 'delete', variant: 'text', size: 'sm', attrs: 'data-lc="delete"' }));
    if (may('saveDraft')) add('save', isNew ? (opts.newSaveLabel ? opts.newSaveLabel() : 'Save as draft') : 'Save draft', v('save'), d || isNew, 'There are no unsaved changes to save.', 'save');
    if (!isNew && may('requestReview') && !may('deployDemo')) add('review', r.review ? 'Review requested' : 'Request review', v('review'), !!hasDraft && !d && !r.review,
      d ? 'Save the draft before you request a review.' : r.review ? 'A review is already requested for this draft.' : 'Save a draft first, then request a review.', 'rate_review');
    if (!isNew && !draftOnly && may('deployDemo')) add('deploy', 'Deploy to demo', v('deploy'), !!hasDraft && !d, d ? 'Save the draft first. Demo only takes saved drafts.' : 'Save a draft first. Demo only takes saved drafts.', 'science');
    if (!isNew && !draftOnly && may('requestChanges') && demoAhead(r)) acts.push(btn({ label: 'Request changes', icon: 'undo', variant: 'secondary', size: 'sm', attrs: 'data-lc="changes"' }));
    if (!isNew && !draftOnly && may('publish') && hasDraft) add('direct', 'Publish directly', 'secondary', !d, 'Save the draft first. Only saved drafts can be published.', 'bolt');
    if (!isNew && !draftOnly && may('publish')) add('publish', 'Publish to production', v('publish'), demoAhead(r), r && r.production ? `Production v${r.production} already matches demo. Deploy a new version to demo first.` : 'Deploy to demo and check it there first.', 'public');
    const lvl = levelOf(role(), opts.area);
    const note = lvl === 'view' ? `You can view this ${opts.noun}. Your role, ${ROLES[role()].label}, can’t change it.`
      : !may('deployDemo') ? `As ${ROLES[role()].label}, you can save drafts and request a review. An Admin or Super Admin deploys to demo and publishes.`
      : !may('publish') ? `As ${ROLES[role()].label}, you can deploy to demo. An Admin or Super Admin publishes to production.` : '';
    const status = !draftOnly ? '' : d || isNew ? `${badge('unsaved', isNew ? 'New – not saved' : 'Unsaved changes')}<span>Save a draft, then deploy it from the Publishing bar.</span>`
      : hasDraft ? `${r.draft.changesRequested ? badge('changes') : r.review ? badge('review') : badge('draft', 'Saved draft')}<span>${when(lastEvent(r, 'draft'))}. Deploy it with the other drafts from the Publishing bar.</span>`
      : `${r.production ? badge('production', `Production v${r.production}`) : ''}${demoAhead(r) ? badge('demo', `Demo v${r.demo}`) : ''}<span>No open draft. Edit below to start one.</span>`;
    /* Full mode, same row: where the newest changes are, as three tags */
    const chips = `${d || isNew ? badge('unsaved', isNew ? 'New – not saved' : 'Unsaved changes') : hasDraft ? (r.draft.changesRequested ? badge('changes') : r.review ? badge('review') : badge('draft', 'Saved draft')) : '<span class="muted">No open draft</span>'}
      ${r && r.demo ? badge('demo', `Demo v${r.demo}`) : ''}${r && r.production ? badge('production', `Production v${r.production}`) : '<span class="muted">Not published</span>'}`;
    host.innerHTML = `<div class="lc-row"><h2 id="lc-h" class="lc-row-h" tabindex="-1">${draftOnly ? 'Draft' : esc(opts.title ? opts.title() : 'Publishing')}</h2>
      <p class="lc-status">${draftOnly ? status : chips}</p>${acts.length ? `<div class="lc-actions">${acts.join('')}</div>` : ''}</div>`;
    host.innerHTML += `
      ${Object.entries(reason).map(([k, t]) => `<span class="vh" id="why-${k}">${esc(t)}</span>`).join('')}
      ${note ? `<p class="role-note">${ic('info', 20)}<span>${esc(note)} Permissions are proposed, pending confirmation.</span></p>` : ''}`;
    host.onclick = e => { const b = e.target.closest('[data-lc]'); if (b) act(b); };
  }

  async function act(b) {
    const key = b.dataset.lc;
    if (b.getAttribute('aria-disabled') === 'true') { toast(reason[key]); return; }
    const r = opts.getRec();
    const run = async (fn, busyLabel, msg, kind) => {
      setBusy(b, true, busyLabel);
      try { const rec = await fn(); opts.onSaved(rec, kind); renderFeatureBar(); toast(msg, { kind: 'success' }); announce(msg); }
      catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
    };
    const needComment = DB.db.settings.requirePublishComment;
    if (key === 'save') {
      if (opts.validate && !opts.validate()) { toast('Fix the highlighted fields, then save again.', { kind: 'error' }); return; }
      if (opts.isNew && opts.isNew()) return run(() => opts.create(opts.getWorking()), 'Saving draft', (opts.createdMsg && opts.createdMsg()) || `Draft saved. The ${opts.noun} isn’t on demo or production yet.`, 'created');
      return run(() => ConfigService.saveDraft(r.id, opts.getWorking(), ''), 'Saving draft', 'Draft saved. It isn’t on demo or production yet.', 'save');
    }
    if (key === 'discard') {
      const base = r.draft ? r.draft.data : dataAt(r, 'production') || dataAt(r, 'demo');
      const c = await confirmDialog({ title: 'Discard unsaved changes?', body: `<p>The editor goes back to ${r.draft ? 'your saved draft' : `production v${r.production}`}. These changes are lost:</p>${changeList(opts.describe(base, opts.getWorking()))}`, confirmLabel: 'Discard changes', variant: 'danger', cancelLabel: 'Keep editing' });
      if (c.ok) { opts.onDiscard(); announce('Changes discarded'); }
      return;
    }
    if (key === 'discardDraft') {
      const c = await confirmDialog({ title: 'Discard the saved draft?', body: `<p>The draft is deleted${r.production ? ` and the editor goes back to production v${r.production}` : ''}. Demo and production don’t change.</p>`, confirmLabel: 'Discard draft', variant: 'danger' });
      if (c.ok) run(() => ConfigService.discardDraft(r.id), 'Discarding draft', 'Draft discarded.', 'discardDraft');
      return;
    }
    if (key === 'delete') {
      const c = await confirmDialog({ title: `Delete this ${opts.noun}?`, body: `<p>“${esc(r.name)}” has never been published, so it’s deleted for good. The audit log keeps a record.</p>`, confirmLabel: `Delete ${opts.noun}`, variant: 'danger' });
      if (!c.ok) return;
      setBusy(b, true, 'Deleting');
      try { await ConfigService.remove(r.id); toast(`Deleted “${r.name}”.`, { kind: 'success' }); opts.afterDelete(); }
      catch (err) { setBusy(b, false); toast(err.message, { kind: 'error', ms: 8000 }); }
      return;
    }
    if (key === 'review') {
      const c = await confirmDialog({ title: 'Request a review?', body: '<p>An Admin or Super Admin checks the draft and deploys it to demo. The request shows on their Dashboard.</p>', confirmLabel: 'Request review', comment: { label: 'Note for the reviewer', hint: 'Optional' } });
      if (c.ok) run(() => ConfigService.requestReview(r.id, c.comment), 'Requesting review', 'Review requested.', 'review');
      return;
    }
    if (key === 'deploy') {
      const c = await confirmDialog({ title: `Deploy to demo as v${r.nextVersion}?`, wide: true, body: `<p>The saved draft becomes version ${r.nextVersion} in the demo environment, for checking on demo devices. ${r.production ? `Production stays on v${r.production}, so patients see no change.` : 'Nothing is in production yet.'}</p><h3 class="sub-h">Changes from ${r.demo ? `demo v${r.demo}` : 'empty'}</h3>${changeList(opts.describe(dataAt(r, 'demo'), r.draft.data))}`, confirmLabel: 'Deploy to demo', comment: { label: 'Comment', hint: 'Optional. Shown in the change history.', value: r.draft.comment || '' } });
      if (c.ok) run(() => ConfigService.deployToDemo(r.id, c.comment), 'Deploying to demo', `Deployed to demo as v${r.nextVersion}. Production is unchanged.`, 'deploy');
      return;
    }
    if (key === 'changes') {
      const c = await confirmDialog({ title: `Request changes to demo v${r.demo}?`, body: '<p>The demo version goes back to a draft with your comment, so it can be fixed and deployed again. Production doesn’t change.</p>', confirmLabel: 'Request changes', comment: { label: 'What needs to change', required: true } });
      if (c.ok) run(() => ConfigService.requestChanges(r.id, c.comment), 'Requesting changes', 'Changes requested. The demo version is back in draft.', 'changes');
      return;
    }
    if (key === 'direct') {
      const c = await confirmDialog({ title: `Publish the draft directly as v${r.nextVersion}?`, wide: true, body: `<div class="warn-box">${ic('bolt', 20)}<p>This skips demo: the draft goes straight to production, where patients see it, without a check on test devices. In this prototype, publishing is simulated.</p></div>
        <h3 class="sub-h">Changes from ${r.production ? `production v${r.production}` : 'nothing published'}</h3>${changeList(opts.describe(dataAt(r, 'production'), r.draft.data))}`,
        confirmLabel: 'Publish directly', variant: 'danger', comment: { label: 'Comment', required: needComment, hint: needComment ? 'Required by Administrative settings.' : 'Optional. Shown in the change history.' } });
      if (c.ok) run(() => ConfigService.publishDirect(r.id, c.comment), 'Publishing', `Published the draft directly to production as v${r.nextVersion}.`, 'publish');
      return;
    }
    if (key === 'publish') {
      const c = await confirmDialog({ title: `Publish v${r.demo} to production?`, wide: true, body: `<div class="warn-box">${ic('public', 20)}<p>Production is what patients see in the MyCare app. In this prototype, publishing is simulated.</p></div>
        <h3 class="sub-h">Changes from ${r.production ? `production v${r.production}` : 'nothing published'}</h3>${changeList(opts.describe(dataAt(r, 'production'), r.versions[r.demo].data))}
        ${r.draft || opts.isDirty() ? '<p class="muted">Your open draft isn’t included. Only the version checked on demo is published.</p>' : ''}`,
        confirmLabel: `Publish v${r.demo}`, comment: { label: 'Comment', required: needComment, hint: needComment ? 'Required by Administrative settings.' : 'Optional. Shown in the change history.' } });
      if (c.ok) run(() => ConfigService.publish(r.id, c.comment), 'Publishing', `Published v${r.demo} to production.`, 'publish');
    }
  }
  return { render };
}

/* Change history table with rollback where the type supports it */

function mountHistory({ hostId = 'hist', getRec, describe, onSaved }) {

      { key: 'comment', label: 'Comment', render: v => v.comment ? esc(v.comment) : '<span class="muted">None</span>', cls: 'wrap' },
      { key: 'where', label: 'Where', render: v => `<span class="badges">${where(getRec(), v.version)}</span>` },
      { key: 'acts', label: 'Actions', hideLabel: true, render: v => { const r = getRec(); return `<span class="row-acts">${btn({ label: 'View', icon: 'visibility', variant: 'text', size: 'sm', attrs: `data-vview="${v.version}" aria-label="View version ${v.version}"` })}${canRb() && v.version !== r.production ? btn({ label: 'Roll back', icon: 'history', variant: 'text', size: 'sm', attrs: `data-rollback="${v.version}" aria-label="Roll back to version ${v.version}"` }) : ''}</span>`; } }

function visibleNav(role) {
  return NAV.map(sec => ({ ...sec, items: sec.items.filter(i => can(role, i.area, 'view')) })).filter(sec => sec.items.length);
}
const initials = u => `${u.first[0]}${u.last[0]}`;

function renderShell() {
  const app = $('#app');
  app.className = 'app';
  app.innerHTML = `
    <a class="skip" href="#main" data-skip>Skip to main content</a>
    <header class="topbar">
      <button type="button" class="nav-toggle btn btn-text btn-icon" aria-controls="sidebar" aria-expanded="false" aria-label="Show navigation">${ic('menu')}</button>
      <button type="button" class="rail-toggle btn btn-text btn-icon" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse navigation" title="Collapse navigation">${ic('left_panel_close')}</button>
      <a class="brand" href="#dashboard" aria-label="UTSW MyCare Admin, go to the dashboard"><img src="${LOGO_REVERSED}" alt="" width="200"><span class="brand-admin" aria-hidden="true">Admin</span></a>
      <div class="user" id="user"></div>
    </header>
    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Admin sections"></nav>
      <div class="scrim" id="scrim" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>`;
  $('[data-skip]').addEventListener('click', e => { e.preventDefault(); $('#main').focus(); });
  const toggle = $('.nav-toggle'), side = $('#sidebar'), scrim = $('#scrim');
  const setNav = open => {
    app.classList.toggle('nav-open', open); toggle.setAttribute('aria-expanded', open);
    toggle.setAttribute('aria-label', open ? 'Hide navigation' : 'Show navigation'); scrim.hidden = !open;
    if (open) { const a = $('[aria-current="page"]', side) || $('a,button', side); a && a.focus(); }
  };
  toggle.onclick = () => setNav(!app.classList.contains('nav-open'));
  /* Desktop: collapse to an icon rail, or expand to the full sidebar */
  const railBtn = $('.rail-toggle');
  const syncRail = () => {
    app.classList.toggle('nav-rail', Rail.on);
    railBtn.setAttribute('aria-expanded', String(!Rail.on));
    const l = Rail.on ? 'Expand navigation' : 'Collapse navigation';
    railBtn.setAttribute('aria-label', l); railBtn.title = l;
    railBtn.innerHTML = Rail.on ? ic('left_panel_open') : ic('left_panel_close');
  };
  railBtn.onclick = () => {
    Rail.on = !Rail.on; try { localStorage.setItem(RAIL_KEY, Rail.on ? '1' : '0'); } catch (e) { /* not stored */ }
    syncRail(); closeFly(); renderSidebar(renderSidebar.route);
  };
  syncRail();
  window.matchMedia('(min-width: 1024px)').addEventListener('change', () => { closeFly(); renderSidebar(renderSidebar.route); });
  /* In the rail, a section opens as a flyout beside its icon */
  const closeFly = (focusHead) => {
    const open = $('.nav-sub.fly:not([hidden])', side); if (!open) return;
    open.hidden = true; const h = $(`[aria-controls="${open.id}"]`, side); h.setAttribute('aria-expanded', 'false');
    if (focusHead) h.focus();
  };
  document.addEventListener('click', e => { if (Rail.active() && !e.target.closest('.nav-sec')) closeFly(); });
  side.addEventListener('keydown', e => { if (e.key === 'Escape' && Rail.active() && $('.nav-sub.fly:not([hidden])', side)) { e.stopPropagation(); closeFly(true); } });
  side.addEventListener('scroll', () => closeFly());
  scrim.onclick = () => { setNav(false); toggle.focus(); };
  side.addEventListener('keydown', e => { if (e.key === 'Escape' && app.classList.contains('nav-open')) { setNav(false); toggle.focus(); } });
  side.addEventListener('click', e => { if (e.target.closest('a')) setNav(false); });
  side.addEventListener('click', e => {
    const b = e.target.closest('[data-sec]'); if (!b) return;
    const id = b.dataset.sec, open = b.getAttribute('aria-expanded') !== 'true';
    if (Rail.active()) {
      closeFly(); if (!open) return;
      const sub = $(`#nav-${id}`), r = b.getBoundingClientRect();
      sub.hidden = false; b.setAttribute('aria-expanded', 'true');
      sub.style.top = `${Math.max(8, Math.min(r.top, window.innerHeight - sub.offsetHeight - 8))}px`;
      const first = $('a', sub); if (first && e.detail === 0) first.focus();
      return;
    }
    open ? navOpen.add(id) : navOpen.delete(id);
    b.setAttribute('aria-expanded', open); $(`#nav-${id}`).hidden = !open;
  });
  renderUser();
}

function renderSidebar(currentRoute) {
  const side = $('#sidebar'); if (!side) return;
  renderSidebar.route = currentRoute;
  const role = Session.role(), rail = Rail.active();
  const cur = currentRoute && currentRoute.section ? currentRoute.section.id : null;
  /* Moving to another section closes the rest; toggles made by hand last until then */
  if (cur && cur !== renderSidebar.last) { navOpen.clear(); navOpen.add(cur); renderSidebar.last = cur; }
  const link = (item, label, nested) => {
    const here = currentRoute && currentRoute.item === item;
    return `<a href="#${item.route}" class="nav-link${nested ? ' nested' : ''}" ${here ? 'aria-current="page"' : ''}${rail && !nested ? ` title="${esc(label)}"` : ''}><span class="nav-l">${esc(label)}</span></a>`;
  };
  side.innerHTML = `<ul class="nav">${visibleNav(role).map(sec => {
    if (sec.items.length === 1 && NAV.find(s => s.id === sec.id).items.length === 1) {
      return `<li class="nav-sec single">${link(sec.items[0], sec.label).replace('<span class="nav-l">', `${ic(sec.icon, 20)}<span class="nav-l">`)}</li>`;
    }
    const open = navOpen.has(sec.id) && !rail;
    const here = cur === sec.id;
    return `<li class="nav-sec${here ? ' here' : ''}">
      <button type="button" class="nav-head" data-sec="${sec.id}" aria-expanded="${open}" aria-controls="nav-${sec.id}"${rail ? ` title="${esc(sec.label)}"` : ''}>${ic(sec.icon, 20)}<span class="nav-l">${esc(sec.label)}</span>${ic('expand_more', 20, 'chev')}</button>
      <ul class="nav-sub${rail ? ' fly' : ''}" id="nav-${sec.id}" data-label="${esc(sec.label)}" ${open ? '' : 'hidden'}>${sec.items.map(i => `<li>${link(i, i.label, true)}</li>`).join('')}</ul>
    </li>`;
  }).join('')}</ul>
  <p class="nav-foot">${badge('pending', 'Role access: proposed')}<span>Navigation follows the proposed permission matrix for ${esc(ROLES[role].label)}.</span></p>`;
}

function renderUser() {
  const u = Session.user(), role = Session.role(), host = $('#user');
  host.innerHTML = `
    <button type="button" class="user-btn" aria-expanded="false" aria-controls="user-menu">
      <span class="avatar" aria-hidden="true">${esc(initials(u))}</span>
      <span class="user-txt"><span class="user-n">${esc(u.first)} ${esc(u.last)}</span><span class="user-r">${esc(ROLES[role].label)}</span></span>
      ${ic('expand_more', 20)}
    </button>
    <div class="user-menu" id="user-menu" hidden>
      <div class="um-id"><p class="um-n">${esc(u.first)} ${esc(u.last)}</p><p class="um-e">${esc(u.email)}</p><p class="um-s"><span class="role-tag">${esc(ROLES[role].label)}</span></p></div>
      <div class="um-acts">
        <button type="button" class="um-act" data-um="profile">${ic('person', 20)}<span>My profile</span></button>
        <button type="button" class="um-act" data-um="signout">${ic('logout', 20)}<span>Sign out</span></button>
      </div>
    </div>`;
  const b = $('.user-btn', host), menu = $('#user-menu');
  const set = open => { menu.hidden = !open; b.setAttribute('aria-expanded', open); if (open) $('.um-act', menu).focus(); };
  b.onclick = () => set(menu.hidden);
  host.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { set(false); b.focus(); } });
  document.onclick = e => { const m = $('#user-menu'); if (m && !m.hidden && !$('#user').contains(e.target)) { m.hidden = true; $('.user-btn').setAttribute('aria-expanded', 'false'); } };
  menu.addEventListener('click', async e => {
    const a = e.target.closest('[data-um]'); if (!a) return;
    set(false);
    if (a.dataset.um === 'profile') { Router.go('profile'); return; }
    if (a.dataset.um === 'signout') { if (await Router.canLeave()) { Session.end(); Router.go('signed-out', { force: true }); } else b.focus(); }
  });
}

/* Page heading with breadcrumbs */
function pageHead({ crumbs, title, lede = '', badges = '', actions = '' }) {
  return `<div class="page-head">
    ${crumbs.length ? `<nav aria-label="Breadcrumb" class="crumbs"><ol>${crumbs.map(([label, href]) => `<li>${href ? `<a href="#${href}">${esc(label)}</a>` : `<span>${esc(label)}</span>`}</li>`).join('')}<li><span aria-current="page">${esc(title)}</span></li></ol></nav>` : ''}
    <div class="ph-row"><div class="ph-main"><h1 id="page-h" tabindex="-1">${esc(title)}</h1>${badges ? `<div class="ph-badges">${badges}</div>` : ''}</div>${actions ? `<div class="ph-actions">${actions}</div>` : ''}</div>
    ${lede ? `<p class="lede">${lede}</p>` : ''}
  </div>`;
}
const crumbsFor = r => {
  const c = [];
  if (r.section.items.length > 1) c.push([r.section.label, null]);
  if (r.parent) c.push([r.parent.label, r.parent.route]);
  return c;
};

/* ===== src/app/router.js ===== */
/* ---------- Hash router with session and role guards ----------
   Public routes: login, mfa, signed-out, expired. Everything else needs the simulated session,
   and a role that can view the page's area; otherwise the access-denied view shows in place. */
const DEFAULT_ROUTE = 'dashboard';
const PUBLIC_PAGES = {};  /* filled by pages/auth.js */
const BUILT_PAGES = {};   /* filled by built pages, keyed by route */

function matchRoute(name) {
  const exact = ROUTES.find(r => r.pattern === name);
  if (exact) return { route: exact, params: {} };
  for (const r of ROUTES) {
    if (!r.pattern.endsWith('-:id')) continue;
    const pre = r.pattern.slice(0, -3);
    if (name.startsWith(pre) && name.length > pre.length && !ROUTES.some(x => x.pattern === name)) return { route: r, params: { id: name.slice(pre.length) } };
  }
  return null;
}

const Router = {
  current: null, active: null, loaded: false, guardFn: null, returnTo: null, skipNext: false,
  setGuard(fn) { this.guardFn = fn; },
  clearGuard() { this.guardFn = null; },
  async canLeave() { return this.guardFn ? await this.guardFn() : true; },
  go(name, { force = false } = {}) {
    if (force) this.clearGuard();
    if (location.hash.slice(1) === name) this.resolve(); else location.hash = name;
  },
  refresh() { this.resolve(true); },
  async onHash() {
    if (this.skipNext) { this.skipNext = false; return; }
    const next = location.hash.slice(1);
    if (this.guardFn && next !== this.current) {
      const ok = await this.guardFn();
      if (!ok) { history.replaceState(null, '', `#${this.current}`); return; }
      this.clearGuard();
    }
    this.resolve();
  },
  resolve(isRefresh = false) {
    const name = location.hash.slice(1) || DEFAULT_ROUTE;
    if (this.active && this.active.leave) this.active.leave();
    this.active = null;
    this.current = name;
    if (PUBLIC_PAGES[name]) { document.body.classList.remove('signed-in'); PUBLIC_PAGES[name](); this.loaded = true; return; }
    if (!Session.current()) { this.returnTo = name; history.replaceState(null, '', '#login'); this.current = 'login'; PUBLIC_PAGES.login(); this.loaded = true; return; }
    if (Session.expired()) { Session.end(); history.replaceState(null, '', '#expired'); this.current = 'expired'; return PUBLIC_PAGES.expired(); }
    Session.touch(); saveDb();
    if (!document.body.classList.contains('signed-in') || !$('#main')) { document.body.classList.add('signed-in'); renderShell(); }
    const main = $('#main');
    const role = Session.role();
    const m = name === 'denied' ? null : matchRoute(name);
    let title;
    if (name === 'denied') { title = 'Access denied'; renderSidebar(null); main.innerHTML = deniedView(null); }
    else if (!m) { title = 'Page not found'; renderSidebar(null); main.innerHTML = notFoundView(name); }
    else if (!can(role, m.route.item.area, 'view')) { title = 'Access denied'; renderSidebar(m.route); main.innerHTML = deniedView(m.route); }
    else {
      renderSidebar(m.route);
      title = m.route.title;
      const page = BUILT_PAGES[m.route.pattern];
      if (page) { this.active = page; page.render(main, { route: m.route, params: m.params, role }); }
      else { title = 'Page not found'; main.innerHTML = notFoundView(name); }
    }
    document.title = `${title} – MyCare Admin (prototype)`;
    /* Move focus to the new heading on navigation, but not on first load, so Tab starts at the skip link */
    if (!isRefresh && this.loaded) { const h = $('#page-h'); (h || main).focus({ preventScroll: true }); window.scrollTo(0, 0); }
    this.loaded = true;
    announce(`${title} page`);
  }
};
window.addEventListener('hashchange', () => Router.onHash());
