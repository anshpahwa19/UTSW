    try { recs = (await ConfigService.list()).filter(r => r.type === 'campaign' || r.type === 'alert'); } catch (err) { $('#tg').innerHTML = errorState(err.message); $('[data-retry]').onclick = () => this.render(main); return; }
    const opts = segmentOptions();
    $('#tg').innerHTML = `<section class="card"><div class="card-body" id="tg-t"></div></section><p class="note-line">${ic('info', 20)}<span>Home module visibility by segment and notification targeting are set on the Home screen layout (per audience) and on each notification.</span></p>`;
    const draw = () => dataTable($('#tg-t'), { id: 'tg', caption: 'Targeting', noun: 'item', rows: recs, searchText: r => r.name, defaultSort: { key: 'name', dir: 'asc' },
      filters: [{ key: 'type', label: 'Type', options: [['campaign', 'Campaigns'], ['alert', 'Emergency alerts']], match: (r, v) => r.type === v }],
      columns: [
        { key: 'name', label: 'Item', sortable: true, sortValue: r => r.name.toLowerCase(), render: r => `<a class="row-link" href="#${recLink(r)}">${esc(r.name)}</a><br><span class="muted">${esc(TYPE_LABEL(r.type))}</span>` },
        { key: 'seg', label: 'Segment', render: r => { const area = CONFIG_TYPES[r.type].area, ok = can(Session.role(), area, 'draft'); return ok ? `<label class="vh" for="tg-${r.id}">Segment for ${esc(r.name)}</label><select class="input input-sm" id="tg-${r.id}" data-tg="${r.id}">${opts.map(([v, l]) => `<option value="${v}" ${v === latestData(r).audience ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>` : esc(segmentName(latestData(r).audience)); } },
        { key: 'live', label: 'In production', render: r => { const d = dataAt(r, 'production'); return d ? esc(segmentName(d.audience)) : '<span class="muted">Not published</span>'; } },
        { key: 'status', label: 'Publishing', render: envBadges }] });
    draw();
    $('#tg').addEventListener('change', async e => {
      const sel = e.target.closest('[data-tg]'); if (!sel) return;
      const r = recs.find(x => x.id === sel.dataset.tg), data = { ...clone(latestData(r)), audience: sel.value };
      sel.disabled = true;
      try { const nr = await ConfigService.saveDraft(r.id, data, `Audience changed to ${segmentName(sel.value)}`); recs = recs.map(x => x.id === nr.id ? nr : x); draw(); toast(`${r.name}: draft saved with audience ${segmentName(sel.value)}. Deploy it to demo from the item.`, { kind: 'success' }); const again = $(`#tg-${r.id}`); again && again.focus(); }
      catch (err) { sel.disabled = false; toast(err.message, { kind: 'error', ms: 8000 }); }
    });
  }
};

/* ---- Zero-result queries → add a synonym or mapping, or dismiss ---- */
BUILT_PAGES['search-zero-results'] = {
  async render(main) {
    const canFix = can(Session.role(), 'search', 'publish');
    main.innerHTML = `<div class="page">${pageHead({ crumbs: [['Search configuration', null]], title: 'Zero-result queries', badges: badge('mock'), lede: 'Searches that returned nothing in the last 30 days. Add a synonym or mapping so they find something next time. The data source is pending (§10.12).' })}<div id="zr">${loadingState('Loading searches')}</div></div>`;
    let list;
    const load = async () => {
      try { list = await ZeroResultService.list(); } catch (err) { $('#zr').innerHTML = errorState(err.message); $('[data-retry]').onclick = load; return; }
      $('#zr').innerHTML = `<section class="card"><div class="card-body" id="zr-t"></div></section>`;
      dataTable($('#zr-t'), { id: 'zr', caption: 'Zero-result queries', noun: 'query', rows: list, defaultSort: { key: 'count', dir: 'desc' }, searchText: z => z.query, initialFilters: { status: 'open' },
        filters: [{ key: 'status', label: 'Status', options: [['open', 'Open'], ['resolved', 'Fixed'], ['dismissed', 'Dismissed']], match: (z, v) => z.status === v }],
        empty: { icon: 'task_alt', title: 'No zero-result searches', text: '' },
        columns: [
          { key: 'query', label: 'Search', sortable: true, render: z => `“${esc(z.query)}”` },
          { key: 'count', label: 'Times searched', sortable: true, render: z => z.count.toLocaleString('en-US'), cls: 'num' },
          { key: 'lastSeen', label: 'Last seen', sortable: true, render: z => esc(fmtDate(z.lastSeen)) },
          { key: 'status', label: 'Status', render: z => badge(...({ open: ['review', 'Open'], resolved: ['live', 'Fixed'], dismissed: ['hidden', 'Dismissed'] })[z.status]) },
          { key: 'acts', label: 'Actions', hideLabel: true, render: z => canFix && z.status === 'open' ? `<span class="row-acts">${btn({ label: 'Add synonym', variant: 'text', attrs: `data-z="syn" data-id="${z.id}"` })}${btn({ label: 'Add mapping', variant: 'text', attrs: `data-z="map" data-id="${z.id}"` })}${btn({ label: `Dismiss “${z.query}”`, icon: 'close', variant: 'text', iconOnly: true, attrs: `data-z="dismiss" data-id="${z.id}"` })}</span>` : '' }] });
    };
    $('#zr').addEventListener('click', async e => {
      const b = e.target.closest('[data-z]'); if (!b) return;
      const z = list.find(x => x.id === b.dataset.id);
      if (b.dataset.z === 'dismiss') { try { await ZeroResultService.setStatus(z.id, 'dismissed'); toast(`Dismissed “${z.query}”.`); load(); } catch (err) { toast(err.message, { kind: 'error' }); } return; }
      const syn = b.dataset.z === 'syn', recId = syn ? 'search-synonyms' : 'search-mappings';
      const sections = syn ? [{ fields: [{ key: 'term', label: 'What patients type', required: true, max: 40 }, { key: 'to', label: 'What it means', required: true, max: 60, type: 'select', options: SPECIALTY_LIST() }] }]
        : [{ fields: [{ key: 'phrase', label: 'Patient phrase', required: true, max: 60 }, { key: 'targetType', label: 'Goes to', type: 'select', options: ['Specialty', 'Condition', 'Scope', 'Content', 'Resource', 'Location'] }, { key: 'target', label: 'Target', required: true, max: 60 }] }];
      const d = await formModal({ title: syn ? `Add a synonym for “${z.query}”` : `Add a mapping for “${z.query}”`, sections, data: syn ? { term: z.query, to: SPECIALTY_LIST()[0] } : { phrase: z.query, targetType: 'Specialty', target: '' }, confirmLabel: 'Save to draft',
        note: `<p class="muted">This saves a draft of ${syn ? 'Synonyms' : 'Query mappings'}. Deploy it to demo and publish it from that page.</p>` });
      if (!d) { b.focus(); return; }
      try {
        const r = ConfigService.peek(recId), data = clone(latestData(r)); data.rows.push({ ...d, id: uid('r') });
        await ConfigService.saveDraft(recId, data, `Fix zero-result search “${z.query}”`);
        await ZeroResultService.setStatus(z.id, 'resolved');
        toast(`Saved to the ${syn ? 'Synonyms' : 'Query mappings'} draft.`, { kind: 'success', action: 'Open', onAction: () => Router.go(syn ? 'search-synonyms' : 'search-query-mappings') });
        load();
      } catch (err) { toast(err.message, { kind: 'error', ms: 8000 }); }
    });
    load();
  }
};

/* ===== src/pages/profile.js ===== */
/* ---------- My profile ----------
   The signed-in person can change their own first and last name. Everything else on the account (email, role,
   status, dates) is shown read only: role and status are changed by a Super Admin in Admin management, and the
   email comes from the UTSW identity provider.
   PASSWORD – SIMULATED. Sign-in is UTSW SSO, so the real password lives with the identity provider (pending, §10.1).
   This form only checks what is typed against the sample rules; nothing is sent or stored, and the fields are
   cleared as soon as the check finishes. */
/* EXTRA_GLYPHS: person lock badge visibility visibility_off */
const PW_MIN = 12;
BUILT_PAGES.profile = {
  async render(main) {
    const u = Session.user(), role = Session.role();
    const name = { first: u.first, last: u.last };
    main.innerHTML = `<div class="page profile">
      ${pageHead({ crumbs: [], title: 'My profile', lede: 'Change your name and password. Your email, role and account status are managed for you.' })}
      <div class="pf-grid">
        <section class="card" aria-labelledby="pf-h">
          <div class="card-head"><h2 id="pf-h">Profile</h2></div>
          <form class="card-body form" id="pf-form" novalidate>
            <div class="pf-me"><span class="avatar lg" aria-hidden="true" id="pf-av">${esc(initials(u))}</span>
              <div><p class="pf-name" id="pf-name">${esc(u.first)} ${esc(u.last)}</p><p class="muted">${esc(u.email)}</p></div></div>
            <div class="form-grid">
              ${['first', 'last'].map(k => `<div class="field" id="pf-${k}-w"><label for="pf-${k}">${k === 'first' ? 'First name' : 'Last name'} <span class="req">(required)</span></label>
                <input class="input" id="pf-${k}" name="${k === 'first' ? 'given-name' : 'family-name'}" autocomplete="${k === 'first' ? 'given-name' : 'family-name'}" maxlength="40" value="${esc(u[k])}" required aria-describedby="pf-${k}-err">
                <p class="err" id="pf-${k}-err" hidden></p></div>`).join('')}
            </div>
            <dl class="facts pf-facts">
              <div><dt>Email</dt><dd>${esc(u.email)}</dd></div>
              <div><dt>Role</dt><dd><span class="role-tag">${esc(ROLES[role].label)}</span></dd></div>
              <div><dt>Status</dt><dd>${esc(u.status === 'active' ? 'Active' : u.status)}</dd></div>
              <div><dt>Member since</dt><dd>${esc(fmtDate(u.created))}</dd></div>
              <div><dt>Last sign-in</dt><dd>${esc(u.lastSignIn ? fmtDateTime(u.lastSignIn) : 'Never')}</dd></div>
            </dl>
            <p class="role-note">${ic('info', 20)}<span>Only your name can be changed here. A Super Admin changes roles and status in Admin management; your email comes from your UTSW account.</span></p>
            <div class="form-acts">${btn({ label: 'Save name', icon: 'save', variant: 'primary', type: 'submit', attrs: 'id="pf-save" disabled' })}</div>
          </form>
        </section>
        <section class="card" aria-labelledby="pw-h">
          <div class="card-head"><h2 id="pw-h">Password</h2><div class="card-actions">${badge('simulated', 'Simulated')}</div></div>
          <form class="card-body form" id="pw-form" novalidate>
            <p class="note-line">${ic('lock', 20)}<span>You sign in with UTSW SSO, so your real password belongs to your UTSW account. This prototype only checks the form: nothing is sent or stored.</span></p>
            ${[['cur', 'Current password', 'current-password'], ['new', 'New password', 'new-password'], ['cnf', 'Confirm new password', 'new-password']].map(([k, l, ac]) => `
              <div class="field" id="pw-${k}-w"><label for="pw-${k}">${l} <span class="req">(required)</span></label>
                <div class="pw-wrap"><input class="input" type="password" id="pw-${k}" autocomplete="${ac}" required aria-describedby="${k === 'new' ? 'pw-rules ' : ''}pw-${k}-err">
                <button type="button" class="pw-eye btn btn-text btn-icon" data-eye="pw-${k}" aria-label="Show ${l.toLowerCase()}" aria-pressed="false">${ic('visibility', 20)}</button></div>
                <p class="err" id="pw-${k}-err" hidden></p></div>`).join('')}
            <ul class="pw-rules" id="pw-rules" aria-label="Password rules">
              <li data-rule="len">At least ${PW_MIN} characters</li><li data-rule="mix">Letters and at least one number</li><li data-rule="diff">Different from your current password</li></ul>
            <div class="form-acts">${btn({ label: 'Change password', icon: 'lock', variant: 'primary', type: 'submit', attrs: 'id="pw-go"' })}</div>
          </form>
        </section>
      </div></div>`;

    /* ---- Name ---- */
    const f = $('#pf-form'), save = $('#pf-save');
    const val = () => ({ first: $('#pf-first').value.trim(), last: $('#pf-last').value.trim() });
    const dirty = () => { const v = val(); return v.first !== name.first || v.last !== name.last; };
    const setErr = (k, msg, pre = 'pf') => { const w = $(`#${pre}-${k}-w`), e = $(`#${pre}-${k}-err`), i = $(`#${pre}-${k}`); w.classList.toggle('has-error', !!msg); e.hidden = !msg; e.innerHTML = msg ? `${ic('error', 16)}<span>${esc(msg)}</span>` : ''; msg ? i.setAttribute('aria-invalid', 'true') : i.removeAttribute('aria-invalid'); };
    f.addEventListener('input', () => { save.disabled = !dirty(); ['first', 'last'].forEach(k => { if ($(`#pf-${k}`).value.trim()) setErr(k, ''); }); });
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const v = val(), bad = [];
      ['first', 'last'].forEach(k => { const m = !v[k] ? `Enter your ${k} name.` : /[<>]/.test(v[k]) ? 'Use letters, spaces, hyphens or apostrophes.' : ''; setErr(k, m); if (m) bad.push(k); });
      if (bad.length) { $(`#pf-${bad[0]}`).focus(); return; }
      setBusy(save, true, 'Saving');
      try {
        await UserService.updateOwnName(v.first, v.last);
        Object.assign(name, v);
        $('#pf-name').textContent = `${v.first} ${v.last}`; $('#pf-av').textContent = `${v.first[0]}${v.last[0]}`;
        renderUser(); setBusy(save, false); save.disabled = true;
        toast('Your name is saved.', { kind: 'success' }); announce('Your name is saved.');
      } catch (err) { setBusy(save, false); toast(err.message, { kind: 'error', ms: 8000 }); }
    });

    /* ---- Password (simulated) ---- */
    const pw = $('#pw-form');
    const rules = () => { const n = $('#pw-new').value, c = $('#pw-cur').value; return { len: n.length >= PW_MIN, mix: /[a-z]/i.test(n) && /\d/.test(n), diff: !!n && n !== c }; };
    const paint = () => { const r = rules(); $$('#pw-rules li').forEach(li => li.classList.toggle('met', r[li.dataset.rule])); };
    pw.addEventListener('input', paint);
    pw.addEventListener('click', e => {
      const b = e.target.closest('[data-eye]'); if (!b) return;
      const i = $(`#${b.dataset.eye}`), show = i.type === 'password';
      i.type = show ? 'text' : 'password'; b.setAttribute('aria-pressed', show); b.innerHTML = ic(show ? 'visibility_off' : 'visibility', 20);
      b.setAttribute('aria-label', `${show ? 'Hide' : 'Show'} ${b.getAttribute('aria-label').replace(/^(Show|Hide) /, '')}`);
    });
    pw.addEventListener('submit', async e => {
      e.preventDefault();
      const cur = $('#pw-cur').value, nw = $('#pw-new').value, cnf = $('#pw-cnf').value, r = rules(), bad = [];
      const m = {
        cur: !cur ? 'Enter your current password.' : '',
        new: !nw ? 'Enter a new password.' : !r.len ? `Use at least ${PW_MIN} characters.` : !r.mix ? 'Use letters and at least one number.' : !r.diff ? 'Choose a password different from your current one.' : '',
        cnf: !cnf ? 'Enter the new password again.' : cnf !== nw ? 'The passwords don’t match.' : ''
      };
      Object.entries(m).forEach(([k, msg]) => { setErr(k, msg, 'pw'); if (msg) bad.push(k); });
      if (bad.length) { $(`#pw-${bad[0]}`).focus(); return; }
      const go = $('#pw-go'); setBusy(go, true, 'Checking');
      await new Promise(res => setTimeout(res, 500));
      ['cur', 'new', 'cnf'].forEach(k => { $(`#pw-${k}`).value = ''; $(`#pw-${k}`).type = 'password'; });
      $$('[data-eye]', pw).forEach(b => { b.setAttribute('aria-pressed', 'false'); b.innerHTML = ic('visibility', 20); });
      paint(); setBusy(go, false);
      toast('Password change simulated. Nothing was sent or stored; your real password is managed by your UTSW account.', { kind: 'success', ms: 7000 });
      announce('Password change simulated.');
      $('#pw-h').setAttribute('tabindex', '-1'); $('#pw-h').focus();
    });
  }
};

/* ===== src/app/boot.js ===== */
/* ---------- Boot ---------- */
loadDb();
startDropdowns();
/* Activity keeps the simulated session alive; a check every 30 seconds ends it after the idle limit */
let lastTouch = 0;
['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => {
  if (!Session.current() || Date.now() - lastTouch < 15000) return;
  lastTouch = Date.now(); Session.touch(); saveDb();
}, { passive: true }));
setInterval(() => { if (Session.expired()) { Session.end(); Router.go('expired', { force: true }); } }, 30000);
window.addEventListener('beforeunload', e => { if (Router.guardFn && $('.badge-unsaved')) { e.preventDefault(); e.returnValue = ''; } });
const markIcons = () => document.documentElement.classList.add('ms-ready');
if (document.fonts && document.fonts.load) {
  document.fonts.load('24px "Material Symbols Rounded"', 'home').then(f => { if (f.length) markIcons(); }).catch(() => {});
  setTimeout(markIcons, 3000);
} else markIcons();
/* ---------- Dashboard-only build (dashboard.html) ----------
   Signed in as the sample Super Admin, the Dashboard is the only page. Every other link and route is locked:
   links stay visible, marked unavailable, and a click explains instead of navigating. */
if (DASHBOARD_ONLY) {
  const ONLY = ['#dashboard', '#main'], MSG = 'Only the Dashboard is available in this preview.';
  const say = () => { if (!$$('.toast-msg').some(t => t.textContent === MSG)) toast(MSG); };
  const ensureSession = () => { if (!Session.current()) { Session.begin('u1'); Session.complete(); } };
  ensureSession();
  document.body.classList.add('dash-only');
  const resolve = Router.resolve.bind(Router);
  Router.resolve = function (isRefresh) {
    ensureSession();
    const name = location.hash.slice(1);
    if (name !== 'dashboard') { history.replaceState(null, '', '#dashboard'); if (this.loaded && name) say(); }
    return resolve(isRefresh);
  };
  const locked = a => a && !ONLY.includes(a.getAttribute('href'));
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]'), um = e.target.closest('[data-um]'), sec = e.target.closest('#sidebar .nav-head');
    if ((a && locked(a)) || um || sec) { e.preventDefault(); e.stopImmediatePropagation(); say(); }
  }, true);
  const mark = () => {
    $$('a[href^="#"]').forEach(a => { if (locked(a) && !a.classList.contains('locked')) { a.classList.add('locked'); a.setAttribute('aria-disabled', 'true'); a.title = 'Not available in this preview'; } });
    $$('[data-um], #sidebar .nav-head').forEach(b => { if (!b.classList.contains('locked')) { b.classList.add('locked'); b.setAttribute('aria-disabled', 'true'); } });
    const head = $('#main .db .page-head');
    if (head && !$('.dash-note', head)) head.insertAdjacentHTML('beforeend', `<p class="note-line dash-note">${ic('lock', 20)}<span>Dashboard preview. Other pages aren’t available in this file.</span></p>`);
  };
  new MutationObserver(mark).observe(document.body, { childList: true, subtree: true });
}
Router.resolve();

})();
</script>
